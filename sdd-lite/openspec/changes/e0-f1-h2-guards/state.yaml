decisions:
  - id: dec-001
    checkpoint_id: ckp-001
    free_text: auto mode, kickoff-defined scope
    rationale: >-
      The kickoff message explicitly defines how to run the story, its scope
      (including the two pre-taken decisions: final check chain per setup
      §5.1, and the 5 rules per setup §5.3), and the closing requirements;
      the session is autonomous. Stage approvals for code-touching work are
      satisfied by this explicit pre-approval; any deviation from the pinned
      scope still stops (protocol B/C).
    recorded_at: "2026-08-01T17:02:29Z"
  - id: dec-002
    free_text: core-no-io-libs forbids all Node builtins in core (bare and node:-prefixed), beyond the §5.3 npm-only sketch
    rationale: >-
      A-level (claude). PRD §4.5 rule 2 is mandatory and names builtins
      (fs, child_process, http); setup §5.3 is a recommendation that
      under-covers it. Blanket ban chosen over an I/O-only subset: strongest
      extraction guarantee, zero cost today (core is import-free), future
      exceptions are explicit reviewed whitelist edits. Not a scope conflict —
      kickoff pinned the rule set, not the sketch matchers. See spec.md
      dec-002.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-003
    free_text: whitelist documented as explicit config comment (zod + builtins ban) plus machine-readable exception
    rationale: A-level (claude). Issue #3 AC2; comment serves humans, exception serves the tool. Spec AC-10.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-004
    free_text: spec pins rule BEHAVIOR + per-rule red proofs as ACs; exact regex syntax delegated to design
    rationale: A-level (claude). Makes correctness observable regardless of §5.3 regex adaptation (risk-001). Spec AC-05..AC-09.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-005
    free_text: add .dependency-cruiser.cjs to biome files.includes
    rationale: A-level (claude). Consistent with H1's allowlist of maintained configs; the gate's own config should pass the gate. Spec AC-13.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-006
    free_text: exact version pin, flagless config auto-discovery, and working NodeNext resolution are spec-level contract (AC-02/AC-03); concrete version and resolver options are design-owned
    rationale: A-level (claude). Spec owns the observable contract; design owns mechanics.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-007
    free_text: pin dependency-cruiser 18.1.0 exact (no ^/~)
    rationale: >-
      A-level (claude). npm latest as of 2026-08-01; engines
      ^22||^24||>=26 fits Node >=22 and the future CI 22/24 matrix;
      v13+ auto-discovers .dependency-cruiser.cjs flaglessly (AC-03);
      exact pin matches H1 devDeps convention. Install via
      `npm install --save-dev --save-exact dependency-cruiser@18.1.0`.
    recorded_at: "2026-08-01T18:05:00Z"
  - id: dec-008
    free_text: options.tsPreCompilationDeps = true
    rationale: >-
      A-level (claude). Type-only imports across forbidden boundaries are
      architectural coupling and must trip the guards even though they
      vanish at compile time (verbatimModuleSyntax makes them explicit);
      also speeds up cruising. See design.md.
    recorded_at: "2026-08-01T18:05:00Z"
  - id: dec-009
    free_text: >-
      core-no-io-libs = dependencyTypes ban list (core + all npm flavors +
      unknown/undetermined/deprecated) with zod pathNot in both bare
      ("^zod(/|$)") and resolved ("^node_modules/zod(/|$)") forms
    rationale: >-
      A-level (claude). Maps 1:1 to spec behavior (any npm except zod, or
      any builtin); builtins are reported with their literal specifier
      (fs / node:fs) and type core; npm packages as node_modules/<pkg>;
      uninstalled specifiers keep the bare name with type unknown —
      verified against v18.1.0 source. Accepted side effect: a typo'd
      relative import in core trips this rule as unknown (tsc fails on it
      anyway).
    recorded_at: "2026-08-01T18:05:00Z"
  - id: dec-010
    free_text: >-
      red-proof protocol: per rule, run `npx depcruise src` directly and
      require output naming exactly the target rule (non-zero exit); one
      proof (AC-06) additionally shows full `npm run check` red; fixtures
      are one-line side-effect imports in existing placeholders (plus one
      temp file for AC-07), each tripping exactly one rule, fully reverted
    rationale: >-
      A-level (claude). Implements spec risk-004 mitigation with
      deterministic attribution; fixture matrix cross-checked against all
      5 rules in design.md.
    recorded_at: "2026-08-01T18:05:00Z"
  - id: dec-011
    free_text: >-
      risk-005 fired during S1: dependency-cruiser 18.1.0 is incompatible
      with typescript 7.0.2 (declared support ">=2.0.0 <7.0.0") — depcruise
      cruises 0 modules and exits 0, so the guard is silently inert. S1
      stopped per protocol C; no autonomous fallback applied.
    rationale: >-
      C-level (claude→user, RESOLVED). Plan pinned this exact
      trigger with "no autonomous fallback": re-pinning typescript revisits
      H1's kept-7.0.2 decision (out of this story's scope), and adding an
      alternative transpiler (@swc/core) expands blast radius beyond the
      approved four files. Evidence in execution-log.md S1 entry (command
      trail items 6-8). Options presented to the user: (1) re-pin typescript
      to a dc-supported line (dc suggests ^6; H1 fallback was 5.9.3); (2) add
      @swc/core as dc transpiler with a design amendment; (3) defer the
      story until dc ships TS 7 support.
    recorded_at: "2026-08-01T18:50:00Z"
    resolution: >-
      USER DECIDED (2026-08-01, in-session consultation): option 1 — re-pin
      typescript to 5.9.3 exact, H1's pre-authorized fallback line. tsc
      5.9.3 validating the setup §5.2 strict flag set was the explicit
      condition of that H1 fallback, so the pin change is bounded; returning
      to the 7.x line becomes a future story once dependency-cruiser ships
      TS 7 support (note to be left in .dependency-cruiser.cjs). design.md
      needs no amendment (it pins dc, not typescript); the executor records
      the re-pin as a deviation referencing this decision. Authorship:
      claude→user.
