      scope still stops (protocol B/C).
    recorded_at: "2026-08-01T17:02:29Z"
  - id: dec-002
    free_text: core-no-io-libs forbids all Node builtins in core (bare and node:-prefixed), beyond the §5.3 npm-only sketch
    rationale: >-
      A-level (claude). PRD §4.5 rule 2 is mandatory and names builtins
      (fs, child_process, http); setup §5.3 is a recommendation that
      under-covers it. Blanket ban chosen over an I/O-only subset: strongest
      extraction guarantee, zero cost today (core is import-free), future
      exceptions are explicit reviewed whitelist edits. Not a scope conflict —
      kickoff pinned the rule set, not the sketch matchers. See spec.md
      dec-002.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-003
    free_text: whitelist documented as explicit config comment (zod + builtins ban) plus machine-readable exception
    rationale: A-level (claude). Issue #3 AC2; comment serves humans, exception serves the tool. Spec AC-10.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-004
    free_text: spec pins rule BEHAVIOR + per-rule red proofs as ACs; exact regex syntax delegated to design
    rationale: A-level (claude). Makes correctness observable regardless of §5.3 regex adaptation (risk-001). Spec AC-05..AC-09.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-005
    free_text: add .dependency-cruiser.cjs to biome files.includes
    rationale: A-level (claude). Consistent with H1's allowlist of maintained configs; the gate's own config should pass the gate. Spec AC-13.
    recorded_at: "2026-08-01T17:35:00Z"
  - id: dec-006
    free_text: exact version pin, flagless config auto-discovery, and working NodeNext resolution are spec-level contract (AC-02/AC-03); concrete version and resolver options are design-owned
    rationale: A-level (claude). Spec owns the observable contract; design owns mechanics.
    recorded_at: "2026-08-01T17:35:00Z"
open_risks:
  - id: risk-001
    severity: medium
    summary: >-
      Setup §5.3 config sketch is likely not verbatim-usable: cross-field
      regex backreferences (\1, \1/\2) should be dependency-cruiser $1/$2
      group substitution, and the npm whitelist matcher (pathNot "^(zod)$")
      matches resolved node_modules paths, not bare module names. Wrong
      regexes yield silently permissive guards — mitigated by the mandatory
      per-rule red-proof in executor.
  - id: risk-002
    severity: low
    summary: >-
      RESOLVED by dec-002 (spec): core-no-io-libs covers all Node builtins
      (bare and node:-prefixed) in addition to npm deps; the rule-2 red proof
      uses node:fs, which simultaneously verifies builtin coverage (AC-06).
  - id: risk-003
    severity: low
    summary: >-
      Whitelist positive proof not runnable: zod is not installed, so "zod is
      allowed in core" cannot be runtime-verified in this story. AC-10 requires
      documentation only; the first real zod import in core (E1+) verifies it.
  - id: risk-004
    severity: low
    summary: >-
      Red-proof attribution: biome or tsc could fail before depcruise sees a
      temporary violation. Spec expected-behavior requires crafting violations
      that pass biome+tsc, or capturing the depcruise step alone to show the
      rule name plus the full-chain non-zero exit.
