decisions:
  - id: dec-001
    checkpoint_id: ckp-001
    free_text: auto mode, kickoff-defined scope
    rationale: >-
      The kickoff message explicitly defines how to run the story, its scope
      (including the two pre-taken decisions: final check chain per setup
      §5.1, and the 5 rules per setup §5.3), and the closing requirements;
