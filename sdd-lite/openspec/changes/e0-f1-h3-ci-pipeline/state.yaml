decisions:
  - id: dec-001
    checkpoint_id: ckp-001
    free_text: auto mode, kickoff-defined scope, stacked-branch workflow
    rationale: >-
      The kickoff message explicitly defines how to run the story, the
      stacked-branch mechanics (base H2 branch, not main), and the closing
      requirements; the session is autonomous. Stage approvals for
      code-touching work are satisfied by this explicit pre-approval; any
      deviation from the pinned scope still stops (protocol B/C).
    recorded_at: "2026-08-01T18:40:00Z"
  - id: dec-002
    checkpoint_id: ckp-002
    free_text: >-
      Zero-test strategy: `vitest run --passWithNoTests` in the npm test
      script; no vitest config file committed in this story.
    rationale: >-
      A-level (claude). Contract holds: npm test exits 0 today with zero
      test files and turns non-zero the moment a real failing test
      exists (the flag only tolerates absence of tests, never failures).
      Leaves E0.F2.x a clean slate — no throwaway config to replace and
      no biome allowlist churn. Explicit hand-off duty recorded: E0.F2.x
      must remove the flag when the real projects config lands, so an
      empty test glob can never pass silently afterwards.
    recorded_at: "2026-08-01T19:10:00Z"
  - id: dec-003
    checkpoint_id: ckp-002
    free_text: >-
      tsup config lives in `tsup.config.ts` at repo root (not a
      package.json field), added to biome files.includes.
    rationale: >-
      A-level (claude). Typed and discoverable; matches the repo
      convention of explicit root config files (biome.json,
      tsconfig.json, .dependency-cruiser.cjs — which needed the same
      allowlist treatment in H2). Exact file contents are design-owned;
      design must also verify tsc --noEmit treatment of the file so
      npm run check stays green.
    recorded_at: "2026-08-01T19:10:00Z"
  - id: dec-004
    checkpoint_id: ckp-002
    free_text: >-
      --version behavior: built bin prints the package.json version and
      exits 0; smoke command pinned as `node dist/cli.js --version`;
      every other invocation stays a no-op exiting 0.
    rationale: >-
      A-level (claude). The printed version must come from a single
      source of truth (package.json version field — no duplicated
      hardcoded literal), preventing drift without absorbing E6.F1.x
      composition-root scope; mechanism (JSON import, createRequire, or
      build-time define) is design-owned. `node dist/cli.js` avoids
      npm-link/npm-exec indirection and is deterministic in CI. cli.ts
      stays dependency-free (no core imports), passing all guards.
    recorded_at: "2026-08-01T19:10:00Z"
  - id: dec-005
    checkpoint_id: ckp-002
    free_text: >-
      Matrix breadth: test job matrixes Node [22, 24]; check and build
      jobs run on Node 22 only.
    rationale: >-
      A-level (claude). Matches setup §6 verbatim (matrix only on test).
      Node 22 is the engines floor (>=22): lint/typecheck/guard results
      are Node-version-independent tooling, and building + smoking on
      the floor proves the bin works on the minimum supported runtime;
      also saves CI minutes.
    recorded_at: "2026-08-01T19:10:00Z"
  - id: dec-006
    checkpoint_id: ckp-002
    free_text: >-
      vitest and tsup installed as exact devDep pins (npm i -D -E);
      concrete versions chosen in design.
    rationale: >-
      A-level (claude). Consistent with the existing exact-pin policy
      (biome 2.5.6, dependency-cruiser 18.1.0, typescript 5.9.3).
      Design must verify compatibility: a vitest version supporting
      Node 22/24 and TS 5.9.3, and a tsup version compatible with
      typescript 5.9.3 (tsup bundles via esbuild so the TS version is
      mostly irrelevant — recorded for the audit).
    recorded_at: "2026-08-01T19:10:00Z"
  - id: dec-007
    checkpoint_id: ckp-003
    free_text: >-
      Exact pins: vitest 4.1.10 and tsup 8.5.1 (npm i -D -E).
    rationale: >-
      A-level (claude). Registry-verified 2026-08-01: vitest 4.1.10 is
      latest (published 2026-07-06), engines ^20||^22||>=24 covers the
      22/24 matrix, peer @types/node ^22 satisfied by 22.20.1, vite is a
      direct dependency (resolves to 8.2.0, engines ^20.19||>=22.12 — ok
      on CI's latest 22.x/24.x), --passWithNoTests exists in v4. tsup
      8.5.1 is latest (published 2025-11-12), engines node >=18, peer
      typescript >=4.5.0 optional — 5.9.3 satisfies; bundles via esbuild
      ^0.27 (import attributes + hashbang preservation supported).
    recorded_at: "2026-08-01T19:45:00Z"
  - id: dec-008
    checkpoint_id: ckp-003
    free_text: >-
      ci.yml mechanics: actions/checkout@v7 + actions/setup-node@v7
      (major tags; latest v7.0.1 / v7.0.0 verified), npm ci per job with
      setup-node npm cache, permissions contents:read, timeout-minutes
      10 per job, concurrency group ${{ github.workflow }}-${{
      github.ref }} with cancel-in-progress only for pull_request
      events.
    rationale: >-
      A-level (claude). Major tags over SHA pins: first-party actions,
      moving major receives security patches, SHA pins go stale with
      Dependabot out of scope this story. npm ci per job: isolated
      runners, lock-keyed cache makes it cheap; jobs run npm scripts
      verbatim (AC-06 command-level equivalence). AMENDMENT: the
      concurrency block amends the spec non-goal "no concurrency
      groups", pinned per explicit orchestrator handoff instruction
      (decide and justify); PR-only cancellation keeps a full audit run
      for every main commit. Flagged for QA and the PR description.
    recorded_at: "2026-08-01T19:45:00Z"
  - id: dec-009
    checkpoint_id: ckp-003
    free_text: >-
      --version mechanism: static `import pkg from "../../package.json"
      with { type: "json" }` in src/main/cli.ts; requires adding
      "resolveJsonModule": true to tsconfig.json — recorded amendment
      extending the AC-09 diff bound by tsconfig.json.
    rationale: >-
      A-level (claude). Only mechanism immune to the dev-vs-bundle path
      depth trap: esbuild inlines the JSON at build time (dist/cli.js
      has no runtime path dependence) while node strip-types resolves
      ../../package.json correctly from src/main. createRequire was
      rejected (esbuild leaves require paths untouched — broken from
      dist/); fs walk-up and build-time define are uglier dual-path
      hacks. Node 22.12+ has stable JSON modules (local v22.22.2, CI
      uses latest 22.x/24.x); default import only (Node JSON modules
      expose no named exports); guard-clean (no depcruise rule matches
      src/main -> package.json). The tsconfig flag is additive and
      changes nothing existing. Flagged for QA.
    recorded_at: "2026-08-01T19:45:00Z"
  - id: dec-010
    checkpoint_id: ckp-003
    free_text: >-
      tsup.config.ts: entry {cli: src/main/cli.ts}, format esm, platform
      node, target node22, outDir dist, clean, dts:false; shebang lives
      natively in src/main/cli.ts (no banner). tsconfig include stays
      ["src"] so tsup.config.ts is outside tsc scope; biome lints it via
      the dec-003 allowlist entry; no biome entry for .github (biome
      2.5.6 has no YAML support and includes is an allowlist).
    rationale: >-
      A-level (claude). dts:false — a bin is executed, never imported.
      Native shebang: one source of truth, direct-execution friendly;
      esbuild preserves the entry hashbang and tsup chmods the output;
      executor validates head -1 dist/cli.js with the tsup banner option
      as bounded fallback (risk-006). Keeping tsconfig include at
      ["src"] avoids a second tsconfig change; npm run build itself
      exercises the config via bundle-require.
    recorded_at: "2026-08-01T19:45:00Z"
  - id: dec-011
    checkpoint_id: ckp-004
    free_text: >-
      Plan decomposition: two sequential executor stages (S1 local tool
      enablement, S2 ci.yml + red-proof + diff bound), commit/PR/AC-07
      watch/history as orchestrator post-plan mechanics; ci.yml local
      evidence policy = byte-exact copy from design §1 + structural
      checklist (jobs/triggers/node versions/verbatim npm scripts),
      with the post-push real run as the authoritative proof.
    rationale: >-
      A-level (claude). The suggested decomposition from the handoff
      maps cleanly onto the design's Validation Matrix with disjoint
      write scopes and independently green endpoints; a finer split
      would create filler stages. No local YAML linter exists in the
      environment (actionlint not installed, no js-yaml), so pinning
      the acceptable evidence prevents the executor from improvising
      weaker or heavier checks; AC-07 remains the ultimate criterion
      and is watched by the orchestrator after the PR opens.
    recorded_at: "2026-08-01T20:05:00Z"
