      recommendation) and let the user decide. Applies through the design gate.
    recorded_at: "2026-08-01T22:12:00Z"
  - id: dec-003
    checkpoint_id: ckp-001
    free_text: >-
      Switch to auto mode after proposal; stop only on discrepancy or required
      interaction; add per-stage parallel drift validation
    author: user
    rationale: >-
      User directive after the proposal stage: "si continua, y cambia a modo
      automatico sdd; solo frena y consulta si hay alguna discrepancia o algo
      que tenga que interactuar; por cada stage realizar validaciones
      paralelas para asegurarnos que no nos estamos desviando del plan."
      Operationalized: execution_mode=auto (no routine confirmation pauses);
      hard stops preserved for drift, contradictions, and B-level decisions
      (notably public-API shape of the ReviewEngine contract) per protocol
      B/C; dec-002 design gate still honored. Each stage gets two blind
      parallel read-only validators (see validation_protocol) before routing.
    recorded_at: "2026-08-01T22:18:00Z"
  - id: dec-004
    checkpoint_id: ckp-002
    free_text: >-
      Q2 resolved — ReviewEngine port output = raw output + optional usage
      ONLY; terminal state is a separate run-domain type populated downstream
    author: claude->user
    rationale: >-
      Recommendation by claude (thin invocation contract, endorsed by both
      spec validators as PRD-faithful and no scope creep) adopted under the
      user's "continue" directive after Q2 was surfaced twice with alternatives
      + recommendation (dec-002 honored). The terminal-state union
      ok|ambiguous|engine-error|timeout|validation-failed stays a distinct run
      type, assigned by the verdict parser (E4.F1.H2) / run flow (E4.F1.H1) —
      never returned by the engine. Reversible: flagged for user veto before
      sddl-design locks the API. Resolves risk-002.
    recorded_at: "2026-08-01T23:35:00Z"
  - id: dec-005
    checkpoint_id: ckp-002
    free_text: >-
      Q3 resolved — worktree represented at the port boundary as a run-local
      plain type WorktreeRef { path: string }
    author: claude->user
    rationale: >-
      Recommendation by claude adopted under the user's "continue" directive
      (dec-002 honored). A named, extensible run-owned value object with zero
      I/O — chosen over a bare string (stringly-typed, not extensible) and over
      a workspace-owned type (would create a core-to-core coupling, PRD §4.5
      guard 3). Reversible before sddl-design locks the API. Resolves risk-003.
    recorded_at: "2026-08-01T23:35:00Z"
  - id: dec-006
    checkpoint_id: ckp-002
    free_text: >-
      Design file layout — three concern-separated files under src/core/run/
      plus a types-only index rewrite
    author: claude
    rationale: >-
      A-level (reversible, PRD-aligned). run/ is the first core module to
      materialize a ports/ folder: ports/review-engine.ts (port +
      ReviewRequest/ReviewResult/ReviewUsage), terminal-state.ts (run-domain
      union, not under ports/), worktree-ref.ts (boundary value), and index.ts
      rewritten from `export {}` to a types-only public re-export. Rejected a
      single combined types.ts (three unrelated concerns). Establishes the
      port-per-file convention siblings will follow.
    recorded_at: "2026-08-01T23:52:00Z"
  - id: dec-007
    checkpoint_id: ckp-002
    free_text: >-
      Port method review(request): Promise<ReviewResult> — async by nature
    author: claude
    rationale: >-
      A-level. Method named `review` (verb matching the domain role, avoids
      colliding with the `run` module name). Async return is forced, not a
      trade-off: an implementing adapter spawns an external CLI, so there is no
      viable sync signature. Not a [B] item — it does not change the acceptance
      contract's input/output shape (still worktree+prompt+timeout → raw +
      optional usage).
    recorded_at: "2026-08-01T23:52:00Z"
  - id: dec-008
    checkpoint_id: ckp-002
    free_text: >-
      Type identifiers ReviewRequest/ReviewResult/ReviewUsage; timeoutMs
      unit-in-name; all boundary members readonly
    author: claude
    rationale: >-
      A-level (reversible identifiers; the shapes themselves are locked by
      Q2/Q3/Q4). Immutable DTOs at the boundary; timeout carries its unit in
      the name (timeoutMs).
    recorded_at: "2026-08-01T23:52:00Z"
  - id: dec-009
    checkpoint_id: ckp-002
    free_text: >-
      import type / export type throughout — mandatory under
      verbatimModuleSyntax
    author: claude
    rationale: >-
      A-level but load-bearing: under tsconfig verbatimModuleSyntax:true a
      plain `export { ReviewEngine }` of a type is a tsc error, so the index
      re-export and the intra-module WorktreeRef import must be type-only for a
      green `tsc --noEmit`. Verified by the executor stage.
    recorded_at: "2026-08-01T23:52:00Z"
open_risks:
  - id: risk-001
    severity: medium
    summary: >-
      Primary open question for spec: does H1 land any test now, or is the
      ReviewEngine.contract suite + FakeEngine strictly deferred to E0.F2.H2
      (#6)? Proposal recommendation (not decided): types-only in H1, defer
      suite to H2. Consequence to pin in spec: if H1 ships no test file, the
      --passWithNoTests removal duty (e0-f1-h3 risk-004 / dec-002) also stays
      deferred to H2. Spec must decide and record.
  - id: risk-002
    severity: low
    summary: >-
      Port-shape question: does the ReviewEngine return type carry a terminal
      state, or only raw output + optional usage (terminal states assigned
      later by parse/flow, E4.F1.H2)? Story lists them as two separate
      deliverables; mis-coupling would leak E4 scope into H1. Spec/design to
      pin the thin-invocation contract.
  - id: risk-003
    severity: low
    summary: >-
      Cross-module representation of "worktree" at the port boundary (path
      string vs run-local WorktreeRef vs a workspace-owned type). Must stay a
      plain reference with zero I/O to keep core-no-io-libs and no-adapters
      guards green and avoid an unwanted core-to-core coupling. Spec/design
      to pin; usage shape and zod-vs-plain-types are lower-texture design
      calls surfaced alongside.
