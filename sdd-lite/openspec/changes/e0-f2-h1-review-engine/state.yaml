    validation-failed`, exported via run's public `index`. Zero I/O imports
    (depcruise core-no-io-libs / no-adapters guards stay green; core whitelist
    is `zod` only). Types-only, greenfield core module, no runtime behavior —
    guards satisfied by construction. Boundary pinned to proposal/spec: the
    `ReviewEngine.contract` shared suite + `FakeEngine` belong to the NEXT
    story E0.F2.H2 (issue #6), so H1 is very likely types-only. Linked
    deferred duty: removing `--passWithNoTests` (e0-f1-h3 risk-004 / dec-002)
    fires when the first real test file lands — stays with H2 if H1 ships no
    test. Bounded blast radius: one core module's types + one index re-export.
    Normal lite flow.
  confidence: high
  recorded_at: "2026-08-01T22:10:00Z"
