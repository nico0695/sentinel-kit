version: "0.1"
change_name: e0-f2-h1-review-engine
objective: new-feature
mode: lite
execution_mode: auto
validation_protocol:
  per_stage_parallel_validation: true
  description: >-
    User directive (dec-003): after each stage produces its artifact, run two
    blind read-only validators in parallel to detect drift from the plan
    before routing on. Validator A checks acceptance criteria (issue #5) + the
    backlog H1/H2 boundary (no scope creep into H2/E4). Validator B checks PRD
    §4 hexagonal rules + architecture guards (zero I/O, core whitelist zod,
    port named by role, index re-export) + coherence with upstream artifacts.
    Converge "no drift" -> auto-continue; any drift or divergence -> STOP and
    consult (protocol B/C). For the executor (code) stage this role is filled
    by the sddl-code-review 4R parallel-lens protocol.
complexity_assessment:
  route: continue-lite
  summary: >-
    Backlog story [E0.F2.H1] (issue #5): define THE central border contract —
    the `ReviewEngine` driven port (input worktree + prompt + timeout; output
    raw output + optional usage) in `src/core/run/ports`, plus the run-domain
    terminal-state model `ok | ambiguous | engine-error | timeout |
    validation-failed`, exported via run's public `index`. Zero I/O imports
    (depcruise core-no-io-libs / no-adapters guards stay green; core whitelist
    is `zod` only). Types-only, greenfield core module, no runtime behavior —
    guards satisfied by construction. Boundary pinned to proposal/spec: the
    `ReviewEngine.contract` shared suite + `FakeEngine` belong to the NEXT
    story E0.F2.H2 (issue #6), so H1 is very likely types-only. Linked
    deferred duty: removing `--passWithNoTests` (e0-f1-h3 risk-004 / dec-002)
    fires when the first real test file lands — stays with H2 if H1 ships no
    test. Bounded blast radius: one core module's types + one index re-export.
    Normal lite flow.
  confidence: high
  recorded_at: "2026-08-01T22:10:00Z"
lifecycle_status: planning
current_stage: sddl-design
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No material unknown blocking routing — the story is fully pinned by
      issue #5, PRD §4.3 (ReviewEngine declared by run), the backlog H1/H2
      boundary, and the audited repo state (run/index.ts placeholder, sibling
      port-comment convention). Open questions are type-shape decisions for
      spec/design, not evidence gaps.
  sddl-proposal:
    status: completed
    started_at: "2026-08-01T22:06:00Z"
    completed_at: "2026-08-01T22:12:00Z"
    notes: >-
      proposal.md written. Problem framed: ReviewEngine is the border contract
      the whole product converges on (PRD §4.3), today only a placeholder
      export {}; E0.F2.H2, E1 spikes, E4.F1.H1/H2, E4.F2.x all block on it.
      Desired outcome: ReviewEngine port under core/run/ports (input
      worktree+prompt+timeout, output raw output + optional usage) + terminal
      states ok|ambiguous|engine-error|timeout|validation-failed, exported via
      run/index, guard-green. Scope sketch pins the H1/H2 boundary: FakeEngine
      + contract suite + --passWithNoTests removal are OUT (H2 #6); runReview
      (E4.F1.H1), verdict parser (E4.F1.H2), ProcessRunner (E5.F1.x), real
      adapters (E4.F2.x) OUT. Feasibility very high (types-only). Five open
      questions routed to spec — primary: test-in-H1-or-defer (recommend
      types-only, defer suite to H2); plus port-return-carries-state?, worktree
      boundary representation, usage shape, zod-vs-plain-types. NOTE: the
      proposal worker was not told the execution mode and wrongly recorded an
      auto-mode implicit approval; corrected by the orchestrator — session is
      interactive, each stage routing pauses for explicit user confirmation.
  sddl-spec:
    status: completed
    started_at: "2026-08-01T22:20:00Z"
    completed_at: "2026-08-01T23:30:00Z"
    notes: >-
      spec.md written: firm scope + AC1..AC4 mapped 1:1 to issue #5's three
      boxes (AC1 port typed in core/run/ports; AC2 five terminal states as a
      run-domain type NOT carried on the engine return; AC3 zero I/O
      guard-green) plus AC4 (types-only, no test file, --passWithNoTests
      removal deferred to H2). Q1/Q4/Q5 decided [A]; Q2/Q3 raised [B] for the
      design gate. Per-stage parallel validation (dec-003): validator A
      (acceptance/scope) and validator B (PRD/architecture) both returned
      no-drift, blind and independent — convergence authorizes auto-continue.
      Validator A: AC1-AC3 map 1:1, no scope creep either direction, [A]/[B]
      calls defensible (0 blocking, 0 should-fix, 2 info). Validator B: the
      PRD-vs-backlog "verdict" reconciliation judged sound, guards hold (2
      info). Committer identity was corrected (reset-author to
      Claude <noreply@anthropic.com>) and force-pushed; commits remain
      unsigned (no signing key in this environment).
  sddl-design:
    status: in_progress
    notes: >-
      Entered under dec-003 auto-continue (spec validators converged no-drift)
      with dec-002 honored: Q2/Q3 were surfaced to the user with alternatives +
      recommendation; the user directed "continue", adopting the recommended
      options (dec-004, dec-005) with an explicit veto window before design
      locks the API.
  sddl-plan:
    status: pending
  sddl-executor:
    status: pending
  sddl-qa-review:
    status: pending
