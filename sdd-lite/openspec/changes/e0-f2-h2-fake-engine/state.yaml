    severity: medium
    status: resolved
    summary: >-
      RESOLVED by dec-004. Thin-port vs. backlog phrasing tension settled:
      success = configurable raw OUTPUT strings; failure (error/timeout) =
      rejected Promise with a plain Error; the fake does NOT enforce timeoutMs;
      the H1 core port is UNCHANGED. No typed port error added in H2; no E4 run
      flow / verdict-parser scope leaked.
  - id: risk-002
    severity: low
    status: resolved
    summary: >-
      RESOLVED by dec-005. Tests co-located INSIDE src in per-module `__test__/`
      folders; a scoping exclusion for `(^|/)__test__/` is added to
      .dependency-cruiser.cjs so depcruise never cruises test code (vitest
      imports) — production guards + extraction guarantee stay intact. NEW
      residual: the exclusion must be precise (only `__test__/`); verified at
      design + proven guard-green at the executor gate.
  - id: risk-003
    severity: low
    status: open
    summary: >-
      First real test fires the `--passWithNoTests` removal (e0-f1-h3
      risk-004 / dec-002). Must land in THIS change and the acceptance gate must
      prove `npm test` (now `vitest run`) is green WITH real tests, not vacuous.
      Related residual (dec-007): with the flag removed, `vitest run` must stay
      green while the core/e2e projects match zero files — proven at the gate.
