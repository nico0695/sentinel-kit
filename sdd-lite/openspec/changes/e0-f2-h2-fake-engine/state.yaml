    backlog phrasing "configurable responses: valid verdict, ambiguous,
    timeout, error" -> the fake produces raw OUTPUT strings for the success
    scenarios and surfaces failure via the async contract (rejection); how
    exactly the port surfaces error/timeout is a [B] item for the design gate.
