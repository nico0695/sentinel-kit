version: "0.1"
change_name: e0-f2-h2-fake-engine
objective: new-feature
mode: lite
execution_mode: auto
validation_protocol:
  per_stage_parallel_validation: true
  activate_after: sddl-proposal
  description: >-
    User directive at kickoff (dec-002): start in interactive; once the change
    starts well (after the proposal), switch to auto with two blind read-only
    validators in parallel per stage. Validator A checks acceptance criteria
    (issue #6) + the backlog H2 boundary (no scope creep into E1 real engines /
    E4 run flow / E4.F1.H2 verdict parser). Validator B checks PRD §4 hexagonal
    rules + the five architecture guards (adapters-isolated, wiring-only-in-main,
    core-no-adapters, core-no-io-libs, core-modules-via-index) + coherence with
    the H1 ReviewEngine contract (thin port: raw output + optional usage;
    TerminalState separate; WorktreeRef { path }). Converge "no drift" ->
    auto-continue; any drift/divergence -> STOP and consult (protocol B/C).
    For the executor (code) stage this role is filled by the sddl-code-review
    4R parallel-lens protocol. STANDING GATE (dec-002): validate any deviation
    or suggestion with alternatives + a recommendation BEFORE the design is
    formalized. The executor (code) stage ALWAYS requires explicit user OK,
    even under auto mode.
complexity_assessment:
  route: continue-lite
  summary: >-
    Backlog story [E0.F2.H2] (issue #6): implement (a) FakeEngine as a driven
    adapter under src/adapters/driven/engines/, and (b) the shared
    ReviewEngine.contract suite (reusable fixtures) that every ReviewEngine
    implementation must pass, plus error-scenario coverage. This is the FIRST
    real test landing in the repo, so it also (c) establishes the vitest
    projects config (core / adapters / e2e per docs/setup-tecnico §5.4) and
    (d) FIRES the deferred duty: remove `--passWithNoTests` from package.json
    (e0-f1-h3 risk-004 / dec-002) now that a real test exists. FakeEngine is an
    adapter, so per guard wiring-only-in-main any production instantiation lives
    only in src/main; the contract suite instantiates it in tests. The H1 port
    is THIN (dec-004: review() -> Promise<ReviewResult{output, usage?}>, no
    verdict / no TerminalState), which creates a design tension with the
    backlog phrasing "configurable responses: valid verdict, ambiguous,
    timeout, error" -> the fake produces raw OUTPUT strings for the success
    scenarios and surfaces failure via the async contract (rejection); how
    exactly the port surfaces error/timeout is a [B] item for the design gate.
    Bounded blast radius: one new adapter folder + test infrastructure +
    vitest config + a one-token package.json edit. No change to the core port
    types. Normal lite flow.
  confidence: high
  recorded_at: "2026-08-02T02:10:00Z"
lifecycle_status: planning
current_stage: sddl-design
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No material unknown blocks routing. The story is pinned by issue #6, the
      backlog E0.F2.H2 entry, docs/setup-tecnico §5.4 (which names
      ReviewEngine.contract.ts and the three vitest projects), the frozen H1
      port contract (src/core/run), and the audited repo state (engines
      placeholder `export {}`, fixtures/ dir present, no vitest config yet).
      Open items are design decisions (error model, test-tree location), not
      evidence gaps.
  sddl-proposal:
    status: completed
    completed_at: "2026-08-02T02:20:00Z"
    notes: >-
      proposal.md written. Problem framed (FakeEngine + shared reusable
      ReviewEngine.contract suite + error coverage + first vitest config +
      --passWithNoTests removal). exploration_performed: true (5 high-signal
      reads: frozen H1 port trio, engines index, package.json, backlog E0.F2.H2,
      setup §5.4). Five B-level open questions surfaced with recommendations and
      routed to spec/design (failure model = success-as-output / failure-as-
      rejection with plain Error, fake does not enforce timeoutMs; tests OUTSIDE
      src; three vitest projects with only adapters populated; no src/main wiring
      yet; factory-with-scripted-behavior config sketch).
  sddl-spec:
    status: completed
    completed_at: "2026-08-02T02:50:00Z"
    notes: >-
      spec.md written. Firm scope boundary (in/out/non-goals) + 9 acceptance
      criteria mapping 1:1 to issue #6's three boxes (AC-1 FakeEngine passes
      contract suite, AC-2 suite reusable verbatim, AC-3 error scenarios reject)
      plus the two carried duties (AC-5 --passWithNoTests removal proven
      non-vacuous, AC-6 three vitest projects with only adapters populated) and
      AC-7 precise __test__/ depcruise exclusion / guards green, AC-8 no scope
      leak, AC-9 check+test green. dec-004..dec-007 baked as fixed constraints.
      No new B item; Q5 (fake config API shape) left as an A-level design detail.
      Per-stage dual validation (dec-003) CONVERGED no-drift: validator A
      (acceptance/scope) 0 blocking / 0 should-fix — 3 boxes + 2 carried duties
      map cleanly, no creep either direction, dec-004..dec-007 faithful (1 info:
      dec-005 co-located reverses the proposal's original outside-src preference,
      but is the user-resolved decision, not drift). Validator B
      (PRD/architecture) 0 blocking / 0 should-fix — frozen H1 port verbatim,
      all five guards respected, VERIFIED .dependency-cruiser.cjs has NO exclude
      key today (adding options.exclude is additive) and `(^|/)__test__/` is a
      precise regex exempting no production path; 4 info (notably: PRD §4.3 table
      still says "output + verdict" but the frozen port is thin per dec-004 — an
      inherited, already-documented H1 divergence, not new drift). Both blind and
      independent -> auto-continue to sddl-design.
  sddl-design:
    status: completed
    completed_at: "2026-08-02T03:30:00Z"
    notes: >-
      design.md written. Settled all A-level details within dec-004..dec-007:
      (Q5) FakeEngine config API = `createFakeEngine(script)` factory where
      script is a discriminated `FakeReviewOutcome` ({ok:true;result} |
      {ok:false;error:Error}) or a readonly array consumed in order (exhaustion
      rejects; noUncheckedIndexedAccess-safe); async review() returns result or
      throws the plain Error (dec-004, no timeoutMs, no verdict/TerminalState).
      (Q2) Shared `ReviewEngine.contract.ts` (named per setup §5.4) =
      `reviewEngineContract(harness, label?)`, fake-agnostic, imports only
      vitest + core TYPES; harness = { resolving(output, usage?), rejecting() }
      scenario factories; rejection asserted as `instanceof Error` so E4 typed
      EngineError still passes (AC-2/AC-3 reuse). File layout: fake/fake-engine.ts
      + __test__/ReviewEngine.contract.ts + __test__/fake-engine.test.ts; fake
      exported via engines/index.ts (dec-006 reachability). depcruise:
      `options.exclude: { path: "(^|/)__test__/" }` (object form, matches only a
      __test__/ segment, no production path). vitest.config.ts: three projects
      (core/adapters/e2e, node env, non-overlapping globs), only adapters
      populated; empty core/e2e rely on vitest-4 aggregate passWithNoTests
      semantics (proven at executor gate, risk-003). biome: add vitest.config.ts
      to files.includes. package.json test -> `vitest run`. Verified relative
      depth `../../../../core/run/index.js` from both fake/ and __test__/. No new
      B item. ONE low-risk A-level assumption flagged (e2e include -> `e2e/` root
      dir, zero files, vetoable) per dec-002 standing gate — non-blocking.
  sddl-plan:
    status: pending
  sddl-executor:
    status: pending
  sddl-qa-review:
    status: pending
checkpoints:
  - id: ckp-001
    type: stage_approval
    stage: orchestrator
    summary: >-
      Change kickoff for [E0.F2.H2] (issue #6): the user explicitly started the
      story and selected the mode. Scope = issue #6: FakeEngine driven adapter +
      shared ReviewEngine.contract suite (reusable) + error scenarios, plus the
      first vitest config and the deferred `--passWithNoTests` removal. Run the
      canonical lite flow (proposal -> spec -> design -> plan -> executor -> 4R
      -> final QA). Closing requirements: npm run check + npm test green, PR
      "[E0.F2.H2] ... Closes #6" (never merge, never push main, max 5 open PRs),
      history entry committed before closing.
    question: >-
      Start e0-f2-h2-fake-engine (continue-lite) with issue #6 scope, in
      interactive mode, switching to auto after the proposal with per-stage
      dual validation?
    free_input_allowed: true
    response:
      free_text: >-
        Approved to START in interactive mode (explicit start instruction +
        mode selection in the kickoff message). NOT a blanket pre-approval of
        later stages. Standing constraints: (dec-002) validate any deviation /
        suggestion with alternatives + a recommendation BEFORE formalizing
        design; (dec-003) switch to auto after the proposal with two blind
        parallel validators per stage, stopping only on discrepancy or a
        B-level decision; the executor (code) gate ALWAYS needs explicit OK.
      responded_at: "2026-08-02T02:10:00Z"
    created_at: "2026-08-02T02:10:00Z"
    resolved_at: "2026-08-02T02:10:00Z"
  - id: ckp-002
    type: stage_approval
    stage: sddl-proposal
    summary: >-
      Proposal complete; interactive phase-validation pause. The five B-level
      open questions the proposal surfaced were presented to the user with
      alternatives + a recommendation each (dec-002 standing gate honored before
      any formalization).
    question: >-
      Resolve the four material [B] questions (failure model, test location,
      src/main wiring, vitest projects) before spec formalizes scope?
    free_input_allowed: true
    response:
      free_text: >-
        User decided via AskUserQuestion: (1) failure = plain-Error rejection,
        fake does not enforce timeoutMs, port unchanged [dec-004]; (2) tests
        co-located INSIDE src in per-module `__test__/` folders, excluded from
        depcruise — an OVERRIDE of claude's outside-src recommendation [dec-005];
        (3) defer src/main wiring [dec-006]; (4) define three vitest projects,
        populate only adapters [dec-007]. Q5 (fake config API shape) stays an
        A-level design detail. Authorizes flipping to auto (dec-003) and
        delegating spec with these decisions baked in.
      responded_at: "2026-08-02T02:35:00Z"
    created_at: "2026-08-02T02:30:00Z"
    resolved_at: "2026-08-02T02:35:00Z"
decisions:
  - id: dec-001
    checkpoint_id: ckp-001
    free_text: >-
      interactive -> auto (after proposal) / continue-lite; kickoff scope =
      issue #6 (FakeEngine + shared contract suite + error scenarios + first
      vitest config + --passWithNoTests removal)
    author: user
    rationale: >-
      User started the change and picked the mode in the kickoff message. Story
      bounded and specified by issue #6 + backlog E0.F2.H2 + setup-tecnico §5.4
      + the frozen H1 port. Each later stage still requires its gate; code stage
      needs explicit approval.
    recorded_at: "2026-08-02T02:10:00Z"
  - id: dec-002
    checkpoint_id: ckp-001
    free_text: >-
      Standing constraint — validate any deviation / suggestion with
      alternatives + a recommendation BEFORE formalizing design
    author: user
    rationale: >-
      Explicit kickoff instruction ("validá cualquier desvío ANTES de
      formalizar el design"). Operationalized as a hard protocol-B gate through
      the design stage.
    recorded_at: "2026-08-02T02:10:00Z"
  - id: dec-003
    checkpoint_id: ckp-001
    free_text: >-
      Switch to auto after the proposal; stop only on discrepancy or B
      decision; two blind parallel validators per stage; executor code gate
      always explicit
    author: user
    rationale: >-
      Explicit kickoff instruction. Operationalized in validation_protocol:
      execution_mode flips to auto after sddl-proposal; per-stage dual blind
      validators converge no-drift -> continue; hard stops for drift /
      contradictions / B decisions; the code-touching executor stage always
      requires explicit user OK even under auto.
    recorded_at: "2026-08-02T02:10:00Z"
  - id: dec-004
    checkpoint_id: ckp-002
    free_text: >-
      Q1 (failure model) resolved — the thin ReviewEngine port surfaces failure
      by REJECTING the returned promise with a plain Error; the fake does NOT
      enforce timeoutMs; the H1 core port stays UNCHANGED
    author: claude->user
    rationale: >-
      Claude recommended, user chose (AskUserQuestion, option "Rechazo con Error
      plano"). Success scenarios ("valid verdict", "ambiguous") are configurable
      raw OUTPUT strings on ReviewResult.output; failure scenarios ("error",
      "timeout") are modeled as a rejected Promise with a standard Error. The
      fake does NOT own wall-clock enforcement of timeoutMs — real timeout
      enforcement is the run flow's job (E4.F1.H1); the fake only models the
      failed invocation. No typed port error is added to core/run in H2, keeping
      the frozen H1 contract intact; a typed EngineError may arrive later (E4)
      without breaking this contract. The contract suite asserts `rejects` for
      the failure scenarios. Resolves risk-001.
    recorded_at: "2026-08-02T02:35:00Z"
  - id: dec-005
    checkpoint_id: ckp-002
    free_text: >-
      Q2 (test location) resolved — tests co-located INSIDE src in per-module
      `__test__/` folders, excluded from dependency-cruiser via a scoping edit
      to .dependency-cruiser.cjs
    author: user
    rationale: >-
      User OVERRODE claude's recommendation (claude recommended a test tree
      OUTSIDE src; user chose "co-ubicar en src + excluir" and specified the
      grouping: per-module `__test__/` folders). Operationalized: the shared
      `ReviewEngine.contract` suite + the FakeEngine test live under
      src/adapters/driven/engines/__test__/ (co-located with the adapter they
      exercise); a scoping exclusion for `(^|/)__test__/` paths is added to
      .dependency-cruiser.cjs `options.exclude` so depcruise never cruises test
      code (which imports vitest, an npm/I-O lib) — this exempts test infra from
      the production guards WITHOUT relaxing any forbidden rule, so the five
      guards and the core/ extraction guarantee remain intact for production
      code. This is a sensitive edit to the guard config; it is explicitly
      user-approved. Design must confirm the exclusion is precise (matches
      only `__test__/`, no production path). Resolves risk-002.
  - id: dec-006
    checkpoint_id: ckp-002
    free_text: >-
      Q3 (src/main wiring) resolved — DEFER FakeEngine composition; H2 wires
      nothing into src/main
    author: claude->user
    rationale: >-
      Claude recommended, user chose "Diferir". There is no consumer yet
      (runReview lands in E4.F1.H1), so wiring FakeEngine into src/main now would
      be dead code a later story rewrites (YAGNI). H2 only proves the
      guard-compliant PLACEMENT of the adapter under
      src/adapters/driven/engines/; guard-5 (wiring-only-in-main) stays satisfied
      vacuously (no instantiation in production code outside future src/main).
    recorded_at: "2026-08-02T02:35:00Z"
  - id: dec-007
    checkpoint_id: ckp-002
    free_text: >-
      Q4 (vitest projects) resolved — define all three projects
      (core/adapters/e2e) per setup §5.4, populate only `adapters` in H2
    author: claude->user
    rationale: >-
      Claude recommended, user chose "Definir los 3, poblar solo adapters". The
      vitest config declares the three projects from docs/setup-tecnico §5.4
      (core=unit/in-memory fakes, adapters=contract suite, e2e=smoke) so the
      scaffolding is ready for later stories; only the `adapters` project has
      test files now (the ReviewEngine.contract suite exercised by FakeEngine).
      Design must verify that with `--passWithNoTests` REMOVED, `vitest run`
      stays green when core/e2e match zero files (the overall run has tests via
      adapters) — the executor gate proves this.
    recorded_at: "2026-08-02T02:35:00Z"
