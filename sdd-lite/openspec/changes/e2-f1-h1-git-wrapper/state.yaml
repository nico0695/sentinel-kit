decisions:
  - id: dec-001
    stage: sddl-proposal
    kind: A
    author: claude
    summary: >-
      Own the port in `src/core/repos` (public-index re-export). PRD §4.3
      lists both `repos` and `workspace` as owners; `repos` is the domain
      that will consume it FIRST (E2.F2.H2 registerRepo), and `workspace`
      (E2.F3.H1) can consume the same public type through the repos index
      once needed — no need to duplicate the declaration.
    rationale: >-
      Keeps ownership single, matches "first consumer wins" for driven
      ports, avoids a cross-module public re-export from workspace which
      would create a phantom re-export before workspace has any use case.
  - id: dec-002
    stage: sddl-proposal
    kind: B
    author: claude→user
    question_id: Q1
    summary: >-
      `branches()` returns BOTH local and remote refs in a tagged shape
      `{ name, kind: 'local'|'remote', remote? }`, produced by a single
      `git for-each-ref --format=… refs/heads refs/remotes` call.
    rationale: >-
      One-call, one-shape; H2 (merge-base) needs local, H3 (listBranches)
      needs remote, both are served by the same method with no future
      contract change.
  - id: dec-003
    stage: sddl-proposal
    kind: B
    author: claude→user
    question_id: Q2
    summary: >-
      `defaultBranch(repoPath, remote?)` detects via
      `git symbolic-ref refs/remotes/<remote>/HEAD` on an already-cloned
      repo. HEAD unset -> `GitNoDefaultBranchError`. Pre-clone
      `ls-remote --symref` is deferred until a story needs it.
    rationale: >-
      Deterministic, no network, no credentials; H2 registerRepo always
      clones first, so post-clone detection covers every MVP consumer.
  - id: dec-004
    stage: sddl-proposal
    kind: B
    author: claude→user
    question_id: Q3
    summary: >-
      `clone(url, targetPath)` receives a caller-owned ABSOLUTE target
      path. Managed-clones layout is a `registerRepo` (H2) concern, not
      a git-wrapper concern. Adapter refuses relative paths as a
      validation-time typed port error.
    rationale: >-
      Keeps the port thin, pushes layout policy up to the domain use
      case where it belongs, avoids "the port owns filesystem layout"
      which would leak I/O reasoning into the port shape.
  - id: dec-005
    stage: sddl-proposal
    kind: B
    author: claude→user
    question_id: Q4
    summary: >-
      `fetch(repoPath, options?)` — options is an OPTIONAL object with
      `remote?: string` (default `origin`). Under
      exactOptionalPropertyTypes the field is built conditionally, never
      assigned `undefined`.
    rationale: >-
      One-line surface today; H3 (listBranches with prior fetch) gets a
      configurable remote without a follow-up contract change.
  - id: dec-006
    stage: sddl-proposal
    kind: B
    author: claude→user
    question_id: Q5
    summary: >-
      Error hierarchy: base `class GitError extends Error` + typed
      subclasses per failure family — `GitCloneError`, `GitFetchError`,
      `GitCommandError`, `GitNoDefaultBranchError`. All under
      `src/core/repos/ports/git-port-errors.ts`, re-exported by the
      module's public index.
    rationale: >-
      Coding-standards `*Error` suffix rule (`docs/coding-standards.md`),
      instanceof-based discrimination is exhaustive under strict TS,
      matches the ReviewEngine port style (typed narrow contract). The
      base class stays catchable as a single family when a consumer
      does not care which subtype fired.
  - id: dec-007
    stage: sddl-design
    kind: A
    author: claude
    summary: >-
      Design test fixture gains a SECOND bare repo (`upstream.git`)
      initialised with `-b trunk` (different default branch name than
      `main`). The working clone gets `upstream` added as a remote and
      fetched so `refs/remotes/upstream/HEAD` is populated locally.
      Contract suite gains the case
      `defaultBranch({ remote: 'upstream' }) === 'trunk'`.
    rationale: >-
      Fix for the drift Validator A raised on the initial design: spec
      AC-4 sentence 2 (`remote` parameter routes to the right ref and
      returns the short branch name) had no matching enumerated test.
      A second bare with a DIFFERENT default branch is required — a
      same-name default would let the assertion pass by coincidence
      (adapter could ignore `remote` and return `main` unconditionally).
      Also removed the cosmetic `void stdout;` line in `addCommitToBare`
      (cosmetic-only observation from Validator B — unused variable,
      not a `noUncheckedIndexedAccess` mitigation).
    triggered_by:
      - "validator-A on design.md — VERDICT: drift, item AC-4 sentence 2 uncovered"
      - "validator-B on design.md — VERDICT: no-drift, cosmetic note on `void stdout;`"
  - id: dec-008
    stage: sddl-plan
    kind: A
    author: claude
    summary: >-
      Test-fixture git commits are invoked with per-command identity
      overrides (`git -c user.email=sentinel@test.local -c
      user.name=sentinel-test commit ...`). Non-repo fixture directory is
      created with `node:fs.mkdirSync({ recursive: true })` instead of a
      shelled `mkdir`. Plan S3 hermeticity retry uses `git clean -fdx
      -e node_modules` (not `git stash -u`, which is a no-op on committed
      state). Plan S3 diff digest is documented for both `sha256sum` (this
      Linux env) and `shasum -a 256` (macOS-portable). Grep gate in S1
      switches to POSIX extended-regex (`grep -REn`) to be portable
      between GNU and BSD grep.
    rationale: >-
      Fixes for the three drift items Validator B raised on the plan.
      The identity override is the most impactful of the three — a fresh
      container/CI runner without a global git identity would fail the
      contract suite cold. The retry-method fix removes a silent no-op
      that was giving false confidence. The portability nits are minor
      but the coding-standards + testing docs already imply portability
      (MVP includes Linux + macOS).
    triggered_by:
      - "validator-A on plan.md — VERDICT: no-drift"
      - "validator-B on plan.md — VERDICT: drift, 3 items (git identity,
        stash-vs-clean, grep/sha256 portability)"
open_questions:
  - id: Q1
    kind: B
    summary: "`branches` scope: local, remote, or both (tagged)?"
    recommendation: >-
      Both, returned as a tagged shape `{ name, kind, remote? }`, one call
      to `for-each-ref refs/heads refs/remotes` — H2 needs local for
      merge-base; H3 needs remote for listBranches.
  - id: Q2
    kind: B
    summary: "default-branch detection: symbolic-ref (needs clone) vs ls-remote --symref (no clone)?"
    recommendation: >-
      `symbolic-ref refs/remotes/<remote>/HEAD` post-clone; H2's registerRepo
      always clones first. Raise `GitNoDefaultBranchError` when HEAD is unset.
  - id: Q3
    kind: B
    summary: "clone target directory: caller-owned absolute path vs adapter-picked layout?"
    recommendation: >-
      Caller owns the path; layout is a registerRepo concern (H2), not a
      git-wrapper concern. Keeps the port thin.
  - id: Q4
    kind: B
    summary: "fetch remote: fixed `origin` vs configurable with default?"
    recommendation: >-
      Configurable, default `origin` — one line, no follow-up needed for H3.
  - id: Q5
    kind: B
    summary: "Error hierarchy: single GitError + code discriminator vs one class per family?"
    recommendation: >-
      Base `GitError extends Error` + typed subclasses per failure family
      (Clone / Fetch / Command / NoDefaultBranch). Matches coding-standards
      `Error` suffix rule and the ReviewEngine port style; downstream use
      cases can discriminate cleanly later.
