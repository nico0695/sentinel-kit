checkpoints:
  - id: chk-b1-port-design
    type: scope_change
    stage: sddl-proposal
    summary: "Port design for harness/skill loading"
    question: "New dedicated HarnessLoader port in review/ports vs extending ConfigStore?"
    options:
      - id: opt-new-port
        label: "New HarnessLoader port"
        description: "Dedicated port in review/ports — cleaner separation, each module owns its ports"
        recommended: true
      - id: opt-extend-configstore
        label: "Extend ConfigStore"
        description: "Add harness methods to existing ConfigStore — single abstraction but mixes patterns"
    free_input_allowed: true
    response:
      selected_option_id: opt-new-port
      responded_at: "2026-08-03"
    created_at: "2026-08-03"
    resolved_at: "2026-08-03"
  - id: chk-b2-override-rule
    type: scope_change
    stage: sddl-proposal
    summary: "Factory vs user harness name conflict resolution"
    question: "When factory and user harnesses share the same name, which takes precedence?"
    options:
      - id: opt-user-wins
        label: "User overrides factory"
        description: "Standard CLI convention — user customization wins"
        recommended: true
      - id: opt-error
        label: "Error on conflict"
        description: "Reject ambiguity with a clear error"
      - id: opt-factory-wins
        label: "Factory wins"
        description: "Factory harnesses are immutable, user must use unique names"
    free_input_allowed: true
    response:
      selected_option_id: opt-user-wins
      responded_at: "2026-08-03"
    created_at: "2026-08-03"
    resolved_at: "2026-08-03"
  - id: chk-b3-validation-rules
    type: scope_change
    stage: sddl-proposal
    summary: "Mandatory files in a harness directory"
    question: "Which files are required in harnesses/<type>/?"
    options:
      - id: opt-harness-only
        label: "harness.md required, rest optional"
        description: "Minimal harnesses allowed — output.md and skills.yaml are optional"
        recommended: true
      - id: opt-harness-output
        label: "harness.md + output.md required"
        description: "Both instructions and output contract mandatory"
      - id: opt-all-required
        label: "All three required"
        description: "Strictest validation — harness.md, output.md, and skills.yaml all mandatory"
    free_input_allowed: true
    response:
      selected_option_id: opt-harness-only
      responded_at: "2026-08-03"
    created_at: "2026-08-03"
    resolved_at: "2026-08-03"

decisions:
  - id: dec-b1
    checkpoint_id: chk-b1-port-design
    selected_option_id: opt-new-port
    rationale: "Different read pattern (directory trees vs single YAML file). Each module owns its ports per architecture principle."
    recorded_at: "2026-08-03"
  - id: dec-b2
    checkpoint_id: chk-b2-override-rule
    selected_option_id: opt-user-wins
    rationale: "Standard CLI convention (like git config). Enables customization of built-in harnesses."
    recorded_at: "2026-08-03"
  - id: dec-b3
    checkpoint_id: chk-b3-validation-rules
    selected_option_id: opt-harness-only
    rationale: "Allows minimal harnesses for quick review types. Missing output.md means no verdict parsing; missing skills.yaml means no extra skills."
    recorded_at: "2026-08-03"

open_risks: []

next_action:
  kind: run_stage
  target: sddl-spec
  summary: "Formalize acceptance criteria, domain types, port interface, and skills.yaml schema in spec.md"

