decisions:
  - id: dec-spec-001
    stage: sddl-spec
    level: A
    summary: "XML-style tags for section delimiters"
    rationale: >-
      Standard LLM prompt practice, unambiguous boundaries that do not conflict
      with markdown content in skills or instructions. Reversible if a different
      format proves better with specific engines.
    decided_by: claude
    recorded_at: "2026-08-04T00:00:00Z"
  - id: dec-spec-002
    stage: sddl-spec
    level: A
    summary: "Validation output typed as readonly string[]"
    rationale: >-
      Minimal sufficient type for string messages from validation scripts.
      Widening to a richer interface later is non-breaking since the assembler
      only reads the array.
    decided_by: claude
    recorded_at: "2026-08-04T00:00:00Z"
  - id: dec-spec-003
    stage: sddl-spec
    level: A
    summary: "Omit optional sections entirely when input absent"
    rationale: >-
      Simpler output, no misleading empty tags. Absent outputContract or absent/empty
      validationOutput results in the section being omitted from the prompt.
    decided_by: claude
    recorded_at: "2026-08-04T00:00:00Z"
  - id: dec-spec-004
    stage: sddl-spec
    level: A
    summary: "Diff serialized as XML <file> sub-tags with metadata attributes"
    rationale: >-
      Structured, machine-readable, preserves all metadata (path, additions,
      deletions, truncation). Warnings rendered as <warning> sub-tags before
      file entries for audit visibility.
    decided_by: claude
    recorded_at: "2026-08-04T00:00:00Z"
