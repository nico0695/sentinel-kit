checkpoints:
  - id: cp-change-seed
    type: risk_review
    stage: orchestrator
    summary: >-
      Bootstrap preflight for E4 read `stale` in a materially misleading way for a code-touching
      epic; asked the user how to resolve it before seeding the change.
    question: >-
      The sdd-lite bootstrap is materially stale for E4. Refresh it with a full sddl-init run,
      refresh only the false facts surgically, or proceed without refreshing?
    options:
      - id: sddl-init
        label: Refresh with sddl-init
        description: >-
          Regenerate project-context.md, skill-catalog.md and config.yaml. Highest fidelity, but
          rewrites three files wholesale and re-injects the CLAUDE.md wrapper block.
        recommended: true
      - id: surgical
        label: Surgical manual refresh
        description: >-
          Edit only the stale facts (toolchain versions, quality commands, test roots, engine
          risk zones). Lower blast radius, fully reversible via git.
      - id: skip
        label: Proceed without refreshing
        description: >-
          Seed the change on the current bootstrap and correct each handoff envelope by hand.
    free_input_allowed: true
    response:
      selected_option_id: surgical
      free_text: >-
        User did not answer. Orchestrator proceeded on the lower-blast-radius option and stated
        the assumption explicitly in chat, leaving the choice open to reversal.
      responded_at: "2026-08-09T03:10:00Z"
    created_at: "2026-08-09T03:08:00Z"
    resolved_at: "2026-08-09T03:10:00Z"
  - id: cp-proposal-approval
    type: stage_approval
    stage: sddl-proposal
    summary: >-
      Launch the sddl-proposal worker for [E4.F1.H1] runReview (issue #26), the first stage of
      the E4 epic.
    question: >-
      Approve launching sddl-proposal for [E4.F1.H1] runReview, scoped to the core/run use case
      against FakeEngine only?
    free_input_allowed: true
    response:
      selected_option_id: approve
      free_text: User approved with "comienza".
      responded_at: "2026-08-09T03:25:00Z"
    created_at: "2026-08-09T03:15:00Z"
    resolved_at: "2026-08-09T03:25:00Z"
  - id: cp-validation-failed-semantics
    type: risk_review
    stage: orchestrator
    summary: >-
      The `validation-failed` terminal state has no defined producer. E5.F1.H2 states declared
      validations do NOT abort the review, so E5 never produces it; the PRD defines it only as
      an enum member. Resolving this decides whether the story's acceptance criterion is
      achievable and shapes the public result contract.
    question: >-
      What does the `validation-failed` terminal state mean, given E5 does not produce it?
    options:
      - id: preflight
        label: Pre-flight validation failure
        description: >-
          The review never ran because input or config was invalid: malformed request, unknown
          harness, invalid diff limits. Producible in H1, makes the acceptance criterion
          satisfiable, and is consistent with E5 not producing it.
        recommended: true
      - id: defer-to-spec
        label: Let spec decide with evidence
        description: >-
          Pass the question to the spec worker with both citations and have it propose the
          interpretation as part of the contract, subject to review at the spec gate.
      - id: explicit-deferral
        label: Defer the state explicitly
        description: >-
          H1 does not produce `validation-failed`; record an explicit deferral naming the state
          and its future producer, leaving the acceptance criterion partially met and documented.
    free_input_allowed: true
    response:
      selected_option_id: preflight
      responded_at: "2026-08-09T03:35:00Z"
    created_at: "2026-08-09T03:32:00Z"
    resolved_at: "2026-08-09T03:35:00Z"
  - id: cp-spec-approval
    type: stage_approval
    stage: sddl-spec
    summary: Launch the sddl-spec worker for [E4.F1.H1] with the four open risks carried forward.
    question: Approve routing to sddl-spec?
    free_input_allowed: true
    response:
      selected_option_id: approve
      responded_at: "2026-08-09T03:35:00Z"
    created_at: "2026-08-09T03:32:00Z"
    resolved_at: "2026-08-09T03:35:00Z"
decisions:
  - id: d-validation-failed-preflight
    checkpoint_id: cp-validation-failed-semantics
    selected_option_id: preflight
    rationale: >-
      B-level, user decided. `validation-failed` means a pre-flight validation failure: the
      review never reached the engine because the request or configuration was invalid. Evidence
      supporting the reading: E5.F1.H2 requires declared-validation failures to continue the
      review with the evidence attached, so E5 cannot be the producer; and the only thing
      DiffSizePolicyError actually raises on today is invalid limit configuration
      (compute-review-diff.ts:209,212), which is exactly a pre-flight fault. Makes the story's
      "each terminal state reachable by test" criterion satisfiable without deferral.
    recorded_at: "2026-08-09T03:35:00Z"
  - id: d-change-scope
    checkpoint_id: cp-change-seed
    rationale: >-
      A-level: scope this change to [E4.F1.H1] alone rather than bundling [E4.F1.H2] (verdict
      parser). They are separate backlog stories with separate issues (#26, #27); H1 orchestrates
      the flow against FakeEngine while H2 owns defensive parsing against the real E1 fixtures.
      Bundling them would put two distinct risk profiles behind one approval gate.
    recorded_at: "2026-08-09T03:15:00Z"
  - id: d-dec004-scope
    checkpoint_id: cp-proposal-approval
    rationale: >-
      A-level: the proposal flagged "timeout vs engine-error may require touching the frozen
      ReviewEngine port (dec-004)" as a B/C escalation. Checked the source. dec-004 is recorded
      in the E0.F2.H2 spec and it froze the port against *that* story, explicitly deferring both
      concerns to this one: "No typed port error added to src/core/run in H2 (dec-004) — a typed
      error may arrive later (E4) without breaking this contract" and "The fake does NOT enforce
      timeoutMs (dec-004) — real timeout enforcement is the run flow's job (E4.F1.H1)". So
      wall-clock enforcement in runReview and a typed run-domain error are pre-sanctioned work
      here, not scope expansion. Escalation withdrawn; r-terminal-state-coverage downgraded to
      low. Spec still owns the mapping design.
    recorded_at: "2026-08-09T03:30:00Z"
  - id: d-bootstrap-surgical-refresh
    checkpoint_id: cp-change-seed
    selected_option_id: surgical
    rationale: >-
      A-level: bootstrap preflight read `stale` in a materially misleading way for a
      code-touching epic (config.yaml and skill-catalog.md still claimed vitest/tsup were not
      installed, typescript was recorded as 7.0.2 instead of 5.9.3, test_roots was empty, and
      risk_zones still listed the E1 engine spikes as unresolved unknowns). Refreshed those
      facts surgically against main @ f294af2 instead of regenerating via sddl-init, to avoid
      re-injecting the CLAUDE.md wrapper block and rewriting three files wholesale. Recommended
      sddl-init to the user first; proceeded on the lower-blast-radius option without an answer.
    recorded_at: "2026-08-09T03:10:00Z"
open_risks:
  - id: r-dependency-surface
    severity: medium
    summary: >-
      Part 2 (result shape) settled A-level by spec: return the wide shape, since PRD §9 requires
      runs to persist the prompt and under-returning would force a breaking change on E5's
      RunStore. Part 1 (harness resolution) is the single OPEN B-level decision — it fixes the
      public signature of the flagship use case and blocks sddl-design.
  - id: r-infrastructure-as-engine-error
    severity: medium
    summary: >-
      NEW from spec. Git and infrastructure faults (WorktreeCreationError, GitDiffError) surface
      as `engine-error` because the PRD fixes exactly five terminal states and a sixth would be a
      C-level contradiction. Fidelity is preserved via `failure.stage` + `failure.error` so E6 can
      render an accurate message. Revisit only if E6 proves the label misleads users.
  - id: r-parse-seam
    severity: low
    summary: >-
      RESOLVED by spec: a module-private naive extraction behind an injectable
      `deps.parseVerdict`, not exported from index.ts. Residual: it could be mistaken for "good
      enough" and weaken the case for H2 (#27). Mitigated by Non-Goals wording and by H2 owning
      the fixture corpus and the >=90% parse-rate criterion, which the naive version cannot meet
      by construction.
  - id: r-cleanup-on-error
    severity: low
    summary: >-
      RESOLVED by spec: a cleanup fault ANNOTATES, never overrides and never rethrows. AC-9 and
      AC-10 prove both directions — a fault on the happy path keeps `ok`, and a fault after an
      engine rejection keeps both `engine-error` and the originating EngineInvocationError.
  - id: r-engine-not-cancellable
    severity: low
    summary: >-
      NEW from spec. On timeout the engine promise is abandoned, not killed — the port has no
      abort channel. Inert in H1 (FakeEngine, in-memory git), but cleanup could later remove a
      worktree a live process still holds. `timeoutMs` is still passed to the engine so E4.F2
      adapters (#28-30) own process kill. Flagged forward.
  - id: r-catchall-masks-bugs
    severity: low
    summary: >-
      NEW from spec. The fall-through mapping sends genuine programming bugs to `engine-error`.
      Accepted for the "exactly one terminal state" invariant; the original throwable is
      preserved in `failure.error`, so nothing is lost, only relabelled.
  - id: r-terminal-state-coverage
    severity: low
    summary: >-
      CLOSED by spec: full five-state mapping, every state with at least one named test producer
      (AC-2 through AC-6).
  - id: r-validation-failed-semantics
    severity: low
    summary: >-
      CLOSED by spec: seven concrete pre-flight producers enumerated, one AC-6 case each.
  - id: r-e5-validation-seam
    severity: low
    summary: >-
      CLOSED by spec: `request.validationOutput?: readonly string[]` forwarded verbatim to
      assemblePrompt. No E5 import, no new machinery.
