      and r-validation-failed-semantics).
  sddl-spec:
    status: completed
    started_at: "2026-08-09T03:35:00Z"
    completed_at: "2026-08-09T03:42:00Z"
    notes: >-
      Returned `partial`: spec.md is complete on every axis except one genuine B-level choice
