decisions:
  - id: d-validation-failed-preflight
    checkpoint_id: cp-validation-failed-semantics
    selected_option_id: preflight
    rationale: >-
      B-level, user decided. `validation-failed` means a pre-flight validation failure: the
      review never reached the engine because the request or configuration was invalid. Evidence
      supporting the reading: E5.F1.H2 requires declared-validation failures to continue the
      review with the evidence attached, so E5 cannot be the producer; and the only thing
      DiffSizePolicyError actually raises on today is invalid limit configuration
      (compute-review-diff.ts:209,212), which is exactly a pre-flight fault. Makes the story's
      "each terminal state reachable by test" criterion satisfiable without deferral.
    recorded_at: "2026-08-09T03:35:00Z"
  - id: d-harness-resolution
    checkpoint_id: cp-harness-resolution
    selected_option_id: option-a
    rationale: >-
      B-level, user decided. runReview takes `harnessType: string` and resolves internally via
      deps.harnesses. Beyond the spec's own rationale (E4 DoD passes a bare --type string;
      "unknown harness" belongs to the settled pre-flight validation-failed semantics), the
      orchestrator weighed one more argument in favour: under Option B the CLI would have to
      orchestrate loadHarnesses -> resolveHarnessSkills -> runReview AND map harness errors onto
      run-domain terminal states, putting run-domain logic in a driving adapter. That runs against
      the guard "use cases are the ONLY API of the core -- no logic in TUI/CLI commands".
    recorded_at: "2026-08-09T03:50:00Z"
  - id: d-change-scope
    checkpoint_id: cp-change-seed
    rationale: >-
      A-level: scope this change to [E4.F1.H1] alone rather than bundling [E4.F1.H2] (verdict
      parser). They are separate backlog stories with separate issues (#26, #27); H1 orchestrates
      the flow against FakeEngine while H2 owns defensive parsing against the real E1 fixtures.
      Bundling them would put two distinct risk profiles behind one approval gate.
    recorded_at: "2026-08-09T03:15:00Z"
  - id: d-dec004-scope
    checkpoint_id: cp-proposal-approval
    rationale: >-
      A-level: the proposal flagged "timeout vs engine-error may require touching the frozen
      ReviewEngine port (dec-004)" as a B/C escalation. Checked the source. dec-004 is recorded
      in the E0.F2.H2 spec and it froze the port against *that* story, explicitly deferring both
      concerns to this one: "No typed port error added to src/core/run in H2 (dec-004) — a typed
      error may arrive later (E4) without breaking this contract" and "The fake does NOT enforce
      timeoutMs (dec-004) — real timeout enforcement is the run flow's job (E4.F1.H1)". So
      wall-clock enforcement in runReview and a typed run-domain error are pre-sanctioned work
      here, not scope expansion. Escalation withdrawn; r-terminal-state-coverage downgraded to
      low. Spec still owns the mapping design.
    recorded_at: "2026-08-09T03:30:00Z"
  - id: d-bootstrap-surgical-refresh
    checkpoint_id: cp-change-seed
    selected_option_id: surgical
    rationale: >-
      A-level: bootstrap preflight read `stale` in a materially misleading way for a
      code-touching epic (config.yaml and skill-catalog.md still claimed vitest/tsup were not
      installed, typescript was recorded as 7.0.2 instead of 5.9.3, test_roots was empty, and
      risk_zones still listed the E1 engine spikes as unresolved unknowns). Refreshed those
      facts surgically against main @ f294af2 instead of regenerating via sddl-init, to avoid
      re-injecting the CLAUDE.md wrapper block and rewriting three files wholesale. Recommended
      sddl-init to the user first; proceeded on the lower-blast-radius option without an answer.
    recorded_at: "2026-08-09T03:10:00Z"
open_risks:
  - id: r-dependency-surface
    severity: low
    summary: >-
      CLOSED. Part 2 (result shape) settled A-level by spec: return the wide shape, since PRD §9
      requires runs to persist the prompt and under-returning would force a breaking change on
      E5's RunStore. Part 1 (harness resolution) settled B-level by the user as Option A
      (`d-harness-resolution`): runReview takes `harnessType: string` and resolves internally via
      deps.harnesses.
  - id: r-infrastructure-as-engine-error
    severity: medium
    summary: >-
      NEW from spec. Git and infrastructure faults (WorktreeCreationError, GitDiffError) surface
      as `engine-error` because the PRD fixes exactly five terminal states and a sixth would be a
      C-level contradiction. Fidelity is preserved via `failure.stage` + `failure.error` so E6 can
      render an accurate message. Revisit only if E6 proves the label misleads users.
  - id: r-parse-seam
    severity: low
    summary: >-
      RESOLVED by spec: a module-private naive extraction behind an injectable
      `deps.parseVerdict`, not exported from index.ts. Residual: it could be mistaken for "good
      enough" and weaken the case for H2 (#27). Mitigated by Non-Goals wording and by H2 owning
      the fixture corpus and the >=90% parse-rate criterion, which the naive version cannot meet
      by construction.
  - id: r-cleanup-on-error
    severity: low
    summary: >-
      RESOLVED by spec: a cleanup fault ANNOTATES, never overrides and never rethrows. AC-9 and
      AC-10 prove both directions — a fault on the happy path keeps `ok`, and a fault after an
      engine rejection keeps both `engine-error` and the originating EngineInvocationError.
  - id: r-sync-throw-unwrapped
    severity: low
    summary: >-
      NEW from ST-2, flagged by the executor and verified by the orchestrator. In
      runEngineWithTimeout, `const pending = invoke()` sits outside the try exactly as design.md
      fixes it, so an engine adapter that throws SYNCHRONOUSLY escapes un-wrapped instead of
      becoming an EngineInvocationError. No AC breaks: executePipeline's catch-all still yields
      `engine-error` with `stage: "engine"` (AC-4a, AC-12), and AC-10 asserts the class only for
      the async rejection createFakeEngine produces. Timer hygiene is unaffected -- nothing is
      scheduled on that path. Inert in H1, but a real asymmetry for E4.F2 (#28-30), where an
      adapter throwing on a missing binary would surface a raw error rather than the typed one.
      Not fixed here because the structure is design-fixed and runEngineWithTimeout is not
      exported from index.ts, so changing it later is free.
  - id: r-st2-behaviour-unverified
    severity: medium
    summary: >-
      NEW from ST-2. Neither engine-timeout.ts nor builtin-verdict-extraction.ts is exercised by
      any repository test until ST-4 (AC-3, AC-5) and ST-5 (AC-14, timer hygiene). `npm run
      check` proves types and guards, not behaviour, so this stage's green is structurally weaker
      than the others'. The executor compensated with an out-of-repo smoke run (scratchpad copies,
      21/21 assertions over 9 extraction cases plus happy path / timeout / rejection / sync-throw
      / late-rejection, each asserting cancel count) -- interim evidence only, NOT a repository
      artifact and not a substitute for ST-4/ST-5. Closes when those stages land.
  - id: r-st2-concurrency-stage
    severity: low
    summary: >-
      NEW from plan. ST-2 concentrates the only concurrency in the core (promise race, no-op
      late-rejection handler, finally-cancel). Mitigated structurally: the file has no importers
      until ST-3, so rollback is one `git checkout --` with zero blast radius. The plan instructs
      a STOP rather than a unilateral fall back to vitest fake timers, which design already
      evaluated and rejected.
  - id: r-st3-strict-mode-pressure
    severity: low
    summary: >-
      NEW from plan. ST-3 is the largest stage and the first place exactOptionalPropertyTypes and
