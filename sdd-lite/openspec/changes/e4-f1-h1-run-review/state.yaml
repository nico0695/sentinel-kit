version: "0.1"
change_name: e4-f1-h1-run-review
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E4.F1.H1] (issue #26): the runReview use case in core/run — the product's central
    flow (worktree -> diff -> prompt -> engine -> parse -> terminal state -> cleanup), complete
    against FakeEngine. Bounded to one core module plus its unit tests, but hot-path: it is the
    first code that composes four existing core modules (workspace, review, run ports, repos)
    and it fixes the shape every later E4/E5 story plugs into. Every dependency is already
    merged on main, so the work needs no new ports and no adapter changes. Ambiguity is
    concentrated in three places, all resolvable at spec/design time: how each failure maps
    onto the five terminal states, how cleanup is guaranteed on the error paths, and where the
    E5 validations seam is left open without implementing it.
  confidence: high
  recorded_at: "2026-08-09T03:15:00Z"
lifecycle_status: planning
current_stage: sddl-design
