decisions:
  - id: d-change-scope
    checkpoint_id: cp-change-seed
    rationale: >-
      A-level: scope this change to [E4.F1.H1] alone rather than bundling [E4.F1.H2] (verdict
      parser). They are separate backlog stories with separate issues (#26, #27); H1 orchestrates
      the flow against FakeEngine while H2 owns defensive parsing against the real E1 fixtures.
      Bundling them would put two distinct risk profiles behind one approval gate.
    recorded_at: "2026-08-09T03:15:00Z"
  - id: d-bootstrap-surgical-refresh
    checkpoint_id: cp-change-seed
    selected_option_id: surgical
    rationale: >-
      A-level: bootstrap preflight read `stale` in a materially misleading way for a
      code-touching epic (config.yaml and skill-catalog.md still claimed vitest/tsup were not
      installed, typescript was recorded as 7.0.2 instead of 5.9.3, test_roots was empty, and
      risk_zones still listed the E1 engine spikes as unresolved unknowns). Refreshed those
      facts surgically against main @ f294af2 instead of regenerating via sddl-init, to avoid
      re-injecting the CLAUDE.md wrapper block and rewriting three files wholesale. Recommended
      sddl-init to the user first; proceeded on the lower-blast-radius option without an answer.
    recorded_at: "2026-08-09T03:10:00Z"
open_risks:
  - id: r-terminal-state-coverage
    severity: medium
    summary: >-
      The acceptance criterion "each terminal state reachable by test" spans states this story
      cannot produce natively: `validation-failed` belongs to E5 (declared validations) and
      `engine-error` / `timeout` are adapter concerns surfaced through the ReviewEngine port.
      Spec must decide whether FakeEngine drives them through the port or the criterion is
      partially deferred, and say so explicitly rather than silently narrowing the story.
  - id: r-cleanup-on-error
    severity: medium
    summary: >-
      "Correct cleanup even on error" means the worktree must be removed on every path,
      including engine failure and timeout, without swallowing the original error. Design must
      pin the cleanup guarantee and its interaction with the existing E2.F3 cleanup policy.
  - id: r-e5-validation-seam
    severity: low
    summary: >-
      The backlog describes the flow as "diff -> (validations when E5 exists) -> prompt". The
      seam must be left open without implementing ProcessRunner or importing anything from E5,
      or the guards and the story boundary both break.
