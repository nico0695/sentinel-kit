  sddl-deep-explorer:
    status: skipped
    notes: >-
      No material unknown blocks routing. All four dependencies (E2.F3.H1 worktree lifecycle,
      E2.F3.H2 diff size policy, E3.F1.H2 prompt assembler, E0.F2.H2 FakeEngine + contract
      suite) are merged on main and their public index modules are readable at spec time.
  sddl-proposal:
    status: completed
    started_at: "2026-08-09T03:25:00Z"
    completed_at: "2026-08-09T03:29:00Z"
    notes: >-
      proposal.md written. Exploration performed. Sharpened the three seeded risks into six open
