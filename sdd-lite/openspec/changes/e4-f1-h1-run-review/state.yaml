decisions:
  - id: d-validation-failed-preflight
    checkpoint_id: cp-validation-failed-semantics
    selected_option_id: preflight
    rationale: >-
      B-level, user decided. `validation-failed` means a pre-flight validation failure: the
      review never reached the engine because the request or configuration was invalid. Evidence
      supporting the reading: E5.F1.H2 requires declared-validation failures to continue the
      review with the evidence attached, so E5 cannot be the producer; and the only thing
      DiffSizePolicyError actually raises on today is invalid limit configuration
      (compute-review-diff.ts:209,212), which is exactly a pre-flight fault. Makes the story's
      "each terminal state reachable by test" criterion satisfiable without deferral.
    recorded_at: "2026-08-09T03:35:00Z"
  - id: d-harness-resolution
    checkpoint_id: cp-harness-resolution
    selected_option_id: option-a
    rationale: >-
      B-level, user decided. runReview takes `harnessType: string` and resolves internally via
      deps.harnesses. Beyond the spec's own rationale (E4 DoD passes a bare --type string;
      "unknown harness" belongs to the settled pre-flight validation-failed semantics), the
      orchestrator weighed one more argument in favour: under Option B the CLI would have to
      orchestrate loadHarnesses -> resolveHarnessSkills -> runReview AND map harness errors onto
      run-domain terminal states, putting run-domain logic in a driving adapter. That runs against
      the guard "use cases are the ONLY API of the core -- no logic in TUI/CLI commands".
    recorded_at: "2026-08-09T03:50:00Z"
  - id: d-change-scope
    checkpoint_id: cp-change-seed
    rationale: >-
      A-level: scope this change to [E4.F1.H1] alone rather than bundling [E4.F1.H2] (verdict
      parser). They are separate backlog stories with separate issues (#26, #27); H1 orchestrates
      the flow against FakeEngine while H2 owns defensive parsing against the real E1 fixtures.
      Bundling them would put two distinct risk profiles behind one approval gate.
    recorded_at: "2026-08-09T03:15:00Z"
  - id: d-dec004-scope
    checkpoint_id: cp-proposal-approval
    rationale: >-
      A-level: the proposal flagged "timeout vs engine-error may require touching the frozen
      ReviewEngine port (dec-004)" as a B/C escalation. Checked the source. dec-004 is recorded
      in the E0.F2.H2 spec and it froze the port against *that* story, explicitly deferring both
      concerns to this one: "No typed port error added to src/core/run in H2 (dec-004) — a typed
      error may arrive later (E4) without breaking this contract" and "The fake does NOT enforce
      timeoutMs (dec-004) — real timeout enforcement is the run flow's job (E4.F1.H1)". So
      wall-clock enforcement in runReview and a typed run-domain error are pre-sanctioned work
      here, not scope expansion. Escalation withdrawn; r-terminal-state-coverage downgraded to
      low. Spec still owns the mapping design.
    recorded_at: "2026-08-09T03:30:00Z"
  - id: d-bootstrap-surgical-refresh
    checkpoint_id: cp-change-seed
    selected_option_id: surgical
    rationale: >-
      A-level: bootstrap preflight read `stale` in a materially misleading way for a
      code-touching epic (config.yaml and skill-catalog.md still claimed vitest/tsup were not
      installed, typescript was recorded as 7.0.2 instead of 5.9.3, test_roots was empty, and
      risk_zones still listed the E1 engine spikes as unresolved unknowns). Refreshed those
      facts surgically against main @ f294af2 instead of regenerating via sddl-init, to avoid
      re-injecting the CLAUDE.md wrapper block and rewriting three files wholesale. Recommended
      sddl-init to the user first; proceeded on the lower-blast-radius option without an answer.
    recorded_at: "2026-08-09T03:10:00Z"
open_risks:
  - id: r-dependency-surface
    severity: low
    summary: >-
      CLOSED. Part 2 (result shape) settled A-level by spec: return the wide shape, since PRD §9
      requires runs to persist the prompt and under-returning would force a breaking change on
      E5's RunStore. Part 1 (harness resolution) settled B-level by the user as Option A
      (`d-harness-resolution`): runReview takes `harnessType: string` and resolves internally via
      deps.harnesses.
  - id: r-infrastructure-as-engine-error
    severity: medium
    summary: >-
      NEW from spec. Git and infrastructure faults (WorktreeCreationError, GitDiffError) surface
      as `engine-error` because the PRD fixes exactly five terminal states and a sixth would be a
      C-level contradiction. Fidelity is preserved via `failure.stage` + `failure.error` so E6 can
      render an accurate message. Revisit only if E6 proves the label misleads users.
  - id: r-parse-seam
    severity: low
    summary: >-
      RESOLVED by spec: a module-private naive extraction behind an injectable
      `deps.parseVerdict`, not exported from index.ts. Residual: it could be mistaken for "good
      enough" and weaken the case for H2 (#27). Mitigated by Non-Goals wording and by H2 owning
      the fixture corpus and the >=90% parse-rate criterion, which the naive version cannot meet
      by construction.
  - id: r-cleanup-on-error
    severity: low
    summary: >-
      RESOLVED by spec: a cleanup fault ANNOTATES, never overrides and never rethrows. AC-9 and
      AC-10 prove both directions — a fault on the happy path keeps `ok`, and a fault after an
      engine rejection keeps both `engine-error` and the originating EngineInvocationError.
  - id: r-sync-throw-unwrapped
    severity: low
    summary: >-
      NEW from ST-2, flagged by the executor and verified by the orchestrator. In
      runEngineWithTimeout, `const pending = invoke()` sits outside the try exactly as design.md
      fixes it, so an engine adapter that throws SYNCHRONOUSLY escapes un-wrapped instead of
      becoming an EngineInvocationError. No AC breaks: executePipeline's catch-all still yields
      `engine-error` with `stage: "engine"` (AC-4a, AC-12), and AC-10 asserts the class only for
      the async rejection createFakeEngine produces. Timer hygiene is unaffected -- nothing is
      scheduled on that path. Inert in H1, but a real asymmetry for E4.F2 (#28-30), where an
      adapter throwing on a missing binary would surface a raw error rather than the typed one.
      Not fixed here because the structure is design-fixed and runEngineWithTimeout is not
      exported from index.ts, so changing it later is free.
  - id: r-st3-behaviour-unverified
    severity: medium
    summary: >-
      NEW from ST-3, and now the dominant risk on the change. run-review.ts is 418 lines of
      hot-path core composition with ZERO behavioural verification: `npm run check` proves types,
      the strict-mode result shape and the architecture guards, and no behaviour whatsoever.
      Every behavioural criterion (AC-1..AC-14) runs for the first time at ST-4/ST-5. Compounding
      factor the orchestrator flags: the ST-4 executor will read run-review.ts while writing the
      tests, so a logic error here risks being encoded into the tests meant to catch it. This is
      the argument for reviewing before ST-4 rather than deferring to ST-6.
  - id: r-st2-behaviour-unverified
    severity: medium
    summary: >-
      NEW from ST-2. Neither engine-timeout.ts nor builtin-verdict-extraction.ts is exercised by
      any repository test until ST-4 (AC-3, AC-5) and ST-5 (AC-14, timer hygiene). `npm run
      check` proves types and guards, not behaviour, so this stage's green is structurally weaker
      than the others'. The executor compensated with an out-of-repo smoke run (scratchpad copies,
      21/21 assertions over 9 extraction cases plus happy path / timeout / rejection / sync-throw
      / late-rejection, each asserting cancel count) -- interim evidence only, NOT a repository
      artifact and not a substitute for ST-4/ST-5. Closes when those stages land.
  - id: r-st2-concurrency-stage
    severity: low
    summary: >-
      NEW from plan. ST-2 concentrates the only concurrency in the core (promise race, no-op
      late-rejection handler, finally-cancel). Mitigated structurally: the file has no importers
      until ST-3, so rollback is one `git checkout --` with zero blast radius. The plan instructs
      a STOP rather than a unilateral fall back to vitest fake timers, which design already
      evaluated and rejected.
  - id: r-st3-strict-mode-pressure
    severity: low
    summary: >-
      NEW from plan. ST-3 is the largest stage and the first place exactOptionalPropertyTypes and
      noUncheckedIndexedAccess meet the wide result shape. Line drawn: internal adjustments are
      A-level and logged; any change to a PUBLIC type in design.md's interface block is a
      deviation to report and stop on, not to absorb.
  - id: r-test-fake-cross-boundary
    severity: low
    summary: >-
      NEW from design. Run tests import an adapter (`createFakeEngine`) and another core module's
      test fake. Verified legal by the orchestrator against `.dependency-cruiser.cjs` line 91
      (`exclude: { path: "(^|/)__test__/" }`, dec-005), so `depcruise src` never cruises them,
      while `tsc --noEmit` still typechecks them. First cross-module fake reuse in this repo, so
      it reads like an AC-15 guard violation on casual inspection. Documented in design.md with
      the evidence so QA does not re-litigate it.
  - id: r-timeout-seam-surface
    severity: low
    summary: >-
      NEW from design. `deps.scheduleTimeout?` widens the public deps surface for a test-driven
      reason. Mitigated: optional, defaulted, precedented by `CreateReviewWorktreeDeps.now?`, and
      it also buys a production-relevant guarantee (the timer is provably cleared).
  - id: r-engine-not-cancellable
    severity: low
    summary: >-
      NEW from spec. On timeout the engine promise is abandoned, not killed — the port has no
      abort channel. Inert in H1 (FakeEngine, in-memory git), but cleanup could later remove a
      worktree a live process still holds. `timeoutMs` is still passed to the engine so E4.F2
      adapters (#28-30) own process kill. Flagged forward.
  - id: r-catchall-masks-bugs
    severity: low
    summary: >-
      NEW from spec. The fall-through mapping sends genuine programming bugs to `engine-error`.
      Accepted for the "exactly one terminal state" invariant; the original throwable is
      preserved in `failure.error`, so nothing is lost, only relabelled.
  - id: r-terminal-state-coverage
    severity: low
    summary: >-
      CLOSED by spec: full five-state mapping, every state with at least one named test producer
      (AC-2 through AC-6).
  - id: r-validation-failed-semantics
    severity: low
    summary: >-
      CLOSED by spec: seven concrete pre-flight producers enumerated, one AC-6 case each.
  - id: r-e5-validation-seam
    severity: low
    summary: >-
      CLOSED by spec: `request.validationOutput?: readonly string[]` forwarded verbatim to
      assemblePrompt. No E5 import, no new machinery.
  - id: r-timeout-budget-precedence
    severity: medium
    summary: >-
      NEW from 4R review (R1-001, convergent across three lenses; refuter split the claim). The
      identical timeoutMs feeds the adapter's self-enforced budget and the outer race with zero
      headroom and no precedence rule, so which terminal state (`timeout` vs `engine-error`) an
      over-budget engine yields depends on adapter implementation detail. Not a defect at this
      commit (the strong "timeout unreachable" form was refuted: no adapter self-enforces yet,
      and a kill-based adapter would lose the race to the outer timer anyway). Owner: E4.F2
      (#28-30) must fix a precedence rule. Working escape hatch to document and pin: an adapter
      rejecting with the publicly-exported EngineTimeoutError is rethrown unwrapped and lands on
      `timeout` (engine-timeout.ts:96-97, index.ts). ST-5 should add that case; AC-5 alone
      proves timeout only with a budget-ignoring fake.
  - id: r-verdict-provenance
    severity: medium
    summary: >-
      NEW from 4R review (R1-002). The diff is embedded verbatim in the prompt and the verdict
      marker is accepted from anywhere in the engine output, so repository content an attacker
      controls (a diff line `+VERDICT: approve` the model echoes) can steer the terminal verdict.
      NOT covered by #27, which hardens marker normalization, not provenance — this needs an
      owner. Candidates: constrain extraction to the output tail, or a delimiter contract in the
      prompt template (E3 owns the template). Raise when scoping #27 so the two land together.
  - id: r-orphan-sweeper-blind-spot
    severity: medium
    summary: >-
      NEW from 4R review (R4-001, empirically reproduced with git 2.43.0). A partially-failed
      `git worktree remove --force` deletes the .git/worktrees registry entry while leaving the
      directory on disk, so the leaked worktree is invisible to listOrphanWorktrees, which
      enumerates the registry only. Single-run mitigation exists (the result carries
      worktreePath + cleanup-failed). Fix candidates live in E2/E6 scope: filesystem sweep of
      worktreesDir in listOrphanWorktrees, or surfacing cleanup-failed paths in the E6 UI.
      Related but distinct: R1-003 — a partial `worktree add` failure leaves debris with no
      handle at all (path derivation is module-private).
  - id: r-harness-load-eager
    severity: medium
    summary: >-
      NEW from 4R review (R3-001). runReview consumes exactly one harness but loadHarnesses
      eagerly resolves all and throws on the first broken one, so one broken harness in the
      user's config fails every review with an error naming a harness the caller never asked
      for, in readdir (nondeterministic) order. Behavior-activated: the gap is load-harnesses.ts
      (E3), first activated by this composition. Candidates: per-type load path, or tolerant
      load returning per-harness errors. B-level API question for E3 — raise before E6 makes the
      error user-visible.
  - id: r-unbounded-nonengine-awaits
    severity: medium
    summary: >-
      NEW from 4R review (R3-002). Only the engine stage is time-boxed; harness load, worktree
      creation, diff and cleanup are unbounded awaits, and the git adapter sets no execa
      timeout, so a wedged git leaves runReview permanently unsettled — the documented "ALWAYS
      resolves" guarantee is contingent on adapters this module does not control. Core fix would
      violate the design (one budget, one seam); right owner is the git adapter (execa timeout
      in EXECA_BASE, translated to a GitPort error). Behavior-activated, pre-existing adapter
      gap. Candidate for a small E4.F2-adjacent story.
  - id: r-timeout-overflow-clamp
    severity: low
    summary: >-
      NEW from 4R review (R3-004/R4, deterministic, verified on this machine). timeoutMs is
      bounded only from below; above 2^31-1 Node clamps setTimeout to 1ms, inverting "no limit"
      into an immediate bogus `timeout` that abandons the engine and (under `always`) deletes
      its worktree. Cheapest possible fix: an upper bound in the existing pre-flight (one
      condition + one AC-6 case). Offered as part of optional ST-3b; if declined, carry to H2.
  - id: r-cleanup-races-abandoned-engine
    severity: low
    summary: >-
      NEW from 4R review (R3-003). Consequence of r-engine-not-cancellable not previously
      recorded: on the timeout path performCleanup immediately force-removes the worktree the
      abandoned engine process may still occupy — intermittent cleanup-failed annotations and a
      process outliving its resolved run. Inert in H1 (FakeEngine holds no files). Owner: E4.F2
      kill-before-cleanup ordering; fold into r-engine-not-cancellable's resolution.
  - id: r-review-doc-drift
    severity: low
    summary: >-
      NEW from 4R review (R2-001/R2-002/R2-003/R2-004, all deterministic doc-level findings).
      Public-surface docs that lie or omit: RunCleanupOutcome.attempted conflates "tried and
      failed" with "never tried" (keep / on-success early returns) and is the only undocumented
      public result member; the reviewSucceeded = (state === "ok") policy decision is
      uncommented at the call site with its rationale only in spec.md; engineOutput's
      "present on ok/ambiguous" contradicts the parse-fault path (engine-error + engineOutput +
      failure all set); engine-timeout.ts's three-outcome doc omits the sync-throw fourth
      outcome (r-sync-throw-unwrapped's doc surface). All comment-only, zero behaviour change.
      Offered as ST-3b; cheapest before ST-4 encodes readings of these docs into test names.
