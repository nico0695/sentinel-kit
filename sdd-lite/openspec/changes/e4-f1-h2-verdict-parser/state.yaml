      (2) MAJOR, buildability trap -- decoy-then-genuine.txt gave a 55-line hint AND a
      "decoy outside both windows" constraint that the hint does not imply. With short filler
      the file falls under 2000 chars, the char-window degenerates to the whole file, wins the
