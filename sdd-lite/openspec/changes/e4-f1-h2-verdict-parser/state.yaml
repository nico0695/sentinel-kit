  summary: >-
    Story [E4.F1.H2] (issue #27): the defensive verdict parser that replaces H1's deliberately
    naive built-in extraction through the already-shipped `deps.parseVerdict` seam. Smaller and
    better-bounded than H1: a pure function plus its fixture corpus, no composition, no
    concurrency, no new ports. The seam, the `Verdict` type and the `VerdictParser` contract all
    exist and are tested, and the 12 real engine fixtures from E1.F1.H3 are on main — so the
    oracle is already written. Risk is concentrated in policy, not structure: how permissive
    normalization may be before it becomes an injection vector, and what counts as a
    contradiction. Ceremony deliberately lighter than H1 (see d-lightweight-ceremony).
