decisions:
  - id: d-st1-evidence-obligation
    rationale: >-
      A-level, orchestrator. The plan correctly identifies ST-1 as the riskiest stage: it
      replaces the body of a function that has a live caller, and its only regression signal is
      the 200-test baseline, none of which exercises the tail window, the narrowed contradiction
      scope, or SGR stripping. Rather than reorder (implementation-first is the only green-at-
      every-stage sequence available), ST-1's exit criteria gain one obligation: before
      reporting done, the executor runs an ad-hoc throwaway script that feeds the FOUR real
      marker-bearing fixtures' reconstructed text through the new parser and prints each result,
      confirming all four still resolve to "request-changes", and pastes that output into the
      execution log as interim evidence. This is explicitly NOT a repository artifact and NOT a
      substitute for ST-3's real tests -- it is the same interim-evidence pattern H1's ST-2
      executor used when shipping untested concurrency, and it converts ST-1's weakest claim
      ("the existing suite did not break") into a positive check of the property the stage
      actually changes.
    recorded_at: "2026-08-15T16:31:43Z"
  - id: d-design-open-questions
    rationale: >-
      A-level x3, orchestrator, resolving the open questions sddl-design correctly escalated
      rather than baking in silently.
      (1) TAIL-WINDOW TIE-BREAK IS VACUOUS -- the design proposed keeping `tailByLines` as the
      tie-winner and warned that an equal-length tie could select different starting content.
      That premise is false and the concern is removed rather than carried: both candidates are
      SUFFIXES of the same raw string (split/slice/join on "\n" round-trips exactly, and
      slice(-N) is a suffix by definition), and two suffixes of one string with equal length are
      necessarily identical. The `>` vs `>=` choice therefore cannot affect any input. Keep the
      code as written, but document it as provably immaterial instead of as a conservative
      default, so no future reader re-litigates a non-choice.
      (2) DEFENSIVE NON-STRING GUARD: ACCEPTED, WITH A TEST. The one-line coercion stays. It is
      not dead code in practice: extractBuiltInVerdict is the DEFAULT behind
      `deps.parseVerdict ??`, fed by engineResult.output, and the E4.F2 adapters that will
      produce that value parse JSON at a real JS boundary where a malformed field can yield a
      non-string despite the port's type. The "never throws" guarantee is inherited from H1 and
      is worth one line. Condition attached: it must be exercised by a test using an explicit
      cast, so the change does not add an untested branch -- which was the only real objection.
      (3) AC-13 IS AUTOMATABLE; THE DESIGN'S REASON FOR NOT AUTOMATING IT IS WRONG. The design
      declined an automated export check on the premise that enforcement would require a
      ts-expect-error-style negative test, which is unusual house style. It does not: a
      positive-space assertion -- import the module namespace from ../index.js and assert
      Object.keys() does not contain "extractBuiltInVerdict" -- is one ordinary line, matches
      house style, and mechanically catches the real regression (a future edit re-exporting the
      internal). Added as an obligation for the plan/executor. This upgrades AC-13 from a manual
      inspection step to a mechanically enforced one; spec.md's Validation Hint stays valid
      since it named source inspection as sufficient, not as maximal.
    recorded_at: "2026-08-15T16:27:22Z"
  - id: d-synthetic-adversarial-fixtures
    checkpoint_id: cp-h2-proposal-decisions
    selected_option_id: synthetic-yes+generous-window
    rationale: >-
      B-level, user decided. 2-3 hand-written fixtures added alongside the 12 real ones: (a) a
      marker-shaped VERDICT line quoted early/mid-output with the genuine verdict stated later
      -- proves the tail-window provenance rule actually resolves to the genuine one, not the
      quoted one; (b) two distinct VERDICT values present -- proves the contradiction rule
      still fires with the widened whole-output scan. These do NOT count toward the >=90%
      real-corpus figure (r-parse-rate-criterion stays defined against the 12 real fixtures
      alone) -- they are the sole evidence for the provenance/contradiction properties, which
      the real corpus cannot exercise at all.
    recorded_at: "2026-08-15T16:05:54Z"
  - id: d-tail-window-size
    checkpoint_id: cp-h2-proposal-decisions
    selected_option_id: synthetic-yes+generous-window
    rationale: >-
      B-level, user decided. Tail-window provenance constraint sized generously: last ~30
      lines or last ~2000 characters, whichever is LARGER (union, not intersection) -- covers
      both real marker-bearing fixtures with wide margin (first-line and last-line placements
      both fall inside almost any reasonable window at this corpus's output lengths) while
      still excluding a hypothetical much-earlier quoted line in a long response. Explicitly a
      judgment call, not derived from data; the synthetic adversarial fixture
      (d-synthetic-adversarial-fixtures) is what actually validates the boundary this number
      draws, not the corpus.
    recorded_at: "2026-08-15T16:05:54Z"
  - id: d-provenance-in-scope
    checkpoint_id: cp-h2-scoping
    selected_option_id: provenance-in-scope
    rationale: >-
      B-level, user decided. `r-verdict-provenance` (raised by the H1 4R review as R1-002 and
      recorded there as needing an owner) is resolved inside H2. Decisive argument: normalization
      and provenance are not independent. H1's parser is anchored and case-sensitive, which
      incidentally makes injection hard; H2's mandate is to relax exactly those anchors for real
      engine output, so shipping normalization without a provenance policy would leave the
      product strictly MORE injectable than it is today. Candidate mechanisms for the spec to
      choose between: constrain extraction to the output tail, or a delimiter contract in the
      prompt template (E3 owns the template, so that route needs a cross-module check).
    recorded_at: "2026-08-15T15:56:05Z"
  - id: d-persistence-ac-deferred
    checkpoint_id: cp-h2-scoping
    selected_option_id: persistence-deferred
    rationale: >-
      B-level, user decided. Issue #27's third acceptance criterion ("ambiguous run persisted
      with a marker") is not satisfiable in H2: persistence is `RunStore` (E5.F2.H1), which does
      not exist, and H1's spec already fixed that this flow writes no run anywhere. Deferred with
      an explicit record rather than pulled forward as a stub, which would expand H2 into E5 and
      create an interface E5.F2.H1 would then have to replace. The spec states the deferral and
      names the blocking story; the issue gets the same note before the PR.
    recorded_at: "2026-08-15T15:56:05Z"
  - id: d-lightweight-ceremony
    rationale: >-
      A-level, orchestrator, with the user's explicit token-cost goal as input. H2 runs the full
      canonical lite flow but with deliberately lighter machinery than H1, justified by risk
      profile rather than by budget alone: (a) target ~3 executor stages instead of 6, because
      the deliverable is one pure function plus tests rather than a composition across four
      modules; (b) no mid-execution full-4r pre-scheduled -- for a pure function the 12-fixture
      corpus IS the oracle, and the empirical lesson from H1 is that its expensive four-lens
      review missed the git option-injection defect that the PR's free automated reviewer caught,
      so the marginal value of that layer here is low; (c) stage workers run on a smaller model
      (proposal, design, plan, executor, QA) while the spec -- which fixes the contract every
      later stage validates against -- and orchestration keep the larger one. Revisit (b) if the
      executor reports a structural surprise.
    recorded_at: "2026-08-15T15:56:05Z"
open_risks:
  - id: r-verdict-provenance
    severity: medium
    summary: >-
      CARRIED FORWARD from H1 (4R review R1-002), now IN SCOPE here per `d-provenance-in-scope`.
      The diff is embedded verbatim in the prompt and the marker is accepted from anywhere in the
      engine output, so repository content an attacker controls (a diff line `+VERDICT: approve`
      the model echoes) can steer the terminal verdict. H2 must ship a provenance policy in the
      same change as the normalization hardening, because the hardening widens the hole.
  - id: r-normalization-vs-injection
    severity: medium
    summary: >-
      NEW at seed, the central design tension of this story. Every permissive rule H2 adds (ANSI
      stripping, markdown/code-fence unwrapping, case folding, fuzzy or unanchored matching)
      raises the parse rate toward the >=90% criterion AND widens what an injected marker can look
      like. The spec must state the trade-off explicitly per rule rather than adding rules until
      the corpus passes.
  - id: r-parse-rate-criterion
    severity: low
    summary: >-
      NEW at seed. The backlog fixes a >=90% parse-rate success criterion, but the fixture corpus
      is 12 files of which several are deliberately verdict-less (`no-verdict`,
      `context-overflow`, `auth-error`, `timeout-sigterm`). The denominator therefore needs
      defining before the criterion is measurable: percentage of fixtures that CONTAIN a verdict
      and are parsed correctly, with the verdict-less ones asserted as correctly ambiguous.
      Spec owns the definition.
  - id: r-contradiction-semantics
    severity: low
    summary: >-
      NEW at seed. H1 collapses repeated identical markers to one value and treats two distinct
      values as ambiguous. Real output may contain a verdict inside a quoted example, a
      "thinking" section, or a summary that restates it differently. Whether position or context
      breaks a tie is a policy question the fixtures should answer, not the implementer.
