version: "0.1"
change_name: e4-f2-h1-claude-code-adapter
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E4.F2.H1] (issue #28): the first real ReviewEngine adapter, wrapping the canonical
    claude-code CLI invocation the [E1.F1.H1] spike already captured with real evidence (exact
    command, stdin path, JSON shape, all five failure signatures). Depends only on closed/merged
    work (E1.F1.H1 spike, E1.F1.H3 fixtures, E0.F2.H2 port + contract suite + FakeEngine). Risk is
    concentrated in two structural gaps the frozen ReviewEngine port does not cover today: an
    isAvailable()-style pre-check (PRD Sec6.2 names it as settled, the port has only review()) and
    a contract-test binary-mocking seam (no existing injection pattern in this repo). Both
    escalated to spec rather than decided in proposal.
  confidence: high
  recorded_at: "2026-08-15T20:05:00Z"
lifecycle_status: implementing
current_stage: sddl-executor
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No material unknown blocks routing to proposal. The spike doc, fixtures, port, and contract
      suite are all merged and directly readable.
  sddl-proposal:
    status: completed
    started_at: "2026-08-15T19:55:00Z"
    completed_at: "2026-08-15T20:05:00Z"
    notes: >-
      proposal.md written by a Sonnet worker, status ready-for-spec (with two open questions).
      Grounded in direct inspection of review-engine.ts, run-review.ts, git-cli.ts (the only
      existing spawn-a-binary adapter precedent), the FakeEngine contract suite, both E4.F1
      state.yaml files' open_risks, docs/engines/claude-code.md, fixtures/README.md, and the raw
      bytes of four fixtures (auth-error.json, timeout-sigterm.json, context-overflow.json,
      valid-verdict.json) -- confirmed .is_error is the authoritative success flag (.subtype
      reads "success" even on auth-error and context-overflow) and timeout-sigterm.json
      genuinely has no .result field. Orchestrator independently re-read review-engine.ts and
      confirmed the port is exactly one method, review(request) -> Promise<ReviewResult>, with
      no isAvailable() surface -- the proposal's central finding is real, not a misreading.
      Two A-level judgment calls made and ratified: (1) adapter-owned SIGTERM->SIGKILL timeout
      enforcement is in scope now, closing r-engine-not-cancellable and
      r-cleanup-races-abandoned-engine, both of which H1's state.yaml named "E4.F2" as owner;
      (2) JSON envelope extraction (.result/.usage) is in scope here, restating a boundary H2's
      own proposal already fixed, not re-litigating it. Four items escalated as B-level open
      questions for spec to fix as firm ACs: the isAvailable() port gap, the binary-mocking seam,
      the is_error:true non-auth classification rule, and the totalTokens computation rule.
      "Successful real review" (issue #28 AC-2) proposed as satisfied by a manual verification
      run recorded in execution-log.md, not an automated CI test -- mirrors H1/H2 precedent
      (d-st1-evidence-obligation).
  sddl-spec:
    status: completed
    started_at: "2026-08-15T20:15:00Z"
    completed_at: "2026-08-15T20:15:00Z"
