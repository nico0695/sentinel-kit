decisions:
  - id: d-ac24-deferred-no-live-cli
    checkpoint_id: cp-st5-approval
    free_text: >-
      ST-5's automatable half (closing gate: npm run check, npm test, git diff --stat scope
      check, execa-import grep) was run and is green. The manual AC-24 verification (real
      authenticated claude CLI review) was explicitly NOT attempted -- user chose to document
      it as pending rather than proceed, in response to being asked whether real CLI access was
      available in this environment.
    rationale: >-
      A `claude` binary exists on this session's PATH (/opt/node22/bin/claude), but invoking it
      to run a real review would spawn a genuine, authenticated agentic session as a side effect
      of a build task under this session's own auth/session context -- materially different and
      riskier than a throwaway local script, and not something to do without explicit user
      authorization. User declined to authorize it and asked for the gap to be documented
      instead. Recorded here rather than silently closing the story or fabricating evidence.
    recorded_at: "2026-08-15T22:32:00Z"
  - id: d-st4-contract-usage-fix
    checkpoint_id: cp-contract-usage-fix
    free_text: >-
      ReviewEngine.contract.ts's "propagates the configured usage" test changed from
      harness.resolving("OUT", {totalTokens:42}) / expect({totalTokens:42}) to a full
      {inputTokens:10, outputTokens:32, totalTokens:42} tuple, propagated and asserted whole.
    rationale: >-
      User-selected (AskUserQuestion, 3 options, this one recommended). Root cause: the test
      was only ever exercised against FakeEngine's literal-passthrough harness (confirmed via
      fake-engine.test.ts) -- no derivation-based engine had tried to satisfy it before
      claude-code, the first real ReviewEngine implementation. The fix preserves the generic
      property under test (configured usage propagates verbatim) while making it achievable by
      any engine whose usage is derived from real parsed fields, not just a fully scripted
      double -- and unblocks opencode (#29) from hitting the identical issue later. Re-ran full
      suite after the fix: 250/250 (226 baseline + 24 new claude-code tests), npm run check
      clean. This decision also means AC-26's originally-stated diff-scope boundary
      (claude-code/** + __test__/ + one barrel line) now has one explicitly-approved exception:
      ReviewEngine.contract.ts.
    recorded_at: "2026-08-15T22:22:00Z"
  - id: d-st3-index-docstring-fix
    checkpoint_id: cp-st4-approval
    free_text: >-
      Corrected engines/index.ts's header doc-comment during ST-3 acceptance: it still read
      "Public API today: the scripted FakeEngine..." after this same stage added
      createClaudeCodeAdapter to the barrel. Now names both the landed claude-code adapter and
      the not-yet-built opencode adapter (#29).
    rationale: >-
      Same class of self-caught doc-staleness this session's H1/H2 PRs had flagged by GitHub
      Copilot's automated review after the fact -- caught here, before any PR, at zero cost.
      Low-risk, in-scope (same file the stage already touched), reversible; not escalated.
    recorded_at: "2026-08-15T22:12:00Z"
  - id: d-ac19-timeout-equal-not-shortened
    checkpoint_id: cp-design-approval
    free_text: >-
      Adapter's own execa timeout for the real review invocation is set to request.timeoutMs
      exactly (not artificially shortened), paired with an explicit forceKillAfterDelay:2000
      (execa default 5000).
    rationale: >-
      engine-timeout.ts:76-111 (read directly): the outer race's expiry timer resolves
      synchronously with no I/O wait, while the adapter's own OS-mediated process kill
      inherently settles later -- so the outer race reliably wins in real execution without
      needing to shrink the user's configured budget. A shortened adapter budget was considered
      and rejected: spec's approved AC-13/14/18 already fix the adapter's own timeout-kill
      rejection to ClaudeCodeReviewError/ClaudeCodeInvocationError (never EngineTimeoutError),
      so shortening would only make the adapter's own rejection win the race MORE often,
      degrading the terminal state to "engine-error" more, not less -- the opposite of the
      intended outcome. The EngineTimeoutError "escape hatch" (H1 state.yaml) was investigated
      and rejected: using it would require the adapter to throw the core's own error type,
      contradicting the already-approved AC-13/14/18 mapping.
    recorded_at: "2026-08-15T20:25:00Z"
  - id: d-noisy-output-usage-correction
    checkpoint_id: cp-spec-approval
    free_text: >-
      Corrected noisy-output.json's usage figures in spec.md (Expected Behavior table + AC-11)
      from a spec-authoring error (output_tokens:164, cache_read:16246, cache_creation:9386,
      totalTokens:166/NOT-22794) to the fixture's real byte values (output_tokens:529,
      cache_read:21886, cache_creation:3810, totalTokens:531/NOT-26227).
    rationale: >-
      Orchestrator re-verification (python3 json.load against the raw fixture file) found the
      spec's cited numbers did not match fixture bytes. Left uncorrected, AC-11's own validation
      hint would have told a future test-writer to assert a totalTokens value (166) that no
      fixture actually produces -- the exact class of error this session's standing practice
      (independently verify every subagent claim against source before accepting a stage) exists
      to catch. Not attributable to proposal.md, which never cited these specific numbers -- a
      spec-stage-introduced error, caught and fixed before the stage was accepted.
    recorded_at: "2026-08-15T20:15:00Z"
  - id: d-timeout-ownership-in-scope
    checkpoint_id: cp-proposal-approval
    free_text: >-
      Adapter-owned SIGTERM->SIGKILL timeout enforcement is in scope for this story, not
      deferred again.
    rationale: >-
      Both e4-f1-h1-run-review/state.yaml open risks that named "E4.F2" as owner
      (r-engine-not-cancellable, r-cleanup-races-abandoned-engine) point specifically at "the
      E4.F2 adapters" as the place process-kill gets implemented, and claude-code is the first
      of those adapters. Deferring again would mean no E4.F2 story ever picks it up. The exact
      precedence rule against runReview's outer timeout race (r-timeout-budget-precedence) is
      narrower and left open for spec/design, since the outer race's EngineTimeoutError escape
      hatch already exists and could be the adapter's own mechanism.
    recorded_at: "2026-08-15T20:05:00Z"
