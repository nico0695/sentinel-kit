      ST-4: __test__/claude-code-adapter.test.ts written -- reviewEngineContract(harness,
      "claude-code") + 7 AC-specific describe blocks (24 tests), per plan.md's Stage 4 Test
      Layout. AC-16/17's execa-mock test confirmed exact: vi.mock("execa"), asserts
