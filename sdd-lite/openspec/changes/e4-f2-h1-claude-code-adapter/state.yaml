version: "0.1"
change_name: e4-f2-h1-claude-code-adapter
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E4.F2.H1] (issue #28): the first real ReviewEngine adapter, wrapping the canonical
    claude-code CLI invocation the [E1.F1.H1] spike already captured with real evidence (exact
    command, stdin path, JSON shape, all five failure signatures). Depends only on closed/merged
    work (E1.F1.H1 spike, E1.F1.H3 fixtures, E0.F2.H2 port + contract suite + FakeEngine). Risk is
    concentrated in two structural gaps the frozen ReviewEngine port does not cover today: an
    isAvailable()-style pre-check (PRD Sec6.2 names it as settled, the port has only review()) and
    a contract-test binary-mocking seam (no existing injection pattern in this repo). Both
    escalated to spec rather than decided in proposal.
  confidence: high
  recorded_at: "2026-08-15T20:05:00Z"
lifecycle_status: implementing
current_stage: sddl-executor
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No material unknown blocks routing to proposal. The spike doc, fixtures, port, and contract
      suite are all merged and directly readable.
  sddl-proposal:
    status: completed
    started_at: "2026-08-15T19:55:00Z"
    completed_at: "2026-08-15T20:05:00Z"
    notes: >-
      proposal.md written by a Sonnet worker, status ready-for-spec (with two open questions).
      Grounded in direct inspection of review-engine.ts, run-review.ts, git-cli.ts (the only
      existing spawn-a-binary adapter precedent), the FakeEngine contract suite, both E4.F1
      state.yaml files' open_risks, docs/engines/claude-code.md, fixtures/README.md, and the raw
      bytes of four fixtures (auth-error.json, timeout-sigterm.json, context-overflow.json,
      valid-verdict.json) -- confirmed .is_error is the authoritative success flag (.subtype
      reads "success" even on auth-error and context-overflow) and timeout-sigterm.json
      genuinely has no .result field. Orchestrator independently re-read review-engine.ts and
      confirmed the port is exactly one method, review(request) -> Promise<ReviewResult>, with
      no isAvailable() surface -- the proposal's central finding is real, not a misreading.
      Two A-level judgment calls made and ratified: (1) adapter-owned SIGTERM->SIGKILL timeout
      enforcement is in scope now, closing r-engine-not-cancellable and
      r-cleanup-races-abandoned-engine, both of which H1's state.yaml named "E4.F2" as owner;
      (2) JSON envelope extraction (.result/.usage) is in scope here, restating a boundary H2's
      own proposal already fixed, not re-litigating it. Four items escalated as B-level open
      questions for spec to fix as firm ACs: the isAvailable() port gap, the binary-mocking seam,
      the is_error:true non-auth classification rule, and the totalTokens computation rule.
      "Successful real review" (issue #28 AC-2) proposed as satisfied by a manual verification
      run recorded in execution-log.md, not an automated CI test -- mirrors H1/H2 precedent
      (d-st1-evidence-obligation).
  sddl-spec:
    status: completed
    started_at: "2026-08-15T20:15:00Z"
    completed_at: "2026-08-15T20:15:00Z"
    notes: >-
      spec.md complete, 27 ACs, status complete -- all four open_risks scoped to this stage
      resolved as firm rules: (1) isAvailable() gap closed WITHOUT a port change (AC-5-7): an
      internal `claude --version` pre-check runs inside review() before the real invocation;
      auth failure is instead surfaced from the real invocation's own response shape
      (is_error:true, api_error_status:401), never as a raw crash; (2) binary-mocking seam is an
      injectable `runProcess: ClaudeCodeProcessRunner` factory option, default execa-backed
      (AC-20-21); (3) is_error:true uniformly REJECTS review() regardless of cause -- auth,
      context-overflow, or an adapter-initiated timeout kill that still flushed JSON (AC-13,
      AC-18); (4) totalTokens = inputTokens + outputTokens only, cache fields excluded (AC-11).
      Orchestrator independently verified: ReviewEngine.contract.ts's rejects.toBeInstanceOf(Error)
      assertion at line 57 (AC-23's basis); execa@9.6.1 natively supports timeout/killSignal/
      forceKillAfterDelay (AC-17's feasibility evidence); all six fixture files' is_error/subtype/
      result/usage fields byte-for-byte.

      ORCHESTRATOR CORRECTION before acceptance: the spec's Expected Behavior table and AC-11's
      validation hint originally cited noisy-output.json's usage as output_tokens:164,
      cache_read_input_tokens:16246, cache_creation_input_tokens:9386, totalTokens:166 (NOT
      22794) -- none of which match the fixture. Direct re-parse found the real values are
      output_tokens:529, cache_read_input_tokens:21886, cache_creation_input_tokens:3810, so the
      correct totalTokens is 531, not 166. This was a spec-authoring error (not inherited from
      proposal.md, which never cited these numbers) -- both spots corrected in place (see
      d-noisy-output-usage-correction) before this stage was marked complete. Two narrower items
      stay explicitly open for design, per proposal's own ratified decision: exact
      adapter-vs-outer-race timeout precedence (r-timeout-budget-precedence, AC-19) and CLI
      version-drift re-verification (r-claude-cli-version-drift, informational).
  sddl-design:
    status: completed
    started_at: "2026-08-15T20:25:00Z"
    completed_at: "2026-08-15T20:25:00Z"
    notes: >-
      design.md complete, all 27 ACs mapped. Four files under
      src/adapters/driven/engines/claude-code/: claude-code-adapter.ts (factory + review()
      orchestration), process-runner.ts (ClaudeCodeProcessRunner seam + execa-backed default,
      reject:false so the seam only ever resolves except on genuine spawn failure), errors.ts
      (3 typed classes), envelope.ts (pure JSON parsing, no execa dependency). AC-19 (the sole
      item spec deferred) resolved: adapter's own execa `timeout` = request.timeoutMs exactly
      (not shortened), forceKillAfterDelay explicitly lowered to 2000ms (execa default 5000ms).

      AC-19 justification, orchestrator-verified against engine-timeout.ts:76-111 directly:
      runEngineWithTimeout calls invoke() first, then schedules its own timeoutMs-delay timer
      whose callback synchronously resolve()s -- no I/O wait -- while the adapter's own kill
      sequence requires an OS-mediated round trip (signal delivery, process exit, stream drain)
      that inherently settles later. So the outer race reliably wins in real execution,
      producing the correct "timeout" terminal state, without shrinking the user's configured
      budget. A deliberately-shortened adapter budget was considered and rejected: spec's
      already-approved AC-13/14/18 fix the adapter's own timeout-kill rejection to
      ClaudeCodeReviewError/ClaudeCodeInvocationError, never EngineTimeoutError, so shortening
      would only make the adapter's OWN rejection win more often -- degrading the terminal state
      to "engine-error" more, not less. The EngineTimeoutError "escape hatch" named in H1's
      state.yaml was investigated and explicitly rejected: using it would contradict the already
      -approved AC-13/14/18 mapping. Orchestrator independently confirmed engine-timeout.ts's
      catch clause does rethrow EngineTimeoutError unwrapped (line 102-104), and confirmed
      execa's ExecaError carries the same CommonResult fields as SuccessResult (result.d.ts),
      supporting the reject:false seam design. Residual risk (adapter occasionally wins the
      race, yielding "engine-error" instead of "timeout") accepted as low-severity, documented,
      not eliminable without unfreezing core.

      r-timeout-budget-precedence now RESOLVED. Two low-severity items carried to plan: AC-16/17
      (SIGTERM->SIGKILL ordering) needs an explicit test-case strategy since the runProcess seam
      itself carries no timing; r-claude-cli-version-drift remains informational-only.
  sddl-plan:
    status: completed
    started_at: "2026-08-15T20:35:00Z"
    completed_at: "2026-08-15T20:35:00Z"
    notes: >-
      plan.md complete: 5 executor stages (ST-1 errors.ts+envelope.ts, ST-2 process-runner.ts,
      ST-3 claude-code-adapter.ts orchestration + barrel export, ST-4 the single AC-covering test
      file, ST-5 manual AC-24 verification + closing gate). Split design.md's rough 4-bullet
      order one level finer, separating ST-4 (automated, gates on a green vitest run) from ST-5
      (manual, gates on a human running a real authenticated claude CLI review) since the two
      have exit conditions different in kind.

      Closed the AC-16/17 test-strategy gap design.md flagged concretely, not left to the
      executor to interpret: (1) a vi.mock("execa") option-wiring test importing process-runner
      .ts's factory directly, asserting execa is called with { timeout, killSignal:"SIGTERM",
      forceKillAfterDelay:2000, reject:false } -- the actual, only-automatable proof of AC-16/17;
      (2) two adapter-level stub tests proving classification (SIGTERM-flushed-JSON ->
      ClaudeCodeReviewError, SIGKILL-empty-stdout -> ClaudeCodeInvocationError), not escalation.
      Plainly documents that real OS-level signal ordering stays unprovable in CI -- accepted
      residual gap, same class as AC-19's.

      Orchestrator independently re-ran the measured baseline before accepting: npm test =
      226/226 passing, 16 test files -- confirmed exactly matching plan.md's Budget Notes claim.
      One executor-level naming decision flagged explicitly by the plan itself (not hidden): ST-2
      needs a small factory (e.g. createDefaultRunProcess(binaryPath)) since design.md described
      binaryPath as "closed over" without fixing a literal export signature -- recorded as an
      A-level executor decision, to be logged in execution-log.md when made, not re-escalated
      here.
  sddl-executor:
    status: in_progress
    started_at: "2026-08-15T20:40:00Z"
    last_updated_at: "2026-08-15T22:32:00Z"
    notes: >-
      ST-1 complete: src/adapters/driven/engines/claude-code/errors.ts (3 typed classes) and
      envelope.ts (pure JSON-envelope parsing) created exactly per design.md's shapes.
      Orchestrator independently re-read both files, confirmed the import path
      (../../../../core/run/index.js) matches fake-engine.ts's own import line exactly, and
      re-ran validation directly rather than trusting the executor's report: npm run check
      clean (82 files, 0 dependency violations, 58 modules/106 dependencies), npm test 226/226
      unchanged (no regression -- leaf files, nothing imports them yet), git status confirms
      only src/adapters/driven/engines/claude-code/ is new. Two minor A-level judgment calls
      the executor made and disclosed: literal error-message wording (design.md specifies
      behavior, not exact strings) and treating an empty `.result` string as "absent" in
      buildReviewErrorMessage's fallback branch -- both reversible, neither affects any ST-1
      fixture, no escalation needed.

      ST-2 complete: src/adapters/driven/engines/claude-code/process-runner.ts created --
      ClaudeCodeProcessRunOptions/ClaudeCodeProcessResult/ClaudeCodeProcessRunner types plus
      createDefaultRunProcess(binaryPath), matching design.md's exact execa call shape
      (reject:false, conditional timeout/killSignal:"SIGTERM"/forceKillAfterDelay:2000 spread).
      Factory name follows git-cli.ts's createGitCliAdapter create<Thing> convention, per
