      both FakeEngine (trivial passthrough) and any derivation-based real engine. Applied to
      ReviewEngine.contract.ts; re-ran full suite: 250/250 (226 baseline + 24 new), npm run
      check clean. Orchestrator also caught and fixed one stale in-file comment (the test file
      referenced "the one contract scenario this still cannot satisfy" -- no longer true after
