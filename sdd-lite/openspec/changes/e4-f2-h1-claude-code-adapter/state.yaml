      timeoutMs>0, asserts those three keys absent when timeoutMs=0. noisy-output.json's
      totalTokens re-derived programmatically from fixture bytes inside the test (not
      hardcoded) -- confirmed 531, matching spec's corrected AC-11 figure.

      GENUINE BLOCKING FINDING, escalated as C-level (reality contradicts an approved
      assumption) rather than silently worked around: ReviewEngine.contract.ts's frozen
      "propagates the configured usage" test called harness.resolving("OUT", {totalTokens:42})
      and asserted result.usage deep-equals {totalTokens:42} exactly -- a shape no
      derivation-based real engine can ever produce, since extractSuccess's already-approved
