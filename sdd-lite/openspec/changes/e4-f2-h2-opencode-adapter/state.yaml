      docs/backlog-mvp-sentinel.md that H2's third acceptance criterion is explicitly "zero
      changes needed in the core to add it" -- the port stays frozen. Three open questions
      recorded for spec, all narrower than H1's (NDJSON parse-tolerance strategy, one-vs-two
      error classes for unparseable-stdout vs in-stream error event, OPENCODE_CONFIG injection
      mechanism). No contradictions found (unlike H1, which found a real PRD-vs-port gap).
