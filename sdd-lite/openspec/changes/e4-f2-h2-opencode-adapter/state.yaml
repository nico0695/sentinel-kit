version: "0.1"
change_name: e4-f2-h2-opencode-adapter
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E4.F2.H2] (issue #29): the second real ReviewEngine adapter, wrapping the canonical
    OpenCode CLI invocation the [E1.F1.H2] spike already captured with real evidence (invocation,
    NDJSON event shape, mandatory OPENCODE_CONFIG deny injection, failure signatures). Depends
    only on closed/merged work (E1.F1.H2 spike, E1.F1.H3 fixtures, E0.F2.H2 port, and the just-
    merged E4.F2.H1 claude-code adapter, whose file layout, injectable-runner seam, and pre-flight
    pattern this story reuses directly). Risk is lower than H1's: the structural unknowns H1 had
    to escalate to spec (isAvailable() mechanism, binary-mocking seam, timeout ownership) are all
    pre-resolved by the merged reference implementation. The genuinely new design surface is
    NDJSON line-by-line parsing (tolerating a truncated final line) and the default-write
    permission posture (OPENCODE_CONFIG must be injected on every invocation, no exceptions).
  confidence: high
  recorded_at: "2026-08-16T00:00:00Z"
lifecycle_status: planned
current_stage: sddl-plan
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No material unknown blocks routing to proposal. The spike doc, fixtures, port, and the
      merged claude-code adapter reference implementation are all directly readable.
  sddl-proposal:
    status: completed
    started_at: "2026-08-16T00:00:00Z"
    completed_at: "2026-08-16T00:00:00Z"
    notes: >-
      proposal.md written grounded in direct inspection of docs/engines/opencode.md,
      fixtures/opencode/* (6 files, including the OpenCode-specific unknown-model-stdout.txt log
      dump), fixtures/README.md's per-engine case matrix, and the merged claude-code-adapter.ts /
      process-runner.ts / index.ts (the direct file-layout and seam-shape template). Confirmed via
      docs/backlog-mvp-sentinel.md that H2's third acceptance criterion is explicitly "zero
      changes needed in the core to add it" -- the port stays frozen. Three open questions
      recorded for spec, all narrower than H1's (NDJSON parse-tolerance strategy, one-vs-two
      error classes for unparseable-stdout vs in-stream error event, OPENCODE_CONFIG injection
      mechanism). No contradictions found (unlike H1, which found a real PRD-vs-port gap).
  sddl-spec:
    status: completed
    started_at: "2026-08-16T00:15:00Z"
    completed_at: "2026-08-16T00:15:00Z"
    notes: >-
      spec.md written, status complete. All three proposal open questions resolved as firm ACs:
      NDJSON parse-tolerance (AC-10: split-and-drop-unparseable-lines), one-vs-two error classes
      (AC-15/AC-16/AC-17: OpenCodeInvocationError for zero-parseable-lines vs OpenCodeReviewError
      for an in-stream error event or no-output-produced), OPENCODE_CONFIG mechanism (AC-7/AC-8/
      AC-9: fs.mkdtemp-based temp file per review() call, env-injected on every invocation, removed
      in a finally block). Verified against raw parsed structure of all 6 fixtures/opencode/*
      files directly (python3 json.loads, not paraphrased): confirmed no-verdict.ndjson has TWO
      step_finish events with materially different token counts (falsifies a naive
      first-step_finish implementation, AC-12); confirmed tokens.total always includes reasoning
      and must not be reused for totalTokens (AC-13); confirmed context-overflow.ndjson has two
      step_start/error pairs, not one (AC-16 robust to this); confirmed unknown-model-stdout.txt
      is invalid JSON from line 1 (unquoted keys, trailing commas). One divergence from H1 flagged
      explicitly: model is a REQUIRED option here (AC-2), not optional-with-default, per the
      spike's own "no safe engine-wide default" finding. One item deferred to design (adapter-vs-
      outer-race timeout precedence), identical deferral to H1's AC-19, not spec-blocking. No
      contradictions found.
  sddl-design:
    status: completed
    started_at: "2026-08-16T00:30:00Z"
    completed_at: "2026-08-16T00:30:00Z"
    notes: >-
      design.md written, status complete. Five-file layout: opencode-adapter.ts, process-runner.ts
      (OpenCodeProcessRunner extended with a REQUIRED env field, unlike ClaudeCodeProcessRunOptions
      -- closes the "forgot to inject OPENCODE_CONFIG" hazard at compile time), permission-config.ts
      (new module, no H1 analogue -- fs.mkdtemp-based temp file lifecycle for AC-7/8/9), envelope.ts
      (parseNdjsonLines + extractOutcome, two pure functions), errors.ts (3 classes, no cause field
      since AC-10 drops unparseable lines silently with no single exception to preserve). AC-19
      (deferred timeout-precedence item from spec.md) resolved by directly reusing H1's mechanism
      (execa timeout=request.timeoutMs unchanged + forceKillAfterDelay:2000) and its
      engine-timeout.ts:76-111-grounded reasoning, confirmed engine-agnostic rather than
      re-derived. All 24 ACs mapped to concrete code locations. Two open items carried forward
      (both inherited/low-severity, not design-blocking): the AC-19 residual (same as H1's
      accepted residual) and CLI version drift (informational, unchanged from spec).
  sddl-plan:
    status: completed
    started_at: "2026-08-16T00:45:00Z"
    completed_at: "2026-08-16T00:45:00Z"
    notes: >-
      plan.md written, status complete, execution_ready: true. Five executor stages mirroring
      H1's plan.md granularity exactly: ST-1 errors.ts+envelope.ts+permission-config.ts (pure,
      grouped since permission-config.ts has the same "no execa dependency, land first" profile
      as H1's ST-1 files), ST-2 process-runner.ts (execa seam with required env field), ST-3
      opencode-adapter.ts orchestration + barrel export, ST-4 single test file (24 ACs), ST-5
      manual AC-24 verification + full gate. Two test-strategy gaps closed: SIGTERM/SIGKILL
      escalation (reused H1's mocked-execa option-wiring solution unchanged, not re-derived) and
      OPENCODE_CONFIG lifecycle (genuinely new, three concrete tests specified: content
      correctness, injection-on-every-call, concurrency+cleanup-on-reject). Measured baseline
      recorded: npm test 250/250 passing 17 files, npm run check green, on the tree post-H1-merge.
  sddl-executor:
    status: pending
  sddl-qa-review:
    status: pending
decisions:
  - id: dec-001
    checkpoint_id: cp-proposal-approval
    free_text: >-
      Reuse H1's resolved isAvailable() mechanism (internal pre-flight inside review(), no port
      change) without re-litigating it for this story.
    author: claude
    rationale: >-
      A-level (reversible, PRD-aligned, already precedented by merged code). The merged claude-
      code adapter already established this pattern and it works; issue #29's own "zero changes
      needed in the core" acceptance criterion argues for reusing the existing structural answer
      rather than inventing a new one. Re-opening it here would be scope creep against a story
      whose explicit goal is proving the port needs no further change.
    recorded_at: "2026-08-16T00:00:00Z"
  - id: dec-002
    checkpoint_id: cp-proposal-approval
    free_text: >-
      Reuse H1's totalTokens computation rule (input + output tokens, cache fields excluded) for
      OpenCode's step_finish.part.tokens shape, for consistency across both adapters at the
      ReviewUsage boundary.
    author: claude
    rationale: >-
      A-level. OpenCode's token fields (input/output/reasoning/cache.read/cache.write) are named
      explicitly in the spike doc and map cleanly onto the same rule H1 already applied to
      claude-code's .usage fields. Treating this as confirmed baggage for spec to validate, not a
      fresh open question to re-derive.
    recorded_at: "2026-08-16T00:00:00Z"
open_risks:
  - id: risk-001
    severity: medium
    status: open
    summary: >-
      Default-write permission posture: OpenCode's `opencode run` writes files unless
      OPENCODE_CONFIG injects a permission-deny config. Correctness of the adapter depends on
      this env var being set on every single invocation with no code path that skips it. No
      analogue in the merged claude-code adapter (whose -p flag is read-only by construction).
      Needs an explicit acceptance criterion and a contract-suite assertion, not just a doc note.
      Owner: sddl-spec / sddl-design for this story.
  - id: risk-002
    severity: low
    status: open
    summary: >-
      NDJSON parsing is genuinely new relative to H1 (which parsed one JSON document). Line-by-
      line parsing with a tolerated truncated final line and a distinct "not parseable at all"
      failure class (fixtures/opencode/unknown-model-stdout.txt) are spec-able against fixture
      evidence but are real new design work, not a copy of H1's envelope.ts. Owner: sddl-design.
  - id: risk-003
    severity: low
    status: open
    summary: >-
      Flag/behavior drift: docs/engines/opencode.md is 8 days old (2026-08-08 -> 2026-08-16) as
      of this proposal. Same low-material-but-not-zero risk PRD risk #1 names for claude-code,
      one day older. Not re-verified for this story.
next_action:
  kind: await_user
  target: checkpoint
  summary: >-
    plan.md complete, execution_ready: true. Five code-touching stages, each requiring its own
    stage_approval per CLAUDE.md (interactive/auto mode does not bypass this). Recommend approve
    and begin sddl-executor with ST-1 (errors.ts + envelope.ts + permission-config.ts, pure/
    execa-free files, lowest-risk stage to start with).
