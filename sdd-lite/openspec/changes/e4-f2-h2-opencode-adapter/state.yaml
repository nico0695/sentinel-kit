decisions:
  - id: dec-001
    checkpoint_id: cp-proposal-approval
    free_text: >-
      Reuse H1's resolved isAvailable() mechanism (internal pre-flight inside review(), no port
      change) without re-litigating it for this story.
    author: claude
    rationale: >-
      A-level (reversible, PRD-aligned, already precedented by merged code). The merged claude-
      code adapter already established this pattern and it works; issue #29's own "zero changes
      needed in the core" acceptance criterion argues for reusing the existing structural answer
      rather than inventing a new one. Re-opening it here would be scope creep against a story
      whose explicit goal is proving the port needs no further change.
    recorded_at: "2026-08-16T00:00:00Z"
  - id: dec-002
    checkpoint_id: cp-proposal-approval
    free_text: >-
      Reuse H1's totalTokens computation rule (input + output tokens, cache fields excluded) for
      OpenCode's step_finish.part.tokens shape, for consistency across both adapters at the
      ReviewUsage boundary.
    author: claude
    rationale: >-
      A-level. OpenCode's token fields (input/output/reasoning/cache.read/cache.write) are named
      explicitly in the spike doc and map cleanly onto the same rule H1 already applied to
      claude-code's .usage fields. Treating this as confirmed baggage for spec to validate, not a
      fresh open question to re-derive.
    recorded_at: "2026-08-16T00:00:00Z"
  - id: dec-003
    checkpoint_id: cp-review-gate-r1-001
    free_text: >-
      Amend spec.md (add AC-25, reword AC-18) and fix R1-001 inside this story, rather than
      shipping it as a known defect or escalating to a cross-cutting redesign covering the
      claude-code sibling.
    author: user
    rationale: >-
      B-level (affects the approved acceptance contract). Presented at the review_gate with three
      options and a recommendation; user chose option 1 ("enmendar"). Keeps the story honest and
      self-contained -- the adapter is already exported from the barrel, so any wiring under #30
      would make the defect live, and the fix surface is one helper plus tests. Recorded as a
      spec AMENDMENT rather than a silent code change because the original AC-18 explicitly
      declared AC-15/16/17 "the ONLY three rejection paths"; adding a fourth without amending it
      would have left the code contradicting its own approved contract.
    recorded_at: "2026-08-16T02:20:00Z"
  - id: dec-004
    checkpoint_id: cp-final-review
    free_text: >-
      Close the story at final QA verdict pass_with_warnings without running AC-24's manual
      verification (real, authenticated opencode CLI over a genuine diff).
    author: user
    rationale: >-
      C-level would normally apply (closing with a known open AC touches the story's completion
      criteria), but this is not scope expansion or a PRD contradiction -- it is accepting an
      already-disclosed, inherently-manual gap in the exact same category [E4.F2.H1] shipped with
      (that story's own AC-24 remains open too, tracked at docs/todo/E4/manual-verification.md
      item 1). No environment available to this session has an authenticated opencode CLI, so the
      only alternative to accepting the gap now was leaving the story permanently blocked pending
      the user's own local verification. Per sddl-qa-review's own rule, final + pass_with_warnings
      never sets lifecycle_status completed regardless of this acceptance -- it stays reviewing,
      and AC-24 remains tracked at docs/todo/E4/manual-verification.md item 2 until closed.
    recorded_at: "2026-08-16T03:15:00Z"
open_risks:
  - id: risk-001
    severity: medium
    status: open
    summary: >-
      Default-write permission posture: OpenCode's `opencode run` writes files unless
      OPENCODE_CONFIG injects a permission-deny config. Correctness of the adapter depends on
      this env var being set on every single invocation with no code path that skips it. No
      analogue in the merged claude-code adapter (whose -p flag is read-only by construction).
      Needs an explicit acceptance criterion and a contract-suite assertion, not just a doc note.
      Owner: sddl-spec / sddl-design for this story.
  - id: risk-002
    severity: low
    status: open
    summary: >-
      NDJSON parsing is genuinely new relative to H1 (which parsed one JSON document). Line-by-
      line parsing with a tolerated truncated final line and a distinct "not parseable at all"
      failure class (fixtures/opencode/unknown-model-stdout.txt) are spec-able against fixture
      evidence but are real new design work, not a copy of H1's envelope.ts. Owner: sddl-design.
  - id: risk-004
    severity: high
    status: resolved
    summary: >-
      RESOLVED (ST-6, verified round 2). R1-001 (4R review, CRITICAL, introduced, was BLOCKING):
      opencode-adapter.ts previously never read the real invocation's exitCode/signal/timedOut, so
      a killed or non-zero-exit run that already emitted text resolved as a complete, successful
      ReviewResult carrying a verdict. Fixed by spec Amendment 1 (new AC-25) + a private
      assertCleanExit() gate called after extractOutcome so AC-15/16/17's stdout diagnostics are
      never masked. Independently re-verified in the round-2 scoped re-review: mechanism read
      directly, original reproduction now rejects, 4 mutations (including one added during
      re-review specifically to test the ordering claim) all fail the suite, no regression on the
      success path. See review-ledger.md's Scoped Re-Review section.
  - id: risk-005
    severity: low
    status: open
    summary: >-
      R1-002 residual (REFUTED as a CRITICAL, recorded as a low documentation/verification gap):
      nothing establishes the precedence between the injected OPENCODE_CONFIG and any
      worktree-local opencode config, and the spike verified the deny posture only against a
      benign worktree. Cannot be settled here (opencode is not installed in this environment).
      Belongs as a step on item 2 of docs/todo/E4/manual-verification.md. The equivalent gap is
      LARGER and untreated for the merged claude-code adapter, which passes no env at all and
      omits --setting-sources -- a worthwhile follow-up against item 1.
  - id: risk-006
    severity: medium
    status: open
    summary: >-
      AC-24 ("successful real review" against a real, authenticated opencode CLI) is the one
      permanently-open acceptance criterion. Same category as [E4.F2.H1]'s own still-open AC-24.
      User explicitly accepted closing the story without it (dec-004) rather than leave the story
      blocked pending an environment with an authenticated opencode CLI. Tracked at
      docs/todo/E4/manual-verification.md item 2. Not a code defect -- every automatable AC is
      satisfied; this is purely the disclosed evidence gap CI structurally cannot close.
  - id: risk-003
    severity: low
    status: open
    summary: >-
      Flag/behavior drift: docs/engines/opencode.md is 8 days old (2026-08-08 -> 2026-08-16) as
      of this proposal. Same low-material-but-not-zero risk PRD risk #1 names for claude-code,
      one day older. Not re-verified for this story.
review_summary:
  mode: 4r
  tier: full-4r
  target: e9ee543e3616ae5d20ece66916c2a2c08a9d42be
  verdict: pass_with_warnings
  counts:
    confirmed: 1
    verified: 5
    info: 11
    info_remaining: 7
    refuted: 1
  open_severe_findings: 0
  round: 2
  summary: >-
    Full 4R sweep (1062 changed lines + permissions surface -> full-4r tier). One CRITICAL,
    introduced, blocking finding R1-001: the real invocation's exitCode/signal/timedOut are never
    read, so a run killed or exiting non-zero after emitting any text resolves as a COMPLETE,
    successful review carrying a verdict. Reported independently by the risk and resilience
    lenses and reproduced directly by the orchestrator (SIGTERM+partial -> resolved with a
    verdict; exitCode:1+partial -> same), which reclassified it from inferential to
    deterministic. The reliability lens recorded a partial mitigation (runEngineWithTimeout wins
    the race) that covers only the adapter's-own-timeout sub-case, not external kills or a
    non-zero exit. One refuter pass ran over the single remaining severe inferential finding
    (R1-002, worktree config precedence) and REFUTED it on attribution (the merged claude-code
    sibling passes no env at all, so the exposure is strictly worse there and pre-existing) and
    on threat model (PRD Sec60 already executes reviewed-branch scripts by design). 11 info-level
    findings recorded, none blocking; two are mutation-proven test gaps (text ordering and
    timeout-budget assignment each survive the full 275-test suite).

    ROUND 2 (scoped re-review of the ST-6 fix delta, e9ee543..047116b, per protocol: frozen
    ledger + immutable delta only, original diff not re-reviewed): all 5 round-1 fixed rows
    (R1-001 severe + R2-001/R3-002/R3-003/R4-002 info) independently verified -> `verified`.
    Mechanism read directly in each source file; all 4 new/changed tests confirmed non-vacuous by
    reverting each fix and observing the test fail; independently re-ran all 3 original mutations
    plus one new one (reordering assertCleanExit before extractOutcome, directly testing the
    "AC-16 diagnostics win" ordering claim) -- all 4 fail. Regression check: every pre-existing
    resolving-path test defaults exitCode:0/timedOut:false (confirmed by grep), so AC-25 never
    fires on them; createDenyConfigFile's external contract unchanged. No new defect in the fix.
    Verdict fail -> pass_with_warnings. 7 info findings remain (R3-001, R4-003, R2-002, R2-003,
    R2-004, R2-005, R4-004), none blocking, explicitly out of round-2 scope -- optional follow-up
    polish, not silently dropped.
  reported_at: "2026-08-16T03:00:00Z"
