      merged claude-code adapter reference implementation are all directly readable.
  sddl-proposal:
    status: completed
    started_at: "2026-08-16T00:00:00Z"
    completed_at: "2026-08-16T00:00:00Z"
    notes: >-
      proposal.md written grounded in direct inspection of docs/engines/opencode.md,
      fixtures/opencode/* (6 files, including the OpenCode-specific unknown-model-stdout.txt log
      dump), fixtures/README.md's per-engine case matrix, and the merged claude-code-adapter.ts /
