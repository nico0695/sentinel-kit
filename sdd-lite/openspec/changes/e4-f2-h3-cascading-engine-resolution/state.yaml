decisions:
  - id: dec-001
    checkpoint_id: cp-proposal-approval
    free_text: >-
      Approve proposal.md as written and advance directly into spec without
      a separate proposal-stage checkpoint round-trip.
    author: user
    rationale: >-
      User's own initiative ("quiero continuar con el sdd" after confirming
      PR #67 merged) -- implicit advancement per this skill's own phase
      validation rule (user already indicated advancement).
    recorded_at: "2026-08-22T01:00:00Z"
  - id: dec-002
    checkpoint_id: cp-final-review
    free_text: >-
      Amend spec.md (reword AC-1, add AC-10) to match the implemented
      empty-string behavior, rather than change resolveEngine's logic or
      accept the discrepancy as disclosed.
    author: user
    rationale: >-
      B-level (affects the approved acceptance contract). Presented at
      cp-final-review with three options and a recommendation, twice: first
      from final QA (QA-1, medium) and again after the 4R review
      independently confirmed the same defect (R3-001, WARNING). User chose
      option 1 ("1. enmendar el spec"). The implemented behavior is the
      better of the two readings -- an explicitly-passed `--engine ""` is
      malformed input, and erroring beats silently substituting a different
      engine than the operator asked for, which is exactly the surprise the
      cascade exists to prevent. So the wording was wrong, not the code, and
      amending it is a smaller, lower-risk delta than rewriting a function
      two independent review passes found otherwise correct. Recorded as a
      spec AMENDMENT rather than a silent prose edit because AC-1 and the
      Scope Boundary both explicitly said "non-empty"; changing behavior
      expectations without amending them would have left the same
      contradiction the amendment exists to close. AC-10 additionally closes
      R3-001's second half (no test pinned either reading).
    recorded_at: "2026-08-22T02:40:00Z"
open_risks:
  - id: risk-002
    severity: medium
    status: resolved
    summary: >-
      QA-1 (final QA, medium, OPEN — needs a B-level decision): spec.md's
      AC-1 requires the run override to win "whenever it is provided and
      non-empty" and its In Scope clause defines the validated value as
      "the first non-empty one in precedence order", but resolveEngine
      branches on `!== undefined`. An empty-string override therefore wins
      precedence and is then rejected with UnknownEngineError instead of
      falling through to the next cascade level. Reproduced directly at
      both the run and repo levels. No test pins either behavior, so the
      293-test suite is blind to it. Not reachable from any production
      caller today (the --engine flag lands in E6.F1; RepoEntrySchema
      rejects "" before it could reach resolveEngine from repos.yaml), and
      the implemented behavior is arguably the safer one -- but it is a
      literal contradiction between working code and its own approved
      acceptance criterion. Three routes offered in qa-report.md's Next
      Action; recommendation is option 1 (amend the spec wording to match
      the implemented behavior, plus one pinning test).

      REVALIDATED by the standard-tier 4R review (2026-08-22): the
      reliability lens, working from a fresh context with no sight of the QA
      report, independently reported the identical defect as R3-001 and
      rated it WARNING -- which maps to `medium`, the same severity QA
      assigned. Two independent passes therefore converge both on the
      defect being real and on it sitting BELOW the blocking floor: it is
      recorded as `info`, is non-blocking, and does not enter the fix loop.
      The review additionally sharpened option 3's cost: both passes noted
      independently that no test pins EITHER reading, so accepting as-is
      leaves the approved AC both contradicted and unpinned.

      RESOLVED (ST-4, Amendment 1, dec-002): user chose to amend the spec.
      AC-1 reworded to "present (not undefined)", the Scope Boundary's
      "first non-empty one" became "first present one", AC-10 added pinning
      the empty-string rejection, and one Expected Behavior row added. Two
      new tests cover AC-10 at both overridable levels, mutation-verified
      non-vacuous: mutating resolve-engine.ts to cascade past "" made
      EXACTLY those two tests fail (7 others still passing, so they fail for
      the right reason), and reverting restored 9/9. Zero production files
      changed -- the code was already what the amended spec describes.
      npm run check green, npm test 295/295 (293 + 2, exact).
  - id: risk-003
    severity: low
    status: resolved
    summary: >-
      QA-2/QA-3 (final QA, low, non-blocking): the engineName echo is
      exercised by tests only on the ok path (independently verified
      correct on validation-failed too, so a coverage gap rather than a
      defect), and no sddl-code-review pass ran for this change, making the
      final QA report the sole review over the diff. Both proportionate to
      the change's size (203 insertions, 8 files, pure functions and
      data-shape additions); recorded so neither is a silent omission.

      RESOLVED (QA seq 2): QA-2 closed as not-a-defect -- the echo was
      independently verified correct on validation-failed in seq 1, and the
      single unconditional spread makes it uniform across all five terminal
      states by construction. QA-3 closed by fact -- a standard-tier 4R
      review has since run (review-ledger.md), which is what produced
      R3-001/R3-002.
