      owns it). RunReviewRequest/RunReviewResult's engineName echo field
      typed as plain string (not EngineName) to avoid a needless
      run-to-repos coupling for a field runReview only copies, never
      inspects. All 9 spec ACs mapped to concrete file locations. No new
      open technical question -- both pieces are direct applications of
      patterns already present in the codebase.
