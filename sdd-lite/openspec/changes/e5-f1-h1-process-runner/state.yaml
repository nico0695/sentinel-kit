complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E5.F1.H1] (issue #31), third story of the E5 milestone: introduce ProcessRunner, the
    second driven port of src/core/run and the last unimplemented port of the PRD 4.3 MVP
    catalog, plus its execa-backed adapter in the currently-empty src/adapters/driven/exec/.
    Mechanically low-risk: two structurally identical private precedents already exist in-repo
    (ClaudeCodeProcessRunner and OpenCodeProcessRunner), execa is already a runtime dependency,
    and the contract-suite convention is established by four prior suites. Risk is concentrated
    in two non-mechanical places: proving the timeout genuinely reaps a child that ignores
    SIGTERM (not merely that the promise settles), and deciding where the "only declared scripts
    executable" guarantee of the dependent story [E5.F1.H2] is enforced -- in this port, or in a
    caller that does not exist yet.
  confidence: high
  recorded_at: "2026-08-22T23:10:00Z"
