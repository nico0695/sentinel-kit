      User selected #31. It is also the dependency-correct order: the backlog marks [E5.F1.H2]
      as depending on [E5.F1.H1], so running #32 first would require inventing the port anyway.
    recorded_at: "2026-08-22T23:00:00Z"
  - id: dec-spec-b-level
    checkpoint_id: cp-spec-approval
    free_text: "ratifico las tres"
    rationale: >-
      User ratified all three B-level decisions verbatim. D1 rests on a fact discovered during
      spec work: repos' config already declares validations as string[], so provenance is not
      something this port could verify even in principle. D2 follows both engine seams, which
      already overlay rather than replace the environment. D3 was forced by empirical evidence
      that reject:false makes execa resolve every failure, so the resolve-vs-throw judgment
      cannot be delegated to the library.
    recorded_at: "2026-08-22T23:45:00Z"
open_risks:
  - id: risk-001
    summary: >-
      A port exposing run(command, args) is the largest execution surface added to this codebase
      so far. The "only declared scripts executable" guarantee belongs to [E5.F1.H2], which does
      not exist yet -- so unless this port constrains its input structurally, the story ships an
      unconstrained execution primitive with no enforcing caller. Spec must resolve where the
      guarantee lives.
    severity: high
  - id: risk-002
    summary: >-
      Acceptance criterion 1 ("timeout kills the process") is provable only by a test whose child
      deliberately ignores SIGTERM, so that forceKillAfterDelay's SIGKILL is what actually reaps
      it, plus a post-hoc liveness assertion. A test asserting only timedOut === true would pass
      against an adapter that leaks orphaned processes.
    severity: medium
  - id: risk-003
    summary: >-
      Captured stdout/stderr feeds a prompt in [E5.F1.H2]. Without a truncation policy, a single
      verbose npm test run can produce megabytes of prompt input, and execa's maxBuffer becomes
      an unhandled failure mode. Whether truncation lives in this port (with a truncated flag,
      mirroring [E2.F3.H2]'s diff size policy) or in the caller is undecided.
    severity: medium
  - id: risk-004
    summary: >-
      The two existing engine process-runner.ts seams are near-duplicates of this port's job.
      Retrofitting them (and git-cli.ts, which has no timeout at all) onto ProcessRunner is
      explicitly out of scope here, but leaving three parallel execution paths in the codebase is
      a real duplication debt worth a follow-up backlog item.
    severity: low
  - id: risk-005
    summary: >-
      Both merged engine process-runner.ts seams carry a doc comment asserting "Only a genuine
      spawn failure (ENOENT, permission denied) REJECTS". Verified false for execa 9 under
      reject:false -- nothing rejects. The comment is wrong in already-merged code, which means
      the claude-code and opencode adapters' preflight "rejection -> EngineUnavailableError"
      paths may be unreachable, and a missing engine binary may surface as a confusing parse
      error instead. Out of scope for this story (AC-15 pins both adapters untouched), but it is
      a real latent defect in E4 code and should become its own backlog item rather than being
      silently absorbed into risk-004's retrofit.
    severity: medium
  - id: risk-006
    summary: >-
      timedOut is derived as "terminated by a signal AND elapsed >= timeoutMs" because execa's
      own result.timedOut is false when output truncation preceded the kill (spec revision 2,
      R5). Boundary condition: a child signalled by something other than the timeout at almost
      exactly the budget instant is reported timedOut:true. The window is a scheduling tick and
      the misreport is benign (the run did consume its whole budget), whereas trusting
      result.timedOut is wrong in a case that actually occurs. Accepted deliberately, recorded
      rather than hidden.
    severity: low
