  sddl-spec:
    status: completed
    started_at: "2026-08-22T23:10:00Z"
    completed_at: "2026-08-22T23:40:00Z"
    notes: >-
      spec.md written, then re-derived as revision 2. Revision 1 specified the execa option bag
      from the two in-repo engine seams and execa's README; revision 2 re-verified every claim by
      running live probes against the installed execa 9.6.1 and reading its lib/. Four
      assumptions were wrong and one was inherited from a false comment in already-merged code:
      (R1) reject:false means nothing rejects at all, so a nonexistent binary would have silently
      resolved as an empty result -- and both engine seams' doc comments assert the opposite;
      (R2) maxBuffer counts characters, not bytes; (R3) isMaxBuffer is global, not per-stream;
      (R4) stripFinalNewline defaults true and silently eats the trailing newline of every
      capture; (R5) a child that both overflows the budget and hangs reports timedOut:false, the
      most likely real hung-validation shape, which no revision-1 AC covered; (R6) AC-1/AC-9's
      test hints referenced a pid the port does not expose. 15 ACs became 17 (new AC-16, AC-17)
      and a third B-level decision (D3) was added. Downstream constraints for [E5.F1.H2] recorded
      explicitly rather than left to rediscovery.
  sddl-design:
    status: completed
    started_at: "2026-08-22T23:45:00Z"
    completed_at: "2026-08-22T23:55:00Z"
    notes: >-
      design.md written after the user ratified D1/D2/D3. Central choice: concentrate every
      revision-2 empirical finding into ONE pure exported function (classifyExecaResult) that
      turns execa's single resolved value into either a ProcessRunResult or a ProcessSpawnError,
      leaving the impure adapter trivial. This makes the awkward cases (overflow-then-hang,
      EACCES, signal-without-exit-code) unit-testable with zero child processes, while the
      real-child suite is reserved for what only a real process can prove -- above all AC-1's
      reaping of a SIGTERM-trapping child. Request validation is split: plain guard clauses in
      core (matching runReview's existing style; run has never imported zod), with cwd
      absoluteness delegated to the adapter's node:path isAbsolute, following the precedent
      run-review.ts:59-62 already documents for the identical reason.
  sddl-plan:
    status: completed
    started_at: "2026-08-23T00:00:00Z"
    completed_at: "2026-08-23T00:10:00Z"
    notes: >-
      plan.md written, 4 stages following design.md's own recommended sequencing: ST-1 core
      types + guard-clause pre-flight + two new errors (pure, no execa/fs); ST-2 the pure
      classify-execa-result.ts function carrying all six of spec revision 2's empirical findings,
      unit-tested with hand-built result records and zero spawning; ST-3 the impure adapter shell
      wiring the pinned execa option bag to the classifier, plus the sixth ProcessRunner.contract.ts;
      ST-4 the real-child suite (AC-1's reaping is the load-bearing case) as the closing gate,
      re-verifying AC-15. No stage wires the port into runReview or any caller -- ships uncalled,
      matching both prior E5 stories' precedent.
  sddl-executor:
    status: completed
    started_at: "2026-08-23T00:15:00Z"
    completed_at: "2026-08-23T01:35:00Z"
    notes: >-
      All 4 stages completed and independently re-verified at every step (npm run check + npm
      test re-run fresh per stage, diff-scope confirmed via git status/diff, source read
      directly -- never merely trusted from the executor workers' self-reports). ST-4's closing
      gate independently re-confirmed against the correct merge-base (origin/main at 8c080cb,
      post-[E5.F2.H2]-merge): full story diff is exactly 11 files under src/ (680 insertions, 3
      deletions), zero touch to src/core/run/run-review.ts, src/adapters/driven/git/**, or
      src/adapters/driven/engines/** (AC-15), zero execa import under src/core/** (grep-confirmed
      beyond depcruise's 0 violations). 400 tests green, up from 375 at session start.
  sddl-code-review:
    status: pending
  sddl-qa-review:
    status: pending
