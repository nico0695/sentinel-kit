version: "0.1"
change_name: e5-f1-h2-declared-validations
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E5.F1.H2] (issue #32), the last required story of milestone E5: run repo-declared
    validation scripts inside the review worktree, in order, with a per-script timeout, and
    inject their output into the prompt without ever aborting the review. Every collaborator is
    already merged on main -- RepoEntry.validations (string[]), the ProcessRunner port and its
    execa adapter from [E5.F1.H1], assemblePrompt's validationOutput seam, runReview's reserved
    stage-5 placeholder, and RunStore's validations/NNN.log writer. The code footprint is small;
    the risk is concentrated in decision density (seven real forks, three B-level), in a
    tokenization policy that must survive the adapter's pinned shell:false, and in one
    cross-module compile-time ripple (adding a "validations" RunStage member breaks history's
    _AllRunStagesCovered exhaustiveness guard).
  confidence: medium
  recorded_at: "2026-08-23T04:05:00Z"
lifecycle_status: planning
current_stage: sddl-proposal
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No blocking unknown. A medium-breadth read-only exploration at proposal stage was
      sufficient and conclusive: src/core/run/ (run-review.ts, run-errors.ts,
      ports/process-runner.ts, process-run-request.ts, index.ts), repos/ports/config-schemas.ts
      and config-store.ts, review/assemble-prompt.ts, history/ports/run-store.ts and
      run-metadata-schemas.ts, the merged exec adapter, PRD sections 3.1-E and 4, the backlog's
      E5 block, and the predecessor's spec.md all read directly. Both downstream constraints the
      predecessor recorded were verified empirically against main rather than trusted.
  sddl-proposal:
    status: completed
    started_at: "2026-08-23T03:50:00Z"
    completed_at: "2026-08-23T04:05:00Z"
    notes: >-
      proposal.md written and grounded in direct code inspection. Key empirical findings:
      (1) RepoEntry.validations already exists as z.array(z.string()).optional() and is
      completely unread by production code -- the declaration is inert; (2) assemblePrompt
      already renders a <validation-output> block from a validationOutput string[], and
      runReview already forwards request.validationOutput verbatim past a literal stage-5
      comment placeholder, so the injection socket is pre-wired; (3) RunRecord.validationOutput
      is persisted one file per array element as validations/NNN.log, which makes the array's
      granularity a frozen on-disk format decision; (4) the exec adapter pins shell:false
      (process-runner-exec.ts:66), confirming the predecessor's tokenization constraint;
      (5) classifyFailure (run-review.ts:423-439) still omits InvalidProcessRequestError and
      ProcessSpawnError, so both fall through to engine-error -- the predecessor's recorded gap
      is confirmed present on main; (6) NEW, not recorded upstream: adding a "validations"
      member to RunStage breaks typecheck in history/ports/run-metadata-schemas.ts:54 via the
      _AllRunStagesCovered Expect<Exclude<...>> guard over a hand-maintained RUN_STAGES list;
      (7) neither RepoEntry nor GlobalConfig has any timeout field, so #32's "per-script
      timeout" has no home in the shipped config schema. Seven decision candidates recorded,
      three B-level.
  sddl-spec:
    status: pending
  sddl-design:
    status: pending
  sddl-plan:
    status: pending
  sddl-executor:
    status: pending
  sddl-qa-review:
    status: pending
