    status: completed
    started_at: "2026-08-23T04:25:00Z"
    completed_at: "2026-08-23T05:40:00Z"
    notes: >-
      spec.md written with 21 acceptance criteria, In Scope / Out of Scope / Non-Goals tables,
      an Expected Behavior table, a Downstream Constraints section and a pinned-untouched-files
      criterion (AC-20). The four ratified decisions are encoded as firm criteria and were not
      reopened: dec-001 -> AC-1/AC-18, dec-002 -> AC-4/AC-5, dec-003 -> AC-6/AC-7, dec-004 ->
      AC-9/AC-11/AC-12/AC-13. DC-5, DC-6 and DC-7 were settled at A level as D5 (RunStage gains
      "validations"; additive enum widening, no released metadata.json reader, option (b) would
      persist a wrong stage, so the trade-off is one-way and no escalation was warranted), D6
      (head 100 + tail 100 lines per stream with an exact elision marker, plus a 2000-char
      per-line backstop) and D7 (one validationOutput element per declared script, format pinned
      byte-exactly by AC-14). Empirical re-verification against the working tree contradicted
      three stated facts and they are recorded in spec.md's Empirical Corrections table: (E1)
      src/core/run/ports/process-run-request.ts does not exist -- the request/result types live
      inside ports/process-runner.ts and validateProcessRunRequest lives at
      src/core/run/process-run-request.ts, so the new use case is a sibling of run-review.ts and
      run gains no new port; (E2) ProcessRunResult carries NO duration field, so DC-7's
      recommended header ("command, exit code, duration, flags") was not producible -- duration
