  - id: dec-002
    checkpoint_id: cp-proposal-validation
    selected_option_id: DC-2-a
    rationale: >-
      DC-2: keep RepoEntry.validations as string[] and satisfy the per-script timeout criterion with
      one additive optional validationTimeoutMs field on the config. Rejected: widening validations to
      a (string | object)[] union, which is the better long-term shape but re-litigates a public config
      format one story after it shipped; and a hard-coded constant, which meets the criterion only
      technically and gives the user no control. Level B, decided by the user.
    recorded_at: "2026-08-23T04:20:00Z"
  - id: dec-003
    checkpoint_id: cp-proposal-validation
    selected_option_id: DC-3-d
    rationale: >-
      DC-3: tokenize a declared entry by whitespace split AND reject any entry containing shell
      metacharacters with validation-failed. Refusing what the pinned shell:false cannot honor beats a
      silent misparse ("npm test 2>&1" would otherwise pass "2>&1" to npm as a literal argument). A
      quote-aware tokenizer can be layered on later without breaking this contract. Level B, decided
      by the user.
    recorded_at: "2026-08-23T04:20:00Z"
  - id: dec-004
    checkpoint_id: cp-proposal-validation
    selected_option_id: DC-4-b
    rationale: >-
      DC-4: a malformed DECLARATION yields the validation-failed terminal state at pre-flight; a RUNTIME
      failure (non-zero exit, missing binary, timeout) is pure evidence and the review proceeds.
      Concretely: add InvalidProcessRequestError to classifyFailure's validation-failed branch and
      deliberately NOT ProcessSpawnError. Level B, decided by the user.
    recorded_at: "2026-08-23T04:20:00Z"
  - id: dec-005
    checkpoint_id: cp-spec-validation
    selected_option_id: DC-5-a
    rationale: >-
      D5: RunStage gains a "validations" member and RUN_STAGES in
      history/ports/run-metadata-schemas.ts gains the matching entry so the _AllRunStagesCovered
      guard still resolves to never. Settled at level A rather than escalated because the change
      only widens the persisted metadata.json enum additively, there is no released reader of
      that file (the CLI does not exist until E6), and [E5.F2.H2]'s AC-15 pinned the LOCATION of
      RUN_STAGES, not its contents. Option (b) has no upside beyond a smaller diff and would
      persist a wrong stage into metadata.json forever, so the fork is one-way. Honest caveat
      recorded in spec.md: the reachable population of stage "validations" is narrow, since
      declaration faults are hoisted to stage "request" and every runtime outcome is evidence.
      Decided by claude.
    recorded_at: "2026-08-23T04:55:00Z"
  - id: dec-006
    checkpoint_id: cp-spec-validation
    selected_option_id: DC-6-c
    rationale: >-
      D6: a prompt-facing head + tail line window is applied per stream on top of the adapter's
      1,000,000-char capture budget -- VALIDATION_HEAD_LINES 100, VALIDATION_TAIL_LINES 100, with
      the literal marker "... [N lines elided by sentinel] ..." carrying the exact removed count,
      plus VALIDATION_MAX_LINE_CHARS 2000 as a backstop so a single minified line cannot make a
      line-based window unbounded. A failing test suite's diagnostic value is concentrated at both
      ends, so a head-only cut discards the half that matters most. Residual accepted and recorded:
      validations/NNN.log persists the same windowed element, so the full capture is not available
      for post-hoc inspection -- prompt/log agreement was judged worth more than an unbounded log.
      Decided by claude.
    recorded_at: "2026-08-23T04:55:00Z"
  - id: dec-007
    checkpoint_id: cp-spec-validation
    selected_option_id: DC-7-a
    rationale: >-
      D7: one validationOutput element per declared script, since that is the only granularity
      under which run-store-fs's zero-padded validations/NNN.log numbering matches declaration
      order 1:1. AC-14 pins the element byte-exactly. Deviation from the proposal's recommended
      header, forced by evidence: ProcessRunResult carries no duration field and the exec adapter
      discards the elapsed time it measures, so duration cannot be reported without a new clock
      seam -- and adding one was rejected outright because a wall-clock value in the prompt breaks
      PRD 6.3's "same input -> same prompt" claim. The element therefore carries command, exit
      code, signal, timedOut and truncated only, and new AC-21 asserts prompt determinism.
      Decided by claude.
    recorded_at: "2026-08-23T04:55:00Z"
open_risks:
  - id: risk-001
    summary: >-
      RESOLVED BY SPEC (was high). #32's "per-script timeout" had no home in the merged config
      schema. spec.md AC-5 adds validationTimeoutMs as z.number().optional() to BOTH
      GlobalConfigSchema and RepoEntrySchema -- additive, no zod default, validations left as
      string[] and unwidened -- and AC-4 pins DEFAULT_VALIDATION_TIMEOUT_MS = 120_000 as the
      single fallback constant, owned by run so repos never duplicates it and never imports run.
      Residual: the cascade that picks run vs repo vs global is explicitly E6's, recorded as
      downstream constraint 1.
    severity: low
  - id: risk-002
    summary: >-
      RESOLVED BY SPEC (was high). Silent misinterpretation under the adapter's pinned
      shell:false is closed by AC-6/AC-7: whitespace tokenization on space and tab only, plus an
      exactly pinned rejection set (| & ; < > $ backtick ( ) { } [ ] * ? ! ~ # backslash single-
      and double-quote, and every ASCII control char other than space/tab), enforced as a literal
      list rather than a heuristic and raising InvalidValidationDeclarationError. Residual
      accepted and documented: legitimate quoted or globbed declarations are over-rejected; the
      non-breaking escape hatch is a future quote-aware tokenizer or array config form.
    severity: low
  - id: risk-003
    summary: >-
      DECIDED AND FROZEN (was medium). dec-007 fixes one validationOutput element per declared
      script and AC-14 pins its byte format. This is now a persisted format governing both
      <validation-output> in every prompt.md and every validations/NNN.log; changing it later is
      a format change, not a rendering tweak. Recorded as downstream constraint 7.
    severity: low
  - id: risk-004
    summary: >-
      ACCEPTED (was medium). dec-005 takes the cross-module compile-time ripple deliberately:
      RunStage gains "validations" and RUN_STAGES in history/ports/run-metadata-schemas.ts gains
      the matching entry. AC-19 bounds the history-side diff to exactly one array entry plus one
      comment clause and makes tsc --noEmit the proof that _AllRunStagesCovered still resolves to
      never. [E5.F2.H2]'s AC-15 is respected: the union is not relocated into src/core/run.
    severity: low
  - id: risk-005
    summary: >-
      RESOLVED BY SPEC (was medium). dec-006 adds a prompt-facing window on top of the adapter's
      1,000,000-char-per-stream capture budget: head 100 + tail 100 lines per stream with an exact
      elision marker, plus a 2000-char per-line backstop (AC-15). Residual accepted: the same
      windowed element is what validations/NNN.log persists, so the full capture is not retained
      for post-hoc inspection.
    severity: low
  - id: risk-006
    summary: >-
      CONSCIOUSLY INHERITED, NOT ESCALATED. The merged exec adapter kills only the immediate child
      pid, never a process group, and this story is what first spawns user-declared, potentially
      forking commands such as "npm test", so orphaned grandchildren become reachable in practice.
      Fixing it means changing merged adapter code (detached / kill strategy) with its own child-
      process test surface, so spec.md's Out Of Scope table excludes it explicitly and AC-20 pins
      src/adapters/** as an empty diff. Routed to the E5 closing summary as a follow-up backlog
      item alongside [E5.F1.H1] risk-004, so it does not fall between two stories.
    severity: medium
  - id: risk-007
    summary: >-
      ACCEPTED AND DOCUMENTED. A declared script that prints its environment still leaks secrets
      into the assembled prompt and into validations/*.log. No detection heuristic is proposed --
      the codebase has avoided them everywhere. The only mitigation delivered is dec-006's bounded
      window, which reduces exposure without removing it. The script is one the repo owner declared
      in their own config, on their own machine, against their own repo.
    severity: low
  - id: risk-008
    summary: >-
      NEW, introduced by dec-001's shape. deps.processRunner is optional on RunReviewDeps -- it has
      to be, because AC-20 pins every existing runReview caller and test as untouched -- so a
      composition root that forgets to wire createExecProcessRunner() produces a review that
      silently skips every declared validation and says nothing about it. Mitigated only by
      documentation: spec.md downstream constraint 2 makes wiring it E6's explicit obligation.
      E6 should consider surfacing "validations declared but no runner wired" as a visible warning.
    severity: medium
