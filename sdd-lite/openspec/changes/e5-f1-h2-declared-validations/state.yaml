      (new AC-21); (E3) dec-004's "fail before a worktree exists" conflicted with placing
      validations at stage 5 (after worktree creation) -- resolved by hoisting the declaration
      check into stage 1, reusing the file's own documented "harness (hoisted: an unknown
      harness leaves no orphan)" precedent, with the consequence that a malformed declaration
