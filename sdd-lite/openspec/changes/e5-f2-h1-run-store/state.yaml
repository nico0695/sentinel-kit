version: "0.1"
change_name: e5-f2-h1-run-store
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E5.F2.H1] (issue #33), first story of the E5 milestone: give the history core module
    its first real content -- the RunStore driven port (PRD 4.3) plus a filesystem-backed adapter
    under src/adapters/driven/storage/ -- so a completed run persists as runs/<repo>/<ts>/ in
    plain files (md result, prompt used, json metadata, validation logs). Its only declared
    dependency, [E4.F1.H1] (#26, runReview), is merged. The port/adapter/contract-suite pattern is
    heavily precedented (ConfigStore + config-store-yaml + ConfigStore.contract is a direct
    structural template) and RunReviewResult already carries the md result and the prompt. Risk is
    concentrated in three B-level design forks rather than in mechanics: where the metadata fields
    the backlog names (harness, branch, duration) come from given RunReviewResult carries neither,
    who calls the store when no composition root exists, and how a multi-file directory write is
    made atomic with partial runs identifiable.
  confidence: medium-high
  recorded_at: "2026-08-22T13:10:00Z"
lifecycle_status: completed
current_stage: sddl-qa-review
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No blocking unknown. The port catalog (PRD 4.3), the empty history/index.ts placeholder that
      names this story, the runReview result shape, and both existing storage adapters are all
      directly readable; lightweight proposal-stage exploration was sufficient.
  sddl-proposal:
    status: completed
    started_at: "2026-08-22T13:00:00Z"
    completed_at: "2026-08-22T13:10:00Z"
    notes: >-
      proposal.md written grounded in direct inspection of src/core/history/index.ts (a three-line
      placeholder that explicitly names E5.F2.x as its arrival), src/core/run/run-review.ts
      (RunReviewRequest/RunReviewResult field-by-field), src/core/repos/ports/config-store.ts and
      src/adapters/driven/storage/config-store-yaml.ts (the structural template), PRD 3.1-F, PRD
      4.3, the PRD glossary's definition of Run as "fully persisted", PRD risk 6 (engine auth
      "never persisted in runs/logs"), and docs/backlog-mvp-sentinel.md E5.F2.H1. Established that
      the backlog names five metadata fields and RunReviewResult carries two of them, which is the
      story's first real design problem rather than a detail. Six open questions recorded for
      spec, three of them B-level. E5.F2.H3 (cost/tokens) treated as out of scope per workflow
      contract rule 7 (optional stories skipped unless requested).
  sddl-spec:
    status: completed
    started_at: "2026-08-22T13:15:00Z"
    completed_at: "2026-08-22T13:35:00Z"
    notes: >-
      spec.md written, status complete at revision 2, 21 acceptance criteria. All six proposal open questions
      resolved (D1..D6); the three B-level ones carry recommendations pending ratification at
      cp-spec-approval. Grounded in direct verification rather than assumption: confirmed
      RepoRegistrySchema is z.record(z.string(), RepoEntrySchema) so repos are keyed by NAME,
      which settles the <repo> path segment (D5); confirmed src/core/workspace/helpers.ts
      (repoBasename, sanitizeBranchLabel, deriveWorktreePath) is NOT exported from the workspace
      barrel, so history cannot reuse it and must validate its own path segment; confirmed
      ReviewUsage fields are inputTokens/outputTokens/totalTokens, TerminalState is the five-value
      union, and Verdict is approve|request-changes|comment, so the metadata.json contract in the
      spec quotes real field names rather than plausible ones; confirmed RunStage IS exported from
      run/index.ts, which let AC-13 tighten failure.stage from a loose string to the pipeline's own
      union. Also confirmed no atomic-write precedent exists in the repo (config-store-yaml writes
      directly) while mkdtemp is precedented in the opencode permission-config adapter -- hence D3
      stages inside the runs root rather than in os.tmpdir(), since rename across filesystems
      fails with EXDEV.
      REVISION 2 (user-directed re-analysis before design): D1..D6 survived unchanged; five
      rev-1 specification gaps fixed, one a self-contradictory AC. (1) The decoy-token AC demanded
      absence from metadata.json while planting the decoy in every optional string field -- but
      failure.message's contract is to be written INTO metadata.json; rewritten as AC-18 with
      failure.message excluded. (2) <ts> sourcing was unspecified; new D7 makes the adapter
      clockless -- <ts> derives from record.startedAtEpochMs, honoring the injectable-clock
      convention and making paths deterministic (AC-14). (3) startedAt's record type fixed as
      epoch-ms number, one source rendered three ways (record / ISO metadata / compact path). (4)
      ReviewDiff.files[].content carries full per-file diff text, so persisting record.diff
      wholesale would duplicate the entire diff inside metadata.json; new D8 persists a summary
      only, pinned by AC-10's marker test. (5) First-save recursive directory creation and
      same-timestamp stale-staging retry specified (AC-15, AC-14). AC-19 additionally forbids a
      leading dot in repoName so skip-dot-entries is the single scanning rule at both levels.
    last_updated_at: "2026-08-22T14:05:00Z"
  sddl-design:
    status: completed
    started_at: "2026-08-22T14:15:00Z"
    completed_at: "2026-08-22T14:40:00Z"
    notes: >-
      design.md written: 6 new files, 2 modified, 7 design decisions (D-1..D-7), 0 blocking open
      questions. Two repo facts checked rather than assumed, each of which would have produced a
      wrong design: (1) .dependency-cruiser.cjs's core-no-io-libs rule bans ALL Node builtins in
      src/core (bare and node:-prefixed) with zod as the sole whitelist, so no node:path in core;
      (2) ConfigStore validates at the adapter boundary using a zod schema exported from core
      (GlobalConfigSchema.safeParse inside config-store-yaml.ts), which is the precedent D-1
      reuses so AC-19 binds every future RunStore rather than one adapter. Adapter splits into a
      pure run-layout.ts (timestamp formatting, path derivation, hand-written field-by-field
      metadata serializer) and an impure run-store-fs.ts, concentrating AC-4/AC-10/AC-18 in one
      pure directly-testable function; a denylist serializer was rejected because it fails open
      when RunRecord later grows a field, whereas the allowlist fails closed. RunDiffSummary is a
      new port shape rather than ReviewDiff so D8 becomes structural -- with no diff bodies in the
      input, no serializer bug can write them. Verified with node that the compact-ISO timestamp
      sorts lexicographically as chronologically, and corrected a wrong epoch example in the
      artifact (1755868200123 is 2025, not 2026). Verified no import cycle: nothing in src/core
      imports history. AC-11's mid-staging failure injection reuses the vi.doMock(node:fs/promises)
      technique already precedented in opencode-adapter.test.ts; AC-14's clockless proof uses fake
      timers across two far-apart system times rather than grepping the source for Date.now(.
    last_updated_at: "2026-08-22T14:40:00Z"
  sddl-plan:
    status: completed
    started_at: "2026-08-22T14:45:00Z"
    completed_at: "2026-08-22T15:00:00Z"
    notes: >-
