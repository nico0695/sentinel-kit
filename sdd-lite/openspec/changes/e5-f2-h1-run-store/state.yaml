open_risks:
  - id: risk-001
    summary: >-
      The backlog requires engine/harness/branch/state/duration in the persisted metadata, but
      RunReviewResult carries only state and engineName. Sourcing the remaining three determines
      the port signature and how much of the run module this story must touch; choosing wrong
      would force a runReview pipeline change this story has no mandate to make.
    severity: medium
  - id: risk-002
    summary: >-
      Atomicity is required over a directory of four files, not a single file, so the standard
      write-tmp-then-rename idiom does not transfer unexamined. AC-3 ("partial run identifiable")
      is satisfiable by a staging dir plus one rename or by an ordered write with a completion
      marker written last, and the two differ in what a reader must know.
    severity: medium
  - id: risk-003
    summary: >-
      "Nothing sensitive persisted" needs a decidable, testable definition. The prompt legitimately
      contains the repo's own diff; the real hazards are narrower -- failure.error is typed unknown
      and may be a raw exception carrying a command line or environment in its message or stack.
      Without a precise rule and a test pinning it, this AC degrades into an untested assertion.
    severity: medium
next_action:
  kind: wait_for_approval
  target: cp-proposal-approval
  summary: >-
