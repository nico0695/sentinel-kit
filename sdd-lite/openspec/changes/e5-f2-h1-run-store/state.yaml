open_risks:
  - id: risk-001
    summary: >-
      CLOSED by D1, ratified at cp-spec-approval (dec-002). The caller composes the RunRecord, so
      runReview needs no change; AC-3 pins its diff over src/core/run as empty and QA verifies it.
    severity: low
  - id: risk-002
    summary: >-
      CLOSED by D3, ratified at cp-spec-approval (dec-002). Staging inside the runs root plus one
      rename; AC-12 pins the same-filesystem requirement that makes rename safe, which an
      os.tmpdir() staging area would violate with EXDEV. Residual concurrency exposure is tracked
      separately as risk-005.
    severity: low
  - id: risk-003
    summary: >-
      "Nothing sensitive persisted" needs a decidable, testable definition. The prompt legitimately
      contains the repo's own diff, which is the point rather than a leak; the real hazard is
      narrower -- RunReviewResult.failure.error is typed unknown and may be a raw exception whose
      message or stack carries a command line or environment. Largely addressed by D4 plus AC-13
      (RunRecord.failure is a typed { stage: RunStage; message: string }, so a raw exception cannot
      structurally reach the store) and by AC-18 (a decoy-token test). Rev 2 of the spec fixed
      rev 1's version of that test, which was self-contradictory: it planted the decoy in every
      optional string field including failure.message, whose contract is to be written INTO
      metadata.json. The decoy set is now prompt/engineOutput/validationOutput with
      failure.message explicitly excluded and the rationale stated in the AC itself.
    severity: low
  - id: risk-004
    summary: >-
      With a write-only port (D6), RunStore.contract.ts can only assert what is observable through
      save, so the on-disk assertions live in the non-portable fs-adapter test. The shared suite is
      therefore thin by deliberate choice; [E5.F2.H2] is where it thickens. Recorded so a later
      reviewer does not read the thinness as an oversight rather than a stated trade-off.
    severity: low
  - id: risk-005
    summary: >-
      TOCTOU window between the step-4 collision pre-check and the step-9 rename: two concurrent
      saves of the SAME run can both pass the pre-check. On POSIX the loser's rename fails with
      ENOTEMPTY, so it is caught, but it surfaces as RunPersistenceError rather than the more
      precise RunAlreadyExistsError. Accepted, not solved -- Node offers no portable atomic
      create-exclusive on a directory. Neither ordering corrupts or merges a run, which is the
      property that matters. Surfaced by design, recorded rather than hidden.
    severity: low
