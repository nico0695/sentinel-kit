    resolved_at: "2026-08-22T13:15:00Z"
  - id: cp-spec-approval
    type: stage_approval
    stage: sddl-spec
    summary: >-
      spec.md is complete at revision 2 with 21 acceptance criteria (a user-directed re-analysis Three B-level decisions (D1 metadata source,
      fixed five rev-1 gaps, including one self-contradictory AC -- see the spec's Revision
      Notes -- and added A-level D7 clockless-adapter and D8 diff-summary-only decisions).
      D2 the store's caller, D3 atomicity strategy) are resolved with recommendations and need
      ratification, because D1 in particular determines whether this story touches src/core/run at
      all.
    question: >-
      Ratify D1 (the caller composes a RunRecord; runReview stays byte-identical), D2 (port and
      adapter ship with no caller, wiring deferred to E6.F1) and D3 (staging directory inside the
      runs root plus a single rename, no completion marker), and proceed to sddl-design?
    options:
      - id: opt-ratify-all
        label: Ratify all three and proceed to design
        description: >-
          Accept D1/D2/D3 as specified. This story stays entirely inside src/core/history and
          src/adapters/driven/storage, with an empty diff over src/core/run.
        recommended: true
      - id: opt-d1-grow-result
        label: Reject D1 -- grow RunReviewResult instead
        description: >-
          Have runReview carry harness, branch and duration on its result the way [E4.F2.H3] did
          for engineName. Requires amending the scope boundary, AC-2 and AC-3 before design, and
          makes runReview responsible for measuring wall-clock duration.
      - id: opt-d3-marker
        label: Reject D3 -- ordered write plus completion marker
        description: >-
          Write files in a fixed order into the final directory with a marker file written last.
          Simpler to implement, but every reader must then know the marker rule, and a partial run
          occupies the real run path rather than an obviously-partial one.
    free_input_allowed: true
    created_at: "2026-08-22T13:35:00Z"
    response:
      selected_option_id: opt-ratify-all
      free_text: "ratifico las tres, avanza con el design"
      responded_at: "2026-08-22T14:15:00Z"
    resolved_at: "2026-08-22T14:15:00Z"
  - id: cp-design-approval
