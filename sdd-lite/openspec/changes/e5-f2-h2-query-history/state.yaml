open_risks:
  - id: risk-001
    summary: >-
      Issue #34's "corrupt/partial runs listed with a marker" reads, on a literal interpretation
      of "partial," in tension with [E5.F2.H1]'s own AC-19 convention of skipping dot-prefixed
      .partial-<ts> staging directories during any scan. Spec must decide explicitly whether this
      story's scan treats .partial-<ts> entries differently than [E5.F2.H1]'s did, and state the
      rationale.
    severity: medium
