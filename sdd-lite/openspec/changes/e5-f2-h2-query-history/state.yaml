version: "0.1"
change_name: e5-f2-h2-query-history
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E5.F2.H2] (issue #34), second story of the E5 milestone: give the history core module
    its read side -- listRuns and getRun use cases over the RunStore port, which [E5.F2.H1] left
    write-only (save() alone). The on-disk layout (runs/<repo>/<ts>/, metadata.json, the
    .partial-<ts> staging convention) is fully specified by the merged [E5.F2.H1]. The use-case
    pattern is directly precedented by listRepos/listBranches ([E2.F2.H3]). Risk is concentrated
    in one open design question rather than in mechanics: what "corrupt/partial, listed with a
    marker" means precisely, given that [E5.F2.H1]'s own AC-19 scanning convention already skips
    dot-prefixed .partial-<ts> entries rather than surfacing them -- the literal opposite of what
    this story's acceptance criterion asks for.
  confidence: medium-high
  recorded_at: "2026-08-22T18:00:00Z"
lifecycle_status: planning
current_stage: sddl-spec
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No blocking unknown. [E5.F2.H1]'s port, fs adapter and layout module are all directly
      readable, as is the E2.F2.H3 listRepos/listBranches precedent; lightweight proposal-stage
      exploration was sufficient.
  sddl-proposal:
    status: completed
    started_at: "2026-08-22T17:50:00Z"
    completed_at: "2026-08-22T18:00:00Z"
    notes: >-
      proposal.md written grounded in direct inspection of src/core/history/index.ts and
      ports/run-store.ts (RunStore currently write-only, save() alone), src/adapters/driven/
      storage/run-layout.ts and run-store-fs.ts ([E5.F2.H1]'s on-disk layout, timestamp format,
      and .partial-<ts> staging convention), src/core/repos/list-repos.ts and list-branches.ts
      (the structural template for a thin, dependency-injected read use case), and
      docs/backlog-mvp-sentinel.md's E5.F2.H2 entry. Four open questions recorded for spec, two
      B-level: the precise definition of "corrupt/partial" given [E5.F2.H1]'s AC-19 already skips
      .partial-<ts> entries during scanning, and the shape of RunStore's new read method(s).
      [E5.F2.H3] (cost/tokens) treated as out of scope per workflow contract rule 7.
    last_updated_at: "2026-08-22T18:00:00Z"
  sddl-spec:
    status: completed
    started_at: "2026-08-22T18:10:00Z"
    completed_at: "2026-08-22T19:00:00Z"
    notes: >-
      spec.md written, 12 acceptance criteria at rev 1. All four proposal open questions resolved
      with recommendations: D1 (both .partial-<ts> staging leftovers AND corrupt-metadata final
      directories are surfaced via RunSummary.status, deliberately diverging from [E5.F2.H1]'s
      AC-19 scan which skips dot-prefixed entries for its narrower collision-check purpose); D2
      (list() returns a distinct, mostly-optional RunSummary rather than RunRecord[], because a
      partial/corrupt entry cannot supply a full RunRecord); D3 (getRun returns file bodies, not
      paths, symmetric with what save() accepted); D4 (empty repo -> [], not an error, closed
      A-level). Grounded in direct inspection of RunStore.contract.ts, run-store-errors.ts,
      terminal-state.ts, verdict.ts, and list-branches-errors.ts.
      REVISION 2 (user-directed second iteration before ratification): D1..D4 survived unchanged;
      five rev-1 gaps fixed, now 15 ACs. (1) Rev 1's AC-6 named a nonexistent validation target
      ("RunRecord-shape validation") -- metadata.json is a distinct document (version, repo, ISO
      startedAt) with no schema anywhere; new D6/D7 introduce RunMetadataSchema with a
      compile-time satisfies drift guard against the run unions, since AC-15 pins src/core/run
      untouched. (2) No path-traversal validation existed on read inputs -- list/get turn caller
      strings into path segments; new AC-13 mirrors save()'s RunRecordPathFieldsSchema
      discipline and requires rejection BEFORE any fs access. (3) No raw-error translation AC for
      read paths (no analogue of H1's AC-20); new AC-14. (4) Rev 1's scan was implicitly two-way,
      so a stray .DS_Store would have been listed as a corrupt run; new D9/AC-12 make the
      classification three-way (ts-dir -> run, .partial-<ts> -> partial, anything else silently
      ignored), plus unknown metadata version -> corrupt (AC-6) and tampering-induced final+
      partial coexistence -> final wins (AC-4). (5) Under-specified data sourcing pinned: id
      semantics (D5), startedAtEpochMs uniformly from the directory name (D8), diff.warnings
      defaulting to [] on round-trip, validations/*.log read order sorted by filename (AC-9).
      Timestamp inverse-parse round-trip verified with node before writing AC-2.
    last_updated_at: "2026-08-22T19:00:00Z"
