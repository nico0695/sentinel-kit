    summary: >-
      proposal.md is complete and ready for sddl-spec. Two B-level questions are recorded for spec
      to resolve as firm acceptance criteria before any design work: the precise meaning of
      "corrupt/partial, listed with a marker," and the shape of RunStore's new read method(s).
    question: >-
      Approve the proposal and proceed to sddl-spec for [E5.F2.H2] Query history?
    free_input_allowed: true
    created_at: "2026-08-22T18:00:00Z"
    response:
      free_text: "si, avanza con el spec"
      responded_at: "2026-08-22T18:05:00Z"
    resolved_at: "2026-08-22T18:05:00Z"
  - id: cp-spec-approval
    type: stage_approval
    stage: sddl-spec
    summary: >-
      spec.md is complete at revision 2 with 15 acceptance criteria (a user-directed second
      iteration fixed five rev-1 gaps -- see the spec's Revision Notes -- and added A-level
      D5..D9 covering id semantics, RunMetadataSchema, the satisfies drift guard, uniform
      timestamp sourcing, and the three-way scan classification). Two B-level decisions (D1
      corrupt/partial definition, D2 read-method shape) are recommended and need ratification
      before sddl-design.
    question: >-
      Ratify D1 (list() surfaces both .partial-<ts> leftovers and corrupt-metadata final
      directories via RunSummary.status) and D2 (list() returns a distinct RunSummary, not
      RunRecord[]; get() returns the full RunRecord), and proceed to sddl-design?
    options:
      - id: opt-ratify-both
        label: Ratify D1 and D2 and proceed to design
        description: >-
          Accept both as specified. list()/get() ship with the RunSummary/RunRecord split and the
          dual partial+corrupt marker.
        recommended: true
      - id: opt-d1-partial-only
        label: Reject D1 partially -- only surface .partial-<ts>, not corrupt metadata
        description: >-
          Narrower scope: treat metadata parse/validation failure as an unexpected error instead
          of a listed status. Simpler, but AC-6/AC-7 would need to change to "list() may throw on
          a corrupt entry," which is closer to the failure mode the AC explicitly warns against.
      - id: opt-d2-full-record
        label: Reject D2 -- list() returns RunRecord[] instead of RunSummary[]
        description: >-
          Keeps one type instead of two, but forces partial/corrupt entries to fabricate
          placeholder values for RunRecord's required fields (harness, baseRef, targetRef, state),
          which has no honest value to use.
    free_input_allowed: true
    created_at: "2026-08-22T18:35:00Z"
