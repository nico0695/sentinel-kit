version: "0.1"
change_name: e5-f2-h2-query-history
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E5.F2.H2] (issue #34), second story of the E5 milestone: give the history core module
    its read side -- listRuns and getRun use cases over the RunStore port, which [E5.F2.H1] left
    write-only (save() alone). The on-disk layout (runs/<repo>/<ts>/, metadata.json, the
    .partial-<ts> staging convention) is fully specified by the merged [E5.F2.H1]. The use-case
    pattern is directly precedented by listRepos/listBranches ([E2.F2.H3]). Risk is concentrated
    in one open design question rather than in mechanics: what "corrupt/partial, listed with a
    marker" means precisely, given that [E5.F2.H1]'s own AC-19 scanning convention already skips
    dot-prefixed .partial-<ts> entries rather than surfacing them -- the literal opposite of what
    this story's acceptance criterion asks for.
  confidence: medium-high
  recorded_at: "2026-08-22T18:00:00Z"
lifecycle_status: planning
current_stage: sddl-spec
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No blocking unknown. [E5.F2.H1]'s port, fs adapter and layout module are all directly
      readable, as is the E2.F2.H3 listRepos/listBranches precedent; lightweight proposal-stage
      exploration was sufficient.
  sddl-proposal:
    status: completed
    started_at: "2026-08-22T17:50:00Z"
    completed_at: "2026-08-22T18:00:00Z"
    notes: >-
      proposal.md written grounded in direct inspection of src/core/history/index.ts and
      ports/run-store.ts (RunStore currently write-only, save() alone), src/adapters/driven/
      storage/run-layout.ts and run-store-fs.ts ([E5.F2.H1]'s on-disk layout, timestamp format,
      and .partial-<ts> staging convention), src/core/repos/list-repos.ts and list-branches.ts
      (the structural template for a thin, dependency-injected read use case), and
      docs/backlog-mvp-sentinel.md's E5.F2.H2 entry. Four open questions recorded for spec, two
      B-level: the precise definition of "corrupt/partial" given [E5.F2.H1]'s AC-19 already skips
      .partial-<ts> entries during scanning, and the shape of RunStore's new read method(s).
      [E5.F2.H3] (cost/tokens) treated as out of scope per workflow contract rule 7.
    last_updated_at: "2026-08-22T18:00:00Z"
  sddl-spec:
    status: completed
    started_at: "2026-08-22T18:10:00Z"
    completed_at: "2026-08-22T18:35:00Z"
    notes: >-
      spec.md written, 12 acceptance criteria. All four proposal open questions resolved with
      recommendations: D1 (both .partial-<ts> staging leftovers AND corrupt-metadata final
      directories are surfaced via RunSummary.status, deliberately diverging from [E5.F2.H1]'s
      AC-19 scan which skips dot-prefixed entries for its narrower collision-check purpose); D2
      (list() returns a distinct, mostly-optional RunSummary rather than RunRecord[], because a
      partial/corrupt entry cannot supply a full RunRecord); D3 (getRun returns file bodies, not
      paths, symmetric with what save() accepted); D4 (empty repo -> [], not an error, closed
      A-level). Grounded in direct inspection of RunStore.contract.ts (confirmed its own doc
      comment names this story as where the thin contract "thickens"), run-store-errors.ts (the
      HistoryError hierarchy pattern the two new errors extend), terminal-state.ts and verdict.ts
      (exact field types for RunSummary), and list-branches-errors.ts (the error-class shape
      convention). D1 and D2 are B-level and need ratification before design.
    last_updated_at: "2026-08-22T18:35:00Z"
artifacts:
  state: sdd-lite/openspec/changes/e5-f2-h2-query-history/state.yaml
  proposal: sdd-lite/openspec/changes/e5-f2-h2-query-history/proposal.md
  spec: sdd-lite/openspec/changes/e5-f2-h2-query-history/spec.md
checkpoints:
  - id: cp-proposal-approval
    type: stage_approval
    stage: sddl-proposal
    summary: >-
      proposal.md is complete and ready for sddl-spec. Two B-level questions are recorded for spec
      to resolve as firm acceptance criteria before any design work: the precise meaning of
      "corrupt/partial, listed with a marker," and the shape of RunStore's new read method(s).
    question: >-
      Approve the proposal and proceed to sddl-spec for [E5.F2.H2] Query history?
    free_input_allowed: true
    created_at: "2026-08-22T18:00:00Z"
    response:
      free_text: "si, avanza con el spec"
      responded_at: "2026-08-22T18:05:00Z"
    resolved_at: "2026-08-22T18:05:00Z"
  - id: cp-spec-approval
    type: stage_approval
    stage: sddl-spec
    summary: >-
      spec.md is complete with 12 acceptance criteria. Two B-level decisions (D1 corrupt/partial
      definition, D2 read-method shape) are recommended and need ratification before sddl-design.
    question: >-
      Ratify D1 (list() surfaces both .partial-<ts> leftovers and corrupt-metadata final
      directories via RunSummary.status) and D2 (list() returns a distinct RunSummary, not
      RunRecord[]; get() returns the full RunRecord), and proceed to sddl-design?
    options:
      - id: opt-ratify-both
        label: Ratify D1 and D2 and proceed to design
        description: >-
          Accept both as specified. list()/get() ship with the RunSummary/RunRecord split and the
          dual partial+corrupt marker.
        recommended: true
      - id: opt-d1-partial-only
        label: Reject D1 partially -- only surface .partial-<ts>, not corrupt metadata
        description: >-
          Narrower scope: treat metadata parse/validation failure as an unexpected error instead
          of a listed status. Simpler, but AC-6/AC-7 would need to change to "list() may throw on
          a corrupt entry," which is closer to the failure mode the AC explicitly warns against.
      - id: opt-d2-full-record
        label: Reject D2 -- list() returns RunRecord[] instead of RunSummary[]
        description: >-
          Keeps one type instead of two, but forces partial/corrupt entries to fabricate
          placeholder values for RunRecord's required fields (harness, baseRef, targetRef, state),
          which has no honest value to use.
    free_input_allowed: true
    created_at: "2026-08-22T18:35:00Z"
