    stage: sddl-proposal
    summary: >-
      proposal.md is ready for spec, but three B-level decisions are deliberately unresolved and
      spec should not invent answers to them: (1) adopt commander as the first runtime CLI
      dependency, and whether picocolors belongs in this story or in [E6.F2.H2]; (2) who persists
      a run after review, given runReview has no RunStore dep and nothing calls store.save();
      (3) where the sentinel home path root comes from (~/.sentinel, SENTINEL_HOME, a global flag).
