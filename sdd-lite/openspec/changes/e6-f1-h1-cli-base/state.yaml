decisions:
  - id: D1
    level: C
    authorship: claude->user
    decided_by: user
    title: Run persistence is owned by a new `persistRun` use case in `core/history`
    context: >-
      Neither [E4.F1.H1] (runReview: worktree -> diff -> prompt -> engine -> parse -> terminal
      state -> cleanup) nor [E5.F2.H1] (RunStore: complete persistence) assigns an owner to the
      act of composing a RunRecord and calling save(). [E5.F2.H1] deliberately made RunRecord
      caller-composed so that "history never depends on run's request shape and runReview is
      never touched by this module's existence" (run-store.ts). The result is a genuine backlog
      gap, not a design fork: PRD use case 5 and [E5.F2.H2]'s listRuns read a store nothing
      writes. Escalated as workflow-contract rule 8 (C level).
    decision: >-
      Add a thin `persistRun` use case to `core/history` that composes a RunRecord from the
      RunReviewRequest/RunReviewResult pair and calls RunStore.save(). The CLI adapter calls two
      use cases in sequence and holds no mapping logic of its own. Accepted inside [E6.F1.H1]
      rather than deferred to a new E5 story.
    rationale: >-
      Preserves this story's AC-1 (zero logic in the command) and honours [E5.F2.H1]'s explicit
      decision to leave runReview untouched, which the rejected `runStore` in RunReviewDeps
      option would have reversed. Composing the record in src/main/ was rejected as domain
      mapping in the composition root, a grey zone against the "use cases are the only core API"
      guard. Opening a separate E5 story was rejected as an extra PR that delays E6 for no
      structural gain.
    consequences: >-
      [E6.F1.H1] widens beyond the backlog entry's literal text by adding one core/history use
      case. The deviation is deliberate, user-authorised, and must be declared in the story's PR
      description and in the history entry. spec.md must carry persistRun as in-scope with its
      own acceptance criteria and unit tests (core, in-memory RunStore fake).
  - id: D2
    level: B
    authorship: claude->user
    decided_by: user
    title: Sentinel home root is `SENTINEL_HOME` with a `~/.sentinel` default
    context: >-
      createConfigStoreAdapter(basePath), createRunStoreFsAdapter(runsRoot),
      createHarnessLoaderAdapter(basePath) and runReview's clonesDir/worktreesDir all require
      absolute paths, and no component resolves them. The composition root is the first code
      forced to decide (risk-e6h1-002).
    decision: >-
      Resolve one home root in the composition root: the SENTINEL_HOME environment variable when
      set, otherwise ~/.sentinel. All adapter paths derive from it.
    rationale: >-
      Keeps the [E7.F1.H1] e2e smoke suite able to point at a temp directory without mutating the
      real HOME, and stays scriptable in CI. A hardcoded ~/.sentinel would force HOME juggling in
      tests; a global --home flag is noisier to type and does not cover the TUI entry point.
    consequences: >-
      SENTINEL_HOME becomes public surface and must be documented in --help and in [E7.F2.H1]
      user documentation. design.md owns the exact subdirectory layout under the root.
  - id: D3
    level: B
    authorship: claude->user
    decided_by: user
    title: Review timeout comes from a new `reviewTimeoutMs` global config field plus a `--timeout` flag
    context: >-
      RunReviewRequest.timeoutMs is mandatory with no default, and GlobalConfigSchema carries only
      validationTimeoutMs (risk-e6h1-003).
    decision: >-
      Add reviewTimeoutMs to GlobalConfigSchema as the default source, overridable per invocation
      by a --timeout flag on the review command.
    rationale: >-
      Mirrors how validationTimeoutMs is already resolved, so the config format stays internally
      consistent and the effective value stays visible and auditable. A composition-root constant
      would make an agent-invoking CLI's slowest knob non-configurable; a mandatory flag is hostile
      to interactive use.
    consequences: >-
      This is a config-format change to an existing schema. spec.md must state the default value
      and the precedence order (flag > config > schema default), and the schema change needs its
      own test coverage.
  - id: D4
    level: B
    authorship: claude->user
    decided_by: user
    title: Adopt `commander` only; defer `picocolors` to [E6.F2.H2]
    context: >-
      First runtime dependency since E0 (risk-e6h1-004). docs/setup-tecnico-sentinel.md §4
      recommends commander, @clack/prompts, picocolors and optional marked/marked-terminal, but
      CLAUDE.md makes those recommendations re-evaluable at implementation time with justification.
    decision: >-
      Add commander as the only new runtime dependency in this change. picocolors is deferred to
      [E6.F2.H2] (terminal result rendering), which owns output presentation. @clack/prompts stays
      with [E6.F2.H1] (TUI). The setup doc's recommendation is ratified, not overridden.
    rationale: >-
      Keeps a command-surface story to one new dependency and avoids committing to output styling
      before the story that owns rendering exists. node:util parseArgs was rejected: hand-rolling
      subcommands, per-command --help and validation is precisely this story's AC-2, and it would
      deviate from the setup doc without a benefit that justifies the divergence.
    consequences: >-
      package.json runtime deps go from 3 to 4. The bootstrap refresh trigger recorded in
      config.yaml ("first E6 runtime dependency") is satisfied by this change and config.yaml plus
      project-context.md need a follow-up touch once it merges.
  - id: D5
    level: B
    authorship: claude->user
    decided_by: user
    title: RunReviewRequest composition is owned by a pure `resolveReviewRequest` in `core/run`
    context: >-
      Surfaced by sddl-spec beyond its brief and logged as risk-e6h1-007 / OQ-2. Nothing owns
      composing a RunReviewRequest from the flag -> RepoEntry -> GlobalConfig cascade (repoPath,
      baseRef, targetRef, harnessType, timeoutMs, cleanupPolicy, limits, validations,
      validationTimeoutMs, engineName). core/repos exports no getRepo/resolveRepo; only
      resolveEngine exists as a pure exported core helper. Putting the cascade in the review
      command is the same class of concern D1 removed from the CLI, and [E6.F2.H1]'s TUI would
      need to duplicate the same precedence rules.
    decision: >-
      Export a pure `resolveReviewRequest` from `core/run`'s public barrel, sibling to
      `resolveEngine`. The CLI passes parsed flags plus the resolved RepoEntry/GlobalConfig and
      receives a complete RunReviewRequest; the command holds no precedence logic.
    rationale: >-
      Consistent with D1 and with AC-1 (zero logic in the command), and resolveEngine already sets
      the precedent for a pure resolver living in core/run's barrel. Leaving the cascade in the
      adapter was rejected because the TUI must reuse it; a getRepo use case plus in-CLI merging
      was rejected as a half fix -- it relocates the lookup but leaves the precedence rules in the
      command.
    consequences: >-
      Second piece of core surface this story adds beyond its literal backlog text, after D1. Both
      deviations must be declared together in the PR description and the history entry. design.md
      owns resolveReviewRequest's exact signature and its interaction with resolveEngine; it needs
      core unit tests covering the precedence order fixed by D3 (flag > config > constant).
  - id: D6
    level: B
    authorship: claude->user
    decided_by: user
    title: No `--json` flag in this story; stable line format only
    context: >-
      OQ-1 from spec.md. The backlog says only "output suitable for terminal and pipes".
      A --json surface is a public API commitment (payload shape, versioning).
    decision: >-
      [E6.F1.H1] ships AC-10 only -- results on stdout, diagnostics on stderr, one stable line per
      record. The --json question is deferred to [E6.F1.H2] (#37), the non-interactive scripting
      story that is its natural owner. Not closed off permanently.
    rationale: >-
      AC-10 already satisfies "suitable for terminal and pipes". Committing to a JSON payload shape
      before a real consumer exists to validate it risks freezing the wrong contract; #37 is where
      TTY-less scripting requirements actually land. Ruling --json out forever was rejected: the
      PRD's gate mode will likely want it.
    consequences: >-
      spec.md's OQ-1 is closed as deferred. design.md must not introduce a JSON serializer, and
      the output format it fixes should stay easy to extend with one later.
  - id: D7
    level: B
    authorship: claude->user
    decided_by: user
    title: Alias-to-storage-key normalisation lives module-private inside `core/history`
    context: >-
      OQ-D1, surfaced by sddl-design and confirmed by the orchestrator against the source.
      registerRepo's deriveAlias returns `owner/repo`; RunStore's RunRecordPathFieldsSchema and
      RunQueryFieldsSchema validate repoName through PathSegmentSchema, which refines against any
      "/" or "\\". As designed, `sentinel review` would fail inside persistRun and `runs list`
      inside listRuns for every registered repo -- exactly the integration-mismatch class
      risk-e6h1-006 predicted, caught at design rather than in CI.
    decision: >-
      Add a module-private, idempotent normaliser in core/history mapping `owner/repo` to
      `owner__repo`, applied by persistRun, listRuns and getRun. No new public export, no
      signature change. The user-facing alias stays `owner/repo` everywhere else, including
      `repo list` output and the `review <repo>` argument.
    rationale: >-
      Keeps the storage-key rule inside the module that owns the persistence contract, so the CLI
      never learns it and [E6.F2.H1]'s TUI inherits it for free. Exporting a public
      `toRunRepoName` was rejected as a third piece of core surface that would push a persistence
      detail into the adapter. Changing deriveAlias to emit `owner__repo` at the root was rejected
      as a larger blast radius: it reopens [E2.F2.H2], changes the `clones/` directory layout, and
      degrades the alias the user reads and types.
    consequences: >-
      This changes the observable behaviour of listRuns and getRun, two use cases already merged
      by [E5.F2.H2], which spec.md had declared out of scope. The deviation is user-authorised and
      must be declared in the PR description and the history entry alongside D1 and D5. plan.md
      must give it its own execution stage with core unit tests covering idempotency and an alias
      that needs no normalisation.
  - id: D8
    level: B
    authorship: claude->user
    decided_by: user
    title: OpenCode model comes from `SENTINEL_OPENCODE_MODEL`, with a clear failure when unset
    context: >-
      OQ-D2. createOpenCodeAdapter requires a mandatory `model` (docs/engines/opencode.md: the
      `-m provider/model` flag is mandatory in practice) and no GlobalConfig field supplies one.
    decision: >-
      container.ts reads SENTINEL_OPENCODE_MODEL. When the resolved engine is `opencode` and the
      variable is unset or empty, fail with a one-line stderr message naming the variable. No
      model id is hardcoded and GlobalConfigSchema is not touched.
    rationale: >-
      Keeps this story to the single config-format change D3 already authorised, and avoids
      baking a provider/model string into the repo that would drift. A GlobalConfig field is more
      discoverable but is a second schema change in one story; dropping opencode from the wiring
      was rejected because it would leave [E4.F2.H2] unreachable from the CLI.
    consequences: >-
      SENTINEL_OPENCODE_MODEL joins SENTINEL_HOME as public surface and must appear in root
      `--help` and in [E7.F2.H1] documentation. A future story may promote it to config.
  - id: D9
    level: B
    authorship: claude->user
    decided_by: user
    title: Accept the D7 normalisation leak on the error path; revisit in E7
    context: >-
      risk-e6h1-010, surfaced by S6 and confirmed by the orchestrator. RunNotFoundError is
      constructed by the driven store adapter (run-store-fs.ts:361, :408), which only ever
      receives the normalised storage key, so a failed `runs show owner/repo x` prints
      `Run not found: owner__repo/x` on stderr. The happy path is clean: S6's and S7's renderers
      echo the requested alias by construction and never read the stored repoName.
    decision: >-
      Accept it for now. No code change in [E6.F1.H1]. The risk stays recorded with its three
      options; the natural moment to decide is [E7.F1.H2] (dogfooding), where it will either
      prove annoying in practice or prove irrelevant.
    rationale: >-
      The leak is cosmetic and confined to an error path. Fixing it in getRun would be this
      story's FOURTH core behaviour change and the third against code already merged by
      [E5.F2.H2] -- disproportionate to a stderr string. Branching per error type in the adapter
      is forbidden by AC-13. Dogfooding is cheap evidence for a decision that does not need to be
      made now.
    consequences: >-
      risk-e6h1-010 stays open past this story's close and must appear in the PR description's
      known-limitations note and in the history entry, so it is not silently inherited.
open_risks:
  - id: risk-e6h1-001
    summary: >-
      Run persistence has no owner: RunReviewDeps excludes RunStore and no code calls
      store.save(), so sentinel review would write no history and PRD use case 5 (consult a
      repo's review history) stays dead. Fixing it in the CLI adapter would violate this story's
      own AC-1 (zero logic in the command); fixing it in core adds surface the backlog entry does
      not authorize. May be a workflow-rule-8 STOP rather than a design fork.
    severity: high
    status: resolved
    resolution: >-
      Escalated to the user as a C-level backlog gap and settled by D1: a new `persistRun` use
      case in core/history, in scope for this change.
  - id: risk-e6h1-002
    summary: >-
      No component resolves the sentinel home root. ConfigStore, HarnessLoader, RunStore and
      runReview all require injected absolute paths (basePath, runsRoot, clonesDir, worktreesDir)
      and the composition root is the first code that must decide. Affects config-format
      expectations and every later story that reads those files.
    severity: medium
    status: resolved
    resolution: Settled by D2.
  - id: risk-e6h1-003
    summary: >-
      RunReviewRequest.timeoutMs is mandatory with no default and GlobalConfigSchema has no
      review/engine timeout field (only validationTimeoutMs). The review command needs a value
      from a source that does not exist yet; adding a config field is a config-format change.
    severity: medium
    status: resolved
    resolution: Settled by D3.
  - id: risk-e6h1-004
    summary: >-
      First runtime dependency added since E0 (current deps: execa, yaml, zod). Per CLAUDE.md the
      setup doc's commander recommendation is re-evaluable on implementation with justification,
      making adoption a B-level decision the user owns.
    severity: medium
    status: resolved
    resolution: Settled by D4.
  - id: risk-e6h1-005
    summary: >-
      H1/H2 overlap risk: [E6.F1.H2] (#37) owns the review exit-code contract but both stories
      touch the same command. proposal.md proposes an explicit boundary that spec must confirm.
    severity: low
    status: resolved
    resolution: >-
      Confirmed at sddl-spec as an A-level decision and fixed as spec.md AC-12. H1 owns review's
      full argument surface (<repo> <branch> --type --engine --timeout), the runReview + persistRun
      invocation and the printed result, exiting 0 for any completed invocation regardless of
      terminal state and non-zero only on usage/invocation failure. H2 adds the terminal-state to
      exit-code mapping, its configurability and the no-TTY guarantee. Rationale: H1 must define
      --type regardless, because RunReviewRequest.harnessType is mandatory and has no other source;
      [E6.F1.H2]'s backlog description restates the command shape as context, and the only surface
      its acceptance criteria uniquely name is exit codes plus TTY-less usability.
  - id: risk-e6h1-007
    summary: >-
      Composing the RunReviewRequest from the flag -> RepoEntry -> GlobalConfig cascade (repoPath,
      baseRef, harnessType, timeoutMs, limits, validations, validationTimeoutMs) has no owner. If
      it lands inside the review command it is the same class of concern D1 removed from the CLI
      and it duplicates PRD 3.1-D precedence rules outside core, where the TUI ([E6.F2.H1]) will
      need them again. Recorded as spec.md OQ-2, B-level (additive core surface, like D1).
    severity: medium
    status: resolved
    resolution: Settled by D5 (resolveReviewRequest in core/run).
  - id: risk-e6h1-008
    summary: >-
      Engines mismatch introduced by S1: commander@15.0.0 declares engines.node ">=22.12.0" while
      package.json declares ">=22". Verified directly in node_modules/commander/package.json. CI is
      unaffected -- .github/workflows/ci.yml pins node [22, 24], which actions/setup-node resolves
      to the latest 22.x -- but a consumer installing @nico0695/sentinel on Node 22.0-22.11 would
      hit EBADENGINE. Deliberately not fixed in passing: S1's scope was "package.json ... nothing
      else", and engines is published metadata. Decide before [E7.F2.H3] (first publish).
    severity: low
    status: open
  - id: risk-e6h1-009
    summary: >-
      Surfaced by S3. D7 authorises INPUT normalisation only, so RunSummary/RunRecord objects
      returned by the store still carry the normalised `owner__repo` in their own repoName field.
      If S6/S7's renderers print that field verbatim, the user reads `owner__repo` where they
      typed `owner/repo`. The renderers must echo the requested alias instead of the stored key.
      Deliberately not fixed inside S3, whose scope was the helper and its two call sites.
    severity: medium
    status: open
    owner_stage: S6/S7
  - id: risk-e6h1-010
    summary: >-
      Surfaced by S6 and confirmed by the orchestrator. RunNotFoundError composes its message in
      core as `Run not found: ${repoName}/${id}`, and it is constructed by the DRIVEN adapter
      (src/adapters/driven/storage/run-store-fs.ts:361 and :408), which only ever receives the
      normalised storage key -- getRun passes toRunStorageKey(request.repoName) down. So a failed
      `runs show owner/repo x` prints `Run not found: owner__repo/x` on stderr, leaking D7's
      normalisation to the user on the error path. The happy path is clean: S6's renderers echo
      the requested alias by construction and never read the stored repoName.
      Options if fixed: (a) getRun catches RunNotFoundError and rethrows carrying the original
      alias -- a fourth core behaviour change, same class as D7; (b) branch per error type in the
      CLI, which AC-13 forbids; (c) accept it as a cosmetic leak on an error path only.
      Not fixed in S6: outside its scope, and the choice is the user's.
    severity: low
    status: open
    owner_stage: user decision, candidate for S9 or a follow-up story
  - id: risk-e6h1-011
    summary: >-
      QA finding F-4, confirmed by the orchestrator. `repo add` on a CLONED repo prints `-` where
      spec's behaviour table promised the resolved local path. register-repo.ts:84 computes
      `${deps.clonesDir}/${alias}` into a local variable and clones there, but the persisted
      RepoEntry carries `localPath` only when --local-path was supplied. S6 was right not to
      re-derive the path in a renderer -- that cascade belongs to core -- so the clean fix would
      be further core surface, which is unauthorised. Verify in S10's smoke, raise at S11.
    severity: low
    status: open
    owner_stage: S10 evidence, S11 decision
  - id: risk-e6h1-012
    summary: >-
      QA finding F-5. `review`'s outcome block omits the run id, so a user following up with
