      - id: approve
        label: Approve and continue to sddl-spec
        description: >-
          Proposal framing accepted; the B-level questions travel to spec, which must present
          them for decision rather than resolve them.
        recommended: true
      - id: revise
        label: Revise the proposal
        description: Reframe the problem, scope sketch, or open questions before spec.
      - id: stop
        label: Stop
        description: >-
          Halt the change -- e.g. if the run-persistence gap should be settled as a backlog
          question with the user before any further stage runs.
