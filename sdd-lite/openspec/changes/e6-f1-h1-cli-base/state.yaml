  spec: sdd-lite/openspec/changes/e6-f1-h1-cli-base/spec.md
  design: sdd-lite/openspec/changes/e6-f1-h1-cli-base/design.md
  plan: sdd-lite/openspec/changes/e6-f1-h1-cli-base/plan.md
  execution_log: sdd-lite/openspec/changes/e6-f1-h1-cli-base/execution-log.md
