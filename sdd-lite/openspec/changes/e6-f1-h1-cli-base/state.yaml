        reviewed_at: "2026-08-24T06:00:00Z"
        summary: >-
          Stage-mode review of S5, S6 and S7 (commits 41421c9, c00e210, 81cab90; frozen diff
          18 files, +2488/-5). Verdict pass: 0 blockers, 0 high, 0 medium, 2 low findings
