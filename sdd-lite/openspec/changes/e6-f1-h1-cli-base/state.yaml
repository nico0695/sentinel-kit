      with a ~/.sentinel default (D2), reviewTimeoutMs in GlobalConfigSchema plus a --timeout flag
      with flag > config precedence (D3), and commander as the only new runtime dependency (D4).
      Still open for spec to confirm: the H1/H2 exit-code boundary proposed in proposal.md
      (risk-e6h1-005).
  sddl-design:
