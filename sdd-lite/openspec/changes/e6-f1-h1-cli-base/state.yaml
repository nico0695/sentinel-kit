version: "0.1"
change_name: e6-f1-h1-cli-base
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E6.F1.H1] (issue #36), first story of the E6 milestone: replace the [E0.F1.H3]
    --version stub in src/main/cli.ts with the real composition root and build the CLI driving
    adapter (repo add|list, review, runs list|show, --version, --help). Bounded scope span --
    one driving adapter plus the composition root. Low ambiguity on the command surface: the
    backlog story and PRD §3.2 fix it, and every core use case it must call already exists with
    an explicit request/deps/result signature. Blast radius is real but contained: src/main/cli.ts
    is hot-path wiring and this is the first time the full dependency graph is assembled. Risk
    profile is medium: the change introduces the first runtime dependency since E0 (a B-level
    decision), and proposal-stage exploration surfaced three unowned integration facts -- the
    sentinel home path root, review's timeoutMs source, and run persistence (runReview has no
    RunStore dep and nothing calls store.save()).
  confidence: medium
  recorded_at: "2026-08-23T00:00:00Z"
lifecycle_status: planning
current_stage: sddl-proposal
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No blocking unknown requiring deep investigation. Lightweight proposal-stage exploration
      of the five core module indexes, the driven adapter factories, package.json and the stub
      composition root was sufficient to frame the change. The open items are decisions for the
      user, not facts to discover in the codebase.
  sddl-proposal:
    status: completed
    started_at: "2026-08-23T00:00:00Z"
    completed_at: "2026-08-23T00:00:00Z"
    notes: >-
      proposal.md written grounded in direct inspection of src/core/{repos,run,history,review,
      workspace}/index.ts (use-case signatures), src/core/repos/ports/config-schemas.ts
      (GlobalConfig has validationTimeoutMs but no review timeout), src/core/run/run-review.ts
