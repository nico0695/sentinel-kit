version: "0.1"
change_name: e6-f1-h1-cli-base
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E6.F1.H1] (issue #36), first story of the E6 milestone: replace the [E0.F1.H3]
    --version stub in src/main/cli.ts with the real composition root and build the CLI driving
    adapter (repo add|list, review, runs list|show, --version, --help). Bounded scope span --
    one driving adapter plus the composition root. Low ambiguity on the command surface: the
    backlog story and PRD §3.2 fix it, and every core use case it must call already exists with
    an explicit request/deps/result signature. Blast radius is real but contained: src/main/cli.ts
    is hot-path wiring and this is the first time the full dependency graph is assembled. Risk
    profile is medium: the change introduces the first runtime dependency since E0 (a B-level
    decision), and proposal-stage exploration surfaced three unowned integration facts -- the
    sentinel home path root, review's timeoutMs source, and run persistence (runReview has no
    RunStore dep and nothing calls store.save()).
  confidence: medium
  recorded_at: "2026-08-23T00:00:00Z"
lifecycle_status: implementing
current_stage: sddl-qa-review
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No blocking unknown requiring deep investigation. Lightweight proposal-stage exploration
      of the five core module indexes, the driven adapter factories, package.json and the stub
      composition root was sufficient to frame the change. The open items are decisions for the
      user, not facts to discover in the codebase.
  sddl-proposal:
    status: completed
    started_at: "2026-08-23T00:00:00Z"
    completed_at: "2026-08-23T00:00:00Z"
    notes: >-
      proposal.md written grounded in direct inspection of src/core/{repos,run,history,review,
      workspace}/index.ts (use-case signatures), src/core/repos/ports/config-schemas.ts
      (GlobalConfig has validationTimeoutMs but no review timeout), src/core/run/run-review.ts
      (RunReviewRequest/RunReviewDeps -- no RunStore, timeoutMs mandatory), the driven adapter
      factories in src/adapters/driven/*/index.ts, src/main/cli.ts (the stub), package.json
      (runtime deps: execa, yaml, zod) and docs/backlog-mvp-sentinel.md §E6 /
      docs/setup-tecnico-sentinel.md §4-§5.
  sddl-spec:
    status: completed
    started_at: "2026-08-23T22:00:00Z"
    completed_at: "2026-08-23T22:00:00Z"
    notes: >-
      spec.md written with D1-D4 treated as fixed inputs and formalized into acceptance criteria
      (AC-5 persistRun, AC-7 SENTINEL_HOME, AC-8 reviewTimeoutMs + --timeout precedence, AC-9
      commander as sole new dependency). 14 numbered acceptance criteria covering the six command
      paths, per-command --help (AC-2), the zero-logic rule (AC-1), stdout/stderr separation
      (AC-10) and the quality gate (AC-14). Two A-level items decided in this stage: the H1/H2
      boundary (AC-12 -- H1 owns review's full argument surface and exits 0 for any completed
      invocation; H2 owns the terminal-state-to-exit-code mapping, its configurability and the
      no-TTY guarantee) and processRunner wiring (AC-11 -- createExecProcessRunner is wired and
      declared validations run through the CLI review path). Two B-level questions are recorded
      unresolved for the user: OQ-1 (a --json output surface, recommendation = defer) and OQ-2
      (who composes the RunReviewRequest cascade, recommendation = a pure resolveReviewRequest
      helper exported from core/run, sibling to resolveEngine). Repo evidence re-verified for the
      spec: GlobalConfigSchema (validationTimeoutMs optional, no review timeout),
      DEFAULT_VALIDATION_TIMEOUT_MS = 120_000 in run-validations.ts (the pattern AC-8 mirrors with
      DEFAULT_REVIEW_TIMEOUT_MS = 600_000), RunRecord/RunSummary/RunStore shapes, RunReviewRequest/
      RunReviewDeps/RunReviewResult, the exported use-case request shapes, and that listBranches
      lives in core/repos with no command in this story.
  sddl-design:
    status: completed
    started_at: "2026-08-23T23:00:00Z"
    completed_at: "2026-08-23T23:00:00Z"
    notes: >-
      design.md written with D1-D6 as fixed inputs. Fixes the CLI adapter structure
      (createCli(deps) -> SentinelCli { run(argv): Promise<number> }, exitOverride +
      configureOutput bound to an injected CliIo, three command modules, four pure render
      modules), the composition root split (src/main/{cli,container,paths}.ts), the sentinel
      home layout under D2's root (config.yaml, repos.yaml, harnesses/, skills/, clones/,
      worktrees/, runs/) with resolveSentinelHome/sentinelPaths/resolvePackageRoot, persistRun's
      signature and RunRecord composition rules (diff reduced to RunDiffSummary via warning
      messages, failure reduced to {stage,message}), and resolveReviewRequest's signature with a
      per-field precedence table that calls resolveEngine internally. Six A-level decisions
      recorded (A-1 run(argv) facade, A-2 bound use-case thunks, A-3 throw instead of defaulting
      the harness, A-4 widen the adapters vitest include to src/main/**/__test__, A-5 loadContext
      thunk in container.ts rather than a third core use case, A-6 per-invocation engine
      construction). Status is partial because design surfaced OQ-D1, a real integration mismatch
      that gates safe planning: registerRepo's alias is `owner/repo` while
      RunRecordPathFieldsSchema/RunQueryFieldsSchema reject any repoName containing a path
      separator (RunStore.contract.ts AC-19), so review/runs would fail on every registered repo
      until someone owns the normalisation. Recommended option (a) normalises inside core/history
      with a module-private helper used by persistRun, listRuns and getRun -- no new public
      export, no signature change, but a behaviour change to two existing use cases, hence
      B-level. OQ-D2 (opencode's mandatory `model` with no config source; recommendation:
      SENTINEL_OPENCODE_MODEL read in container.ts) is non-blocking for planning.
    orchestrator_note: >-
      Returned partial on OQ-D1/OQ-D2; both resolved by the user at
      cp-design-integration-decisions as D7 and D8, so the stage is complete for routing purposes.
      design.md itself needs no rewrite: plan.md carries D7 and D8 as fixed inputs.
  sddl-plan:
    status: completed
    started_at: "2026-08-24T00:00:00Z"
    completed_at: "2026-08-24T00:00:00Z"
    notes: >-
      plan.md written against design.md with D1-D8 as fixed inputs. Eleven ordered stages:
      S1 tooling staged alone (commander in package.json, the widened adapters vitest include
      from design A-4, the one-line docs/testing.md update) so those touches never hide inside a
      feature diff; S2 core review-request resolution (reviewTimeoutMs field,
      DEFAULT_REVIEW_TIMEOUT_MS, resolveReviewRequest + barrel); S3 D7's module-private alias
      normaliser applied to listRuns/getRun, isolated in its own stage because it changes the
      observable behaviour of two use cases merged by [E5.F2.H2], with idempotency and
      no-separator tests; S4 persistRun on top of S3; S5-S7 the CLI adapter bottom-up (shell and
      error/help/version, then repo+runs commands, then review); S8 src/main/paths.ts alone
      (unit-testable, rides S1's widened include); S9 container.ts + cli.ts last, so a failure in
      the hot-path assembly points at wiring rather than logic; S10 the mandatory manual smoke for
      risk-e6h1-006 with its transcript recorded in execution-log.md; S11 a non-code closeout that
      declares D1, D5 and D7 as user-authorised widenings in the PR description and the history
      entry. Every stage must end with npm run check and npm test green and the existing 500 tests
      intact. Acceptance-criteria coverage is mapped stage by stage in the validation strategy;
      e2e/** stays empty per AC-14. S1-S9 each require stage_approval.
  sddl-executor:
    status: in_progress
    started_at: "2026-08-24T00:00:00Z"
    stages_completed:
      - S1
      - S2
      - S3
      - S4
      - S5
      - S6
      - S7
    notes: >-
      S1 (tooling prerequisites), S2 (review-request resolution in core) and S3 (D7 alias ->
      storage-key normalisation) completed under the batch-s1-s4 stage approval, one stage per
      invocation. S1: commander ^15.0.0 added to package.json dependencies (runtime deps now
      exactly commander, execa, yaml, zod -- AC-9), package-lock.json regenerated, the adapters
      vitest project include widened to also cover src/main/**/__test__/**/*.test.ts (design A-4),
      docs/testing.md updated; no source touched. S2 (D3 + D5): GlobalConfigSchema gains
      reviewTimeoutMs as z.number().optional() with no zod default (RepoEntrySchema untouched);
      new pure src/core/run/resolve-review-request.ts exports resolveReviewRequest plus
      DEFAULT_REVIEW_TIMEOUT_MS = 600_000 beside resolve-engine.ts, implementing design's per-field
      precedence table verbatim (timeout: --timeout > config > constant), doing the registry lookup
      itself (RepoNotFoundError via repos' public barrel) and calling resolveEngine internally so
      UnknownEngineError surfaces before any git or engine work; missing harness throws
      InvalidRunRequestError (design A-3, no invented default); the run barrel exports the function,
      the constant and its two input types (D5). 31 new core unit tests. S3 (D7): new
      module-private src/core/history/run-storage-key.ts exporting toRunStorageKey, which replaces
      every forward slash and backslash with a double underscore and is idempotent by construction;
      applied by list-runs.ts and get-run.ts to request.repoName only (run id untouched, signatures
      and result shapes unchanged); deliberately NOT exported from src/core/history/index.ts -- the
      rejected alternative in D7 -- so the storage-key rule stays inside the module owning the
      persistence contract. 12 new core unit tests (owner/repo to owner__repo, separator-free
      pass-through, idempotency, backslashes, multi-segment, empty string) and no pre-existing test
      edited; persist-run.ts was NOT created (that is S4) and RunStore.contract.ts was read but left
      untouched. Observation carried to S6/S7: RunSummary/RunRecord returned by the store still
      carry the normalised owner__repo in their own repoName field, so the renderer should echo the
      alias the user typed rather than that field. Gates after S3: npm run check exit 0 (biome 122
      files, tsc clean, depcruise 83 modules / 178 dependencies, 0 violations) and npm test exit 0
      with 543 tests across 30 files, up from 531/29, all 531 pre-existing tests still passing. S4
      (D1/AC-5): new src/core/history/persist-run.ts exporting persistRun with design's signature
      (PersistRunRequest{repoName, startedAtEpochMs, request, result}, PersistRunDeps{store, now?},
      PersistRunResult{runDir, record}); composes the RunRecord per design's rules -- harness/
      baseRef/targetRef from the request, state/verdict/prompt/engineOutput/usage from the result,
      engine = result.engineName ?? request.engineName, validationOutput from the request,
      durationMs = Math.max(0, now() - startedAtEpochMs), diff reduced to RunDiffSummary (counts
      plus warning messages, never a diff body) and failure reduced to {stage, message} with no
      cause, stack or exception object -- then calls RunStore.save() and returns the run directory.
      repoName is normalised through S3's module-private toRunStorageKey (A-level: RunRecord's
      repoName is the storage key the store's schema requires; risk-e6h1-009's user-facing echo
      stays a S6/S7 rendering concern). Exported from src/core/history/index.ts -- unlike S3's
      helper this one is public core API, since the CLI calls it. The only cross-module import is
      the type-only ../run/index.js, keeping core-modules-via-index clean. Two further A-level
      calls: PersistRunResult carries the composed record so review needs no getRun round-trip,
      and durationMs is clamped at 0 against a non-monotonic injected clock. 8 new core unit tests
      with a capturing in-memory RunStore fake. Gates after S4: npm run check exit 0 (biome 124
      files, tsc clean, depcruise 84 modules / 183 dependencies, 0 violations) and npm test exit 0
      with 551 tests across 31 files, up from 543/30, all 543 pre-existing tests still passing.
      This closes the approved batch-s1-s4; S5-S11 were not started.
      Details in execution-log.md. QA review still deferred until the S1-S4 batch is complete;
      S4 (persistRun) is next under the same approval.
      S5 (CLI shell) completed under cp-stage-approval-s5-s7, together with the user-approved
      F-1 addendum. New src/adapters/driving/cli/cli-deps.ts (CliIo, ReviewContext, CliUseCases,
      CliDeps), create-cli.ts (createCli(deps) returning SentinelCli.run(argv) -> Promise<number>,
      exitOverride and configureOutput bound to the injected CliIo and set before any subcommand so
      commander copies them, root name/description/-V --version and an addHelpText footer, plus the
      catch-all mapping CommanderError to err.exitCode and any other throwable to one rendered
      stderr line and exit 1), render/format-error.ts (formatErrorLine: message only, no stack, no
      cause, no per-error-type branching) and the index.ts barrel replacing export {}. run never
      calls process.exit and the adapter contains no executable reference to process at all -- only
      comments -- so every test drives it with a capturing CliIo and no global stubbing. 29 new
      adapter tests across help/version/errors plus one shared test-doubles module. A-level calls:
      createCli takes an optional second parameter (registrars, defaulting to the empty
      commandRegistrars) as the seam S6/S7 plug their command groups into and as the only way to
      exercise AC-13's catch-all while no command exists; formatErrorLine collapses newlines and
      falls back to the error name for an empty message; commander's multi-line output chunks are
      split into single CliIo lines; one test-support module instead of three copies. F-1: the
      vacuous not.toContain(diffBody) assertion in persist-run.test.ts was replaced by a comparison
      against JSON.stringify(diffBody).slice(1, -1) and verified to genuinely fail -- persist-run.ts
      was temporarily mutated to leak diff.files with the sibling toEqual neutralised, the new
      assertion failed on exactly that line, and both mutations were reverted. No other assertion
      touched and the file's test count is unchanged. Gates after S5: npm run check exit 0 (biome
      131 files, tsc clean, depcruise 88 modules / 192 dependencies, 0 violations) and npm test exit
      0 with 580 tests across 34 files, up from 551/31, all 551 pre-existing tests still passing.
      Carried forward: S7 must parse commander's string --timeout into a number before it type-checks
      against ResolveReviewRequestFlags.timeoutMs (no review option is declared in S5), and
      risk-e6h1-009 stays with the S6/S7 renderers since format-error.ts renders no repo name.
      S6-S11 were not started. Details in execution-log.md.
      S6 (repo + runs command groups) completed under the same cp-stage-approval-s5-s7 batch. New
      commands/repo-commands.ts (repo add -> registerRepo, repo list -> listRepos) and
      commands/runs-commands.ts (runs list -> listRuns, runs show -> getRun), new
      render/format-repos.ts (formatRepoLine: alias, url, baseBranch, harness; formatRegisterOutcome:
      alias, registered|already-registered, localPath) and render/format-runs.ts
      (formatRunSummaryLine: 11 fields; formatRunRecordBlock: 20 scalar key/value lines then
      count-prefixed diffWarnings / validationOutput / engineOutput sections), all tab-separated with
      a literal - for absent optionals and no colour and no --json (D4/D6). Both groups registered by
      turning commandRegistrars into [registerRepoCommands, registerRunsCommands] -- create-cli.ts is
      the only pre-existing file modified and its signature, exitOverride/configureOutput ordering and
      catch-all are untouched. 30 new adapter tests reusing S5's cli-test-doubles.ts, no new double.
      risk-e6h1-009 handled by construction: the renderers take the requested alias as a parameter and
      never read RunSummary.repoName / RunRecord.repoName (grep confirms repoName appears only on the
      request side), no denormalising helper was added and D7's input-only scope is unchanged; two
      regression guards assert owner__repo never reaches stdout and were mutation-verified (reading
      the stored field made exactly those tests fail; the mutation was reverted). A-level calls: repo
      add prints entry.localPath with - when absent rather than reconstructing ${clonesDir}/${alias}
      (that cascade is core's); the repo add record carries a status field so already-registered is
      honest and still machine-readable; runs show reports promptLineCount instead of dumping the
      prompt; multi-line values use count-prefixed sections rather than banners; neither command
      sorts or filters; an empty result prints nothing on stdout and one note on stderr, exit 0.
      Observation carried to QA/S7: RunNotFoundError's message is composed in core from the storage
      key, so a failed runs show renders Run not found: owner__repo/<id> on stderr -- a core
      message-composition concern outside S6's scope and not papered over in the adapter, since AC-13
      forbids per-error-type branching there. Gates after S6: npm run check exit 0 (biome 137 files,
      tsc clean, depcruise 92 modules / 203 dependencies, 0 violations) and npm test exit 0 with 610
      tests across 36 files, up from 580/34, all 580 pre-existing tests still passing. S7-S11 were not
      started. Details in execution-log.md.
      S7 (review command) completed under the same cp-stage-approval-s5-s7 batch, closing it. New
      commands/review-command.ts (review <repo> <branch> --type --engine --timeout) and
      render/format-review.ts (formatReviewOutcome -> the REVIEW_OUTCOME_FIELDS key/value block:
      repo, targetRef, state, verdict, engine, harness, durationMs, failureStage, failureMessage,
      runDir, with - for absent fields), registered by adding registerReviewCommand to
      commandRegistrars. The command body is a parse-and-delegate shell: loadContext ->
      resolveReviewRequest (core run barrel, D5) -> runReview -> persistRun (once, unconditionally,
      D1/AC-6) -> render; it holds no cascade, no registry lookup, no RunRecord composition and no
      process access. The four traps were handled explicitly: --timeout is parsed by a commander
      parseArg callback that throws InvalidArgumentError for anything that is not a positive whole
      number, so no NaN can reach ResolveReviewRequestFlags and an unusable value is a usage error
      with no use case called (trap 1); no terminal state is read for exit purposes anywhere in the
      adapter and no exit-code table was introduced -- the exit code still comes from commander or
      createCli's catch-all, and five tests pin exit 0 across engine-error, ambiguous, timeout,
      validation-failed and a request-changes verdict (trap 2 / AC-12); persistRun is called exactly
      once with the very request handed to runReview and the very result it returned (identity
      assertions) and is skipped only when no run was produced (trap 3 / AC-6); and the renderer
      takes the requested alias as a parameter and never reads record.repoName, with a guard
      asserting owner__repo appears in no rendered field except runDir, which is a genuine
      filesystem path derived from the storage key (trap 4 / risk-e6h1-009). AC-11 is covered on the
      command side: validations and validationTimeoutMs from the repo entry reach the runReview fake,
      with the config-level fallback tested too; wiring processRunner is S9's half. Four A-level
      calls: the outcome renders as a key/value block matching runs show rather than a one-line
      record; failureStage/failureMessage are fields rather than a stderr diagnostic so a piped
      consumer sees why a run failed; parseTimeoutMs also rejects 0, negatives and non-integers; and
      createTestDeps gained three optional overrides (loadContext, now, clonesDir) with byte-identical
      defaults instead of a second builder. All four guards were mutation-verified (state-derived exit
      code: 6 failed; skipping persistence for non-ok: 6 failed; unchecked Number(): 5 failed;
      rendering record.repoName: 1 failed) and every mutation reverted, with both gates re-run green.
      Gates after S7: npm run check exit 0 (biome 140 files, tsc clean, depcruise 94 modules / 209
      dependencies, 0 violations) and npm test exit 0 with 638 tests across 37 files, up from 610/36,
      all 610 pre-existing tests still passing. Two tsc errors in new fixtures were fixed rather than
      cast away (RunCleanupReason has no "policy" member; verdict: undefined violates
      exactOptionalPropertyTypes). No file under src/core/**, src/adapters/driven/** or src/main/**
      was touched. S8-S11 were NOT started and are not approved. Details in execution-log.md.
