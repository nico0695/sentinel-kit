complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E6.F1.H2] (issue #37), second story of the E6 milestone: give `sentinel review` a
    documented, tested exit-code contract so it is usable from a script without a TTY -- the seed
    of gate mode (PRD use case 6). Bounded scope: extends the existing `review` command plus a
    pure terminal-state -> exit-code mapping in the CLI driving adapter; no new core module and no
    new domain terminal state. The seam is explicit -- [E6.F1.H1] (merged PR #73) documented in
    code that `createCli.run()` returns 0 for any completed invocation and that `review-command.ts`
    renders `result.state` without interpreting it, both naming #37 as the owner of the mapping.
    Risk profile medium: the exit code is a two-axis function of the terminal state AND (when `ok`)
    the parsed verdict, which the backlog phrasing loosely collapses; the `--json` scope call and
    the commander signalling mechanism are open design tensions, and one touches public UX/config.
  confidence: medium
  recorded_at: "2026-08-28T00:00:00Z"
