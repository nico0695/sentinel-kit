decisions:
  - id: e6h2-D1
    level: B
    authorship: claude->user
    decided_at: "2026-08-28T00:00:00Z"
    title: Exit-code table model
    summary: >-
      The exit code is a two-axis function of the run. Exit 0 when the run passes: terminal state
      `ok` with verdict `approve` or `comment`. A single configurable non-zero code (default 1)
      when the run completes `ok` but the verdict is `request-changes` -- the gate-mode seed. A
      single operational-failure code 2 for every non-`ok` terminal state (`ambiguous`,
      `engine-error`, `timeout`, `validation-failed`). This lets a script distinguish "changes
      requested" (1) from "the tool could not produce a trustworthy verdict" (2). No sixth terminal
      state is introduced; the mapping lives in the CLI adapter, the states/verdict stay in core.
    rationale: >-
      Presented against a distinct-code-per-state alternative; user chose the leaner seed. Distinct
      codes per failure state remain a future gate-mode refinement, not needed for the seed.
  - id: e6h2-D2
    level: B
    authorship: claude->user
    decided_at: "2026-08-28T00:00:00Z"
    title: Configurable request-changes code -- flag only
    summary: >-
      The "configurable" non-zero code for `request-changes` is set by a per-invocation flag
      `--changes-exit-code <n>` (default 1). Setting it to 0 yields a soft gate. No config-schema
      key is added in this story; a global config default can be layered on later without breaking
      the flag.
    rationale: >-
      Presented against flag+config-key with flag>config>default precedence; user chose flag-only
      to keep the story a tight seed and avoid widening GlobalConfigSchema now. The scripting use
      case is per-invocation (the CI job owns its exit policy), which the flag serves directly.
  - id: e6h2-D3
    level: B
    authorship: claude->user
    decided_at: "2026-08-28T00:00:00Z"
    title: Defer --json out of H2
    summary: >-
      `--json` (machine-readable output) is deferred out of this story despite [E6.F1.H1] pointing
      it here. H2's acceptance is exit codes + no-TTY usability; exit codes alone make the command
      scriptable (a script branches on `$?`). Structured output becomes its own story or folds into
      `[E6.F2.H2]` (result rendering).
    rationale: >-
      Presented against including a minimal `--json`; user chose to defer, keeping H2 a focused,
      well-tested exit-code contract within its acceptance criteria.
  - id: e6h2-D4
    level: B
    authorship: claude->user
    decided_at: "2026-08-28T22:55:00Z"
    title: Fail closed (2) on an ok run with no verdict
    summary: >-
      An `ok` result carrying no verdict resolves to exit 2, not 0. Raised by the repo owner's
      PR #74 review; the orchestrator validated it as genuine (fail-open is the unsafe direction
      for a gate; an ok-without-verdict is the same untrustworthy case as `ambiguous`) and the
      user approved the fix. Unit test flipped to assert 2; a CLI integration test proves the
      inconsistent result does not pass the gate; spec AC-7 and design amended.
    rationale: >-
      Overturns the original inline-spec defensive default (0, "least surprising"). For the one
      consumer that matters -- a CI gate -- a run with no trustworthy verdict must be rejected, not
      passed silently. See risk-e6h2-006.
open_risks:
  - id: risk-e6h2-001
    summary: >-
      The backlog phrase "ok/approve=0, request-changes!=0" conflates two distinct domain axes:
      the exit code is a function of the terminal state AND, only when the state is `ok`, the
      parsed verdict. Spec must resolve this precisely and must not add a sixth terminal state or
      fold the verdict into the terminal-state union (PRD §4 domain contract).
    severity: medium
    direction_set_by: e6h2-D1 -- two-axis mapping decided, no sixth state; spec must encode it.
  - id: risk-e6h2-002
    summary: >-
      The mechanism for signalling a non-zero exit for a completed-but-non-approving run is
      non-obvious: `createCli.run()` returns 0 for any completed invocation and commander's action
      callback cannot easily return a value. The chosen route (typed gate signal, mutable exit-code
      channel on deps, or other) must keep the exit-code decision in the adapter without leaking
      domain logic into the command.
    severity: medium
    direction_set_by: >-
      RESOLVED in sddl-design -- a typed ReviewExitSignal thrown by the review action and
      translated by runProgram's existing catch (chosen over a mutable sink on deps). See design.md
      "Design Overview" and "Alternatives And Trade-Offs".
  - id: risk-e6h2-003
    summary: >-
      "Usable without a TTY" is asserted, not verified. The CLI routes output through the injected
      CliIo and appears TTY-free, but this needs a confirming test rather than an assumption.
    severity: low
    direction_set_by: >-
      RESOLVED in sddl-executor -- the AC-8 test ("resolves the exit code and full output through the
      injected io alone") drives a completed review through createCli with capturing IO doubles and no
      TTY, asserting both the rendered output and the returned exit code. Test is green.
  - id: risk-e6h2-004
    summary: >-
      Reduced fresh-context isolation on spec.md. The delegated sddl-spec worker was interrupted by
      a provider spend limit before writing anything, so the orchestrator authored spec.md inline.
      QA/review stages should scrutinize the spec as rigorously as a fresh worker's output, since
      the orchestrator both directed and wrote it.
    severity: low
    direction_set_by: >-
      RESOLVED in sddl-qa-review (final) -- the AC-9 persistence-dominates ordering and the two-axis
      table were independently re-derived from source (review-command.ts throw order + core/run
      RunReviewResult/TerminalState/Verdict) and confirmed correct. No spec defect surfaced under
      the extra scrutiny.
  - id: risk-e6h2-005
    summary: >-
      parseChangesExitCode accepts an empty or whitespace-only --changes-exit-code argument as a
      silent soft-gate 0 (Number("")===0 passes the 0-255 integer guard). In scripting this is a
      footgun: `--changes-exit-code "$UNSET"` turns a request-changes gate OFF (exit 0) instead of
      erroring. Violates no AC (AC-6 requires only non-numeric/out-of-range rejection; AC-5 requires
      0 accepted) and mirrors parseTimeoutMs's coercion, so it does not block this change.
    severity: low
    status: resolved
    direction_set_by: >-
      RESOLVED post-QA at the user's request before opening the PR. parseChangesExitCode now guards
      `raw.trim() === ""` and rejects a blank value as a usage error (InvalidArgumentError), so an
      empty/whitespace --changes-exit-code no longer silently becomes a soft gate. Covered by a new
      it.each(["", " "]) regression case in review.test.ts. Gate re-run green: npm run check clean,
      npm test 707/39 (705 + the 2 blank-value cases). parseTimeoutMs left unchanged (0 is already
      invalid there, so a blank value is rejected by its existing integer/positive guard).
  - id: risk-e6h2-006
    summary: >-
      resolveReviewExitCode originally failed OPEN on an `ok` result carrying no verdict:
      `verdict === "request-changes" ? C : 0` returned 0 (pass) for an absent verdict. For a CI
      gate that is the unsafe direction -- a run with no trustworthy verdict was passed silently.
      Raised by the repo owner's PR #74 4R review (verdict "cambios recomendados").
    severity: high
    status: resolved
    direction_set_by: >-
      RESOLVED at commit after PR #74 review. The mapping now fails CLOSED: `if (state !== "ok" ||
      verdict === undefined) return 2`. An `ok` with no verdict is treated as `ambiguous` -- the
      same "no trustworthy verdict -> 2" bucket -- rather than a silent pass. The prior unit test
      (which asserted 0) was flipped to assert 2, and a CLI-level integration test drives an
      `ok`+undefined-verdict result through createCli and asserts exit 2 (the reviewer's requested
      "inconsistent result must not pass the gate" proof). Mutation-verified: removing the guard
      turned that test red. Gate green: npm run check clean, npm test 708/39. This is exactly the
      class of defect risk-e6h2-004 predicted -- a defensive default chosen in the inline-authored
      spec, in the direction the QA (validating against that spec) did not challenge.
next_action:
  kind: complete
  target: orchestrator
  summary: >-
    Final QA passed: all 10 ACs met, AC-9 ordering and two-axis table correct under independent
