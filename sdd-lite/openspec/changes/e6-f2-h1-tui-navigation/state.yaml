version: "0.1"
change_name: e6-f2-h1-tui-navigation
objective: new-feature
mode: lite
execution_mode: interactive
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E6.F2.H1] (issue #38), first story of feature E6.F2 (TUI): an interactive navigation
    flow repo -> branch (with fetch) -> harness -> confirmation -> progress -> result, per the
    backlog and PRD. Acceptance: the complete flow without leaving the TUI, cancelable at every
    step, errors shown without raw stack traces. Bounded scope: fills the
    `src/adapters/driving/tui/` placeholder (currently `export {}`) as a driving adapter that
    invokes existing use cases only (listRepos, listBranches, runReview, harness listing per
    design) and is wired in `src/main/` — no new core module expected. Risk profile medium: this
    story introduces the first TUI runtime dependency (`@clack/prompts` is the setup-doc
    recommendation; design must ratify it), defines new public UX, and must reuse the review
    execution path [E6.F1.H1]/[E6.F1.H2] built for the CLI without duplicating logic; how the
    TUI entry point coexists with the commander CLI (default command vs subcommand) is an open
    B-level tension for spec/design.
  confidence: medium
  recorded_at: "2026-08-28T23:30:00Z"
lifecycle_status: formalizing
current_stage: sddl-proposal
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      No blocking unknown for routing. The seams are known: `adapters/driving/tui/index.ts` is a
      documented placeholder, the use cases the flow needs are exported from core module indexes,
      and `main/container.ts` is the single wiring point. Open items (dep ratification, entry
      point, cancel semantics, progress rendering) are spec/design decisions, not facts to
      discover.
  sddl-proposal:
    status: completed
    started_at: "2026-08-28T23:35:00Z"
    completed_at: "2026-08-28T23:40:00Z"
    notes: >-
      proposal.md written by a fresh delegated worker, grounded in the backlog E6.F2 section, PRD
      §3.1/§3.2/§4.1-4.3, setup doc §4 (clack recommendation), and direct reads of the code seams
      (tui/index.ts placeholder, create-cli.ts, cli-deps.ts, review-command.ts, main/cli.ts,
      main/container.ts, core repos/run indexes). Scope: fill the TUI placeholder driving only
      existing use cases (listRepos, listBranches, resolveReviewRequest, runReview, persistRun)
      with a TuiDeps-style injection seam mirroring the CLI, wired only in src/main/. OUT: result
      rendering detail ([E6.F2.H2]), sentinel open ([E6.F2.H3] optional), mid-run abort. e6f2h1-D0
      (CLAUDE.md refresh before PR) carried in the scope sketch. Seven open questions surfaced
      (three B-level: entry point, dep ratification, cancel semantics), none decided.
decisions:
  - id: e6f2h1-D0
    level: A
    authorship: user
    decided_at: "2026-08-28T23:30:00Z"
    title: CLAUDE.md refresh is the mandatory last step before the PR
    summary: >-
      User directive at change kickoff: before opening the PR for this change, update CLAUDE.md
      with everything necessary — at minimum the stale "Current state: pre-implementation" section
      (the repo has a full toolchain, src/ tree, and a working CLI since E0..E6.F1.H2 landed) and
      whatever this story itself changes (TUI adapter, new runtime dep, commands). The plan must
      carry this as an explicit final stage before PR creation.
    rationale: >-
      CLAUDE.md still describes the repo as having no commits, no package.json and no src/, which
      contradicts repo reality and misleads every future session. Recorded verbatim as a user
      decision so it survives stage handoffs.
  - id: e6f2h1-D1
    level: B
    authorship: claude->user
    decided_at: "2026-08-28T23:50:00Z"
    title: TUI entry point — bare `sentinel` on a TTY
    summary: >-
      Running `sentinel` with no subcommand on an interactive TTY launches the TUI navigation
      flow. When stdin is not a TTY, the command does not hang or crash: it prints guidance
      pointing to `sentinel review` (scripting surface) instead. This replaces the current
      commander default of printing help on no command; `--help`, `--version` and every existing
      subcommand keep working unchanged.
    rationale: >-
      Presented against a `sentinel tui` subcommand; user chose bare invocation. Matches the PRD
      positioning: the TUI is the primary interactive surface and the CLI is the "equivalent
      direct command for scripting" (PRD §3.1-G).
  - id: e6f2h1-D2
    level: B
    authorship: claude->user
    decided_at: "2026-08-28T23:50:00Z"
    title: TUI library is ratified at design time, not pre-approved
    summary: >-
      `@clack/prompts` is NOT pre-ratified. sddl-design must compare real alternatives (at least
      @clack/prompts vs @inquirer/prompts vs native readline-based prompts) against this story's
      needs — per-step cancel, spinner, testability seam, ESM/Node>=22 fit, dependency weight —
      and ratify one with recorded justification, per the setup doc's own re-evaluation rule.
    rationale: >-
      User chose evaluation over pre-ratification when offered clack directly. The spec must
      therefore stay library-agnostic: acceptance criteria describe behavior (prompts, cancel,
      spinner) without naming a package.
  - id: e6f2h1-D3
    level: B
    authorship: claude->user
    decided_at: "2026-08-28T23:50:00Z"
    title: Cancel semantics — pre-run only
    summary: >-
      "Cancelable at every step" means every navigation prompt (repo, branch, harness,
      confirmation) can be cancelled with a clean, friendly exit and no side effects. Once the
      confirmed review run starts, there is no interactive mid-run abort in this story; the
      engine timeout already bounds the run. Mid-run abort (signal/AbortSignal through the use
      case and engine adapter, worktree cleanup on abort) is a possible future story.
    rationale: >-
      Presented against implementing mid-run abort; user chose the bounded reading. Keeps the
      story inside the TUI adapter without widening runReview's contract.
open_risks:
  - id: risk-e6f2h1-001
    summary: >-
      First TUI runtime dependency: `@clack/prompts` (+ possibly picocolors) is only a
      recommendation in docs/setup-tecnico-sentinel.md §4 and must be re-evaluated and ratified
      (or replaced) with justification at design time, per the setup doc's own rule.
    severity: medium
  - id: risk-e6f2h1-002
    summary: >-
      Reuse boundary with the CLI review path: the TUI must drive the same use cases and reuse the
      [E6.F1.H1]/[E6.F1.H2] execution/rendering seams without duplicating command logic or leaking
      domain logic into the TUI (use cases are the only core API). Where rendering is shared
      between CLI and TUI is a design decision; adapters must not import other adapters.
    severity: medium
  - id: risk-e6f2h1-003
    summary: >-
      "Progress" step semantics are undefined: runReview is a single awaited use case; what the
      TUI can honestly display (spinner vs staged progress) and what "cancelable at every step"
      means once the engine run has started (pre-run cancel vs mid-run abort) needs a firm spec
      boundary. Mid-run abort may exceed this story's scope.
    severity: medium
checkpoints:
  - id: cp-proposal-tui-flow
    type: phase_validation
    stage: sddl-proposal
    summary: >-
      proposal.md is ready for spec. The change is bounded (continue-lite): fill the TUI driving
      adapter with the guided flow repo -> branch -> harness -> confirmation -> progress -> result
      over existing use cases only, wired in src/main/. Three B-level questions are put to the
      user at this checkpoint: entry point (bare `sentinel` on a TTY vs a `tui` subcommand), the
      first TUI runtime dependency (`@clack/prompts` ratification), and the cancel-semantics
      boundary once the engine run has started. A-level questions (progress display shape, shared
      rendering placement, harness enumeration source, non-TTY fallback) are deferred to
      spec/design.
    question: >-
      Approve the proposal and continue to sddl-spec, revise this phase, or stop? Plus the three
      B-level decisions above.
    free_input_allowed: true
    created_at: "2026-08-28T23:40:00Z"
    status: resolved
    resolved_at: "2026-08-28T23:50:00Z"
    resolution: >-
      Approved. The three B-level questions were decided by the user at this checkpoint as
      e6f2h1-D1 (bare `sentinel` on a TTY launches the TUI), e6f2h1-D2 (do NOT pre-ratify
      @clack/prompts — sddl-design must compare alternatives and ratify with justification) and
      e6f2h1-D3 (cancel is pre-run only; no mid-run abort in this story). Routing to sddl-spec.
