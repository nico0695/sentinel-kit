      transitive copy in `node_modules` (1.1.1, CJS, `export =`): `isColorSupported` is a
      load-time snapshot that `NO_COLOR` forces off and that `FORCE_COLOR` **or a bare `CI` env
      var** forces on — so pure tests inject `PLAIN_PALETTE` and flow tests compare through a new
      `stripAnsi` helper in `tui-test-doubles.ts`, making AC-14's two env runs assert identical
      strings. Spec A7 VERIFIED against the code, not assumed: `TuiPrompter.confirm` already
      exists (`tui-deps.ts:95`) and `createTuiDeps` (`container.ts:281`) needs no edit, so
      `src/main/**` is untouched. The post-run prompt is one `offerFullView` helper called at the
      end of BOTH `persistRun` branches (spec A6), after the try/catch settles (AC-11), returning
      void so the two `return 0` / `return 1` statements are untouched (AC-10); its blank-guard is
      what keeps the four other TUI suites valid (verified: no TUI test outside `result.test.ts`
