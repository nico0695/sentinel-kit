      and all ten original A-level decisions stand unreopened: the module split, the
      required-argument palette, the four roles, blocker-before-major grouping, label padding
      before colouring and `node:path.join` are unchanged. Mechanism: ONE new pure module
      `src/adapters/driving/tui/engine-text.ts` (zero imports, the `findings.ts` shape) exporting
      `splitEngineLines(markdown)`, `neutralizeControls(text)` and `toSafeLines(markdown)`; the
      order split -> neutralise -> match -> colour is load-bearing, because the palette's own SGR
      is added AFTER neutralisation and so is never escaped. `render.ts` computes
      `toSafeLines(md)` once per digest and shares it with the findings section;
      `extractFindings` changes signature to take `readonly string[]` (keeps `findings.ts` at
      zero imports and makes the ordering explicit and single-sourced rather than hidden);
      `matchFindingLine` keeps its signature and gains a documented already-neutralised
      precondition, safe to re-apply because neutralisation is idempotent. Empirical section A-1
      records six probes run against the target's own modules before writing: R1-003 reproduced
      (interior CR / U+2028 / U+2029 each return NO MATCH against the shipped regex while the
      tested trailing-CR case still matches, which is why it survived review); `([^\n]*)` alone
      restores the match but carries the RAW control into the printed text, so it fixes the
      disappearance and leaves the injection; neutralise-then-match fixes both with the regex
      untouched; neutralisation is idempotent and byte-transparent on clean input, which is what
      preserves every existing fixture assertion; CRLF splitting is line-count-safe; and
      `picocolors.js:22` (`let f = enabled ? formatter : () => String`) makes
      `TUI_PALETTE.good === String` true under the local gate, confirming R3-002 at source while
      `createColors(true)` is available for a deterministic alternative. Two A-level exclusions
      from the neutralised set are argued rather than assumed: LF (the splitter's separator) and
      HT (forward-only, cannot reposition, erase or introduce a sequence, and escaping it would
      render every quoted code excerpt unreadable). The token mapping is deliberately NOT
      injective — a literal `\x1b` in the source and a real ESC render alike — because making it
      injective would require escaping the backslash and mangling every path and regex in a
      review; what matters is that nothing executes and nothing is lost, not invertibility. The
      CRLF terminator is dropped rather than escaped so a CRLF review does not show `\x0d` on
      every line; a LONE CR is neutralised. A-7 offers two admissible mechanisms per test repair
      with a recommendation (deterministic `MARKED` palette for R3-002; a file-scoped
      `vi.mock("../colors.js")` for R3-001, already house-style in the engine adapter suites and
      explicitly NOT via `TuiDeps`, which would reopen a rejected alternative and edit
      `src/main/container.ts`). Placement is argued: the neutraliser stays in the TUI adapter
      because `adapters-isolated` forbids driving -> driving imports, so sharing it with the
      CLI's `format-runs.ts:188` would need either a sixth guard exemption or a second copy —
      the same reasoning that keeps `formatTuiErrorLine` duplicated (Q9). Zero `src/core/**`,
      zero `src/main/**`, zero `tui-deps.ts`, zero `package.json`, no new dependency.
