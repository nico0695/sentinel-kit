      anywhere in the domain — `Verdict` is a three-value union and no findings field exists —
      they appear only as free text following the factory harnesses' `[SEV: blocker|major|minor|nit]`
      prompt convention, which a real engine fixture confirms is honored in practice. Nine open
      questions raised (four B-level: rendering depth, runtime dep, where finding extraction lives,
      CLI scope), none decided.
