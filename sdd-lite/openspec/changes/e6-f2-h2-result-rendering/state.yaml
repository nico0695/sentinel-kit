      install-and-confirm gate plus baseline confirmation (D6 binding order, residual
      risk-e6f2h2-007); S2 `findings.ts` + the AC-3 matrix; S3 `colors.ts` (the only picocolors
      importer) + the test-side `stripAnsi`; S4 `render.ts` ADDITIVE (`formatResultDigest` /
      `formatFullView` land with their pure tests while `formatTuiResult` is retained one stage);
