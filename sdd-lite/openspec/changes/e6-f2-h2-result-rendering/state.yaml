  kind: wait_for_approval
  target: cp-proposal-result-rendering
  summary: >-
    Present the proposal checkpoint to the user: approve and route to sddl-spec, revise, or stop —
    and decide the four B-level questions (rendering depth, runtime dependency, where finding
    extraction lives, CLI scope). On approval the next stage is sddl-spec, which must formalize
    the ACs, resolve the five A-level questions, and explicitly supersede `[E6.F2.H1]` AC-7.
