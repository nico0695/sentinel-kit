      `split("\n")` (not `/\r?\n/`, which would break AC-12 on CRLF), label padding before
      colouring, and `node:path.join` for the `Full review` line are all fixed in the artifact.
      All 17 ACs mapped to a mechanism and a file. Ten A-level decisions recorded; no level-C item
