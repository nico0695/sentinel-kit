  review_ledger: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/review-ledger.md
checkpoints:
  - id: cp-proposal-result-rendering
    type: phase_validation
    stage: sddl-proposal
    summary: >-
      proposal.md is ready for spec. The change stays continue-lite: rewrite the TUI result surface
      `[E6.F2.H1]` deliberately left minimal so a finished review shows its verdict, its blocking
      findings and the persisted run path at a glance. Exploration confirmed every input is already
      in the adapter's hands (raw engine markdown, verdict, failure, run directory), so no core
      change is required for the recommended shape. Four B-level questions gate the spec: (Q1) how
      much markdown is rendered — compact digest vs full styled render; (Q2) whether a runtime dep
      lands (`picocolors` and/or `marked-terminal`, both declared-only recommendations); (Q3) where
      severity/finding extraction lives, given that blockers are free text following a harness
      prompt convention and NOT structured domain data — an adapter-side heuristic keeps the story
      presentational, a core findings parser would be scope expansion (level C); (Q4) whether the
      CLI shares this surface or the story stays TUI-only. Five A-level questions (superseding H1
      AC-7's pinned assertions, non-`ok` and `ambiguous` rendering, run-path shape, long-output
      policy, the `formatTuiErrorLine` duplication revisit) are recorded with recommendations for
      the spec to resolve.
    question: >-
      Approve the proposal and continue to sddl-spec, revise this phase, or stop? Plus the four
      B-level decisions above — Q3 in particular, because answering it "core findings model"
      changes the story's nature rather than its detail.
    free_input_allowed: true
    created_at: "2026-08-29T15:35:00Z"
decisions: []
open_risks:
  - id: risk-e6f2h2-001
    summary: >-
      "Blockers visible at a glance" rests on a prompt convention, not a contract. The domain
      carries no findings model: `Verdict` is `approve | request-changes | comment` and blockers
      exist only as free text inside `engineOutput`. The factory harnesses' `output.md` pins
      `[SEV: blocker|major|minor|nit] <file>:<line> — <summary>` and a real engine fixture honors
      it, but user-authored harnesses may declare any output contract and an engine may simply not
      comply (that is what the `ambiguous` state exists for). Any extraction the renderer performs
      must degrade gracefully to plain output instead of showing nothing or lying.
    severity: medium
  - id: risk-e6f2h2-002
    summary: >-
      Possible new runtime dependency: `picocolors` and/or `marked + marked-terminal` are
      declared-only recommendations in docs/setup-tecnico-sentinel.md §4 (marked-terminal is
      flagged optional there and in the backlog), and neither is installed. Adding a runtime dep is
      a B-level decision ratified at design with justification, per the `[E6.F2.H1]` precedent —
      not pre-approved by this proposal.
    severity: medium
  - id: risk-e6f2h2-003
    summary: >-
      This story must supersede acceptance criteria of a completed story. `[E6.F2.H1]` AC-7 pinned
      the minimal `State:`/`Verdict:`/`Run directory:` block as the literal tail of stdout
      (asserted via `slice(-3)` in `tui/__test__/result.test.ts`) precisely so no H2 surface could
      slip in early. Rewriting those assertions is expected and sanctioned by H1's own doc comment,
      but it must be an explicit, recorded supersession — never a silent test edit.
    severity: low
  - id: risk-e6f2h2-004
    summary: >-
      Scope-creep vector into the core. If the spec decides that finding/severity extraction is
      domain knowledge (a structured findings model beside the verdict parser in `src/core/run/`),
      the blast radius jumps from one presentation adapter to a core hot path and the story stops
      being `[E6.F2.H2]`. Treat that outcome as level C — stop and ask — rather than absorbing it.
    severity: medium
