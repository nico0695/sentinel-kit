      AMENDMENT 1 (2026-08-30, fix round 1 of 2; authority: user decision e6f2h2-D12 at
      cp-review-gate-round-1). spec.md AMENDED, not rewritten — every original criterion stays
      readable with its supersession marked inline ([E5.F1.H2] design Amendment 1 precedent).
      Cause: this story created the first path by which engine output (the stdout of an external
      agent reviewing possibly untrusted code) reaches the user's terminal, with no
      control-character handling at any layer. AC-12 was the reason the spec had to reopen at
      all: it MANDATED `stripAnsi(emitted) === engineOutput.split("\n")` and the suite asserted
      it, so any sanitisation contradicted the accepted contract. AC-12's byte-verbatim identity
      is SUPERSEDED and replaced by printable-text fidelity — the intent it was protecting —
      restated as three testable properties: (a) completeness (emitted line count equals
      `md.split("\n").length`, element i from source line i; nothing dropped, merged, elided or
      reordered), (b) restricted identity (the ORIGINAL equality still holds byte-for-byte on
      every input carrying no control code point, so the old contract is narrowed rather than
      discarded), (c) non-executability (no code point of the neutralised set survives, once the
      palette's own SGR is stripped). Four criteria added: AC-18 the neutralisation contract
      (set N = C0 except LF and HT, DEL, C1 incl. 8-bit CSI/OSC, U+2028/U+2029; visible
      `\xNN` / `\uNNNN` tokens; properties P1 visibility, P2 idempotence, P3 transparency;
      `splitEngineLines` consumes one trailing CR per line so the element count is exactly
      `split("\n").length`), AC-19 R1-003 (a finding whose text carries an interior control
      character or line separator is never silently absent from BOTH the counts and the list —
      closed at two independent layers, neutralise-before-match AND the remainder group widened
      from `(.*)` to `([^\n]*)`, each asserted separately), AC-20 R3-002 + R3-001 (AC-14's
      verification made non-vacuous: no decoration assertion may use the ambient `TUI_PALETTE`,
      which is global `String` under the mandated local gate, and the flow's palette choice must
      be observable at all three call sites), AC-21 R2-001 (four bare AC citations in
      `tui-flow.ts` qualified as [E6.F2.H2]). AC-2, AC-3, AC-6, AC-13 and AC-14 amended in
      place. AC-3's PARSING tolerance is explicitly preserved — the remainder is still never
      re-split, so `file:line` ranges, em-dashes, plain hyphens and no separator all survive;
      only its RENDERING changes, so "verbatim" now means "never re-parsed, re-split,
      summarised, truncated or reordered", not "byte-identical". A third engine-derived channel
      was found that the ledger did not name and is now covered by AC-6: claude-code's
      `buildReviewErrorMessage` (`engines/claude-code/envelope.ts:63-65`) returns
      `envelope.result` — the engine's own text — VERBATIM as the error message on the
      `is_error` path, and it reaches the digest's `Failure:` line, which [E6.F2.H1]'s block did
      not have; `collapseToOneLine`'s `/\s*\n\s*/g` removes neither ESC nor a lone CR. Two
      assertions change by name and must be called out in the PR beside AC-15's supersession:
      `result.test.ts:900` (`["a\r", "b"]` -> `["a", "b"]`) and `findings.test.ts:223` (the
