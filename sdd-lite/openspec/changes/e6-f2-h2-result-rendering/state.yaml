version: "0.1"
change_name: e6-f2-h2-result-rendering
# The orchestrator's handoff objective was `implementer`; `state.schema.yaml` has no such
# enum member, so the schema-valid equivalent for a backlog feature story is recorded here
# (the same mapping `[E6.F2.H1]` used). Intent is unchanged: this change runs through
# execution, it does not stop at plan.
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E6.F2.H2] (issue #39), last required story of E6 and of feature E6.F2 (TUI): render a
    readable review result on completion plus the location of the persisted run. Bounded scope
    span — one driving adapter surface (`src/adapters/driving/tui/render.ts`, its two call sites
    in `tui-flow.ts`, and `__test__/result.test.ts`), which `[E6.F2.H1]` deliberately left minimal
    and documented as this story's to rewrite. Presentation-layer blast radius: proposal-stage
    exploration confirms the review markdown, verdict, failure and run directory already reach the
    TUI in memory, so no core change is required for the recommended shape. Medium ambiguity, all
    of it at the spec/design boundary: how much markdown rendering (digest vs full styled render),
    whether a runtime dep lands (`picocolors` / `marked-terminal`, declared-only in setup §4),
    whether the CLI shares the surface, and — the load-bearing one — where severity/finding
    extraction lives, since blockers are free text following a harness prompt convention rather
    than structured domain data. Risk low-medium.
  confidence: medium
  recorded_at: "2026-08-29T15:20:00Z"
lifecycle_status: implementing
current_stage: sddl-executor
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      Not required for routing. The four material unknowns the orchestrator named were resolved by
      bounded targeted reads inside the proposal stage itself (core/run result shape, history
      persist path and on-disk layout, CLI renderers, verdict/finding model plus the factory
      harness `output.md` contract and a real engine fixture). Everything still open is a
      spec/design decision, not a fact to discover.
  sddl-proposal:
    status: completed
    started_at: "2026-08-29T15:20:00Z"
    completed_at: "2026-08-29T15:35:00Z"
    notes: >-
      proposal.md written by a fresh delegated worker, grounded in the backlog E6.F2.H2 entry,
      issue #39, and direct reads of `src/core/run/{index,run-review,verdict,terminal-state}.ts`,
      `src/core/run/ports/review-engine.ts`, `src/core/history/{persist-run,ports/run-store}.ts`,
      `src/adapters/driven/storage/run-store-fs.ts`, `src/adapters/driving/tui/{render,tui-flow}.ts`
      and its `__test__/result.test.ts`, `src/adapters/driving/cli/render/format-review.ts`,
      `harnesses/{pr-review,quick,security}/output.md`, and `fixtures/claude-code/valid-verdict.json`.
      Key findings: (1) the raw review markdown IS in memory at the TUI result step
      (`RunReviewResult.engineOutput`, also on `RunRecord`), so no core change is needed to render
      it; (2) `persistRun` returns the absolute run directory and the on-disk layout is
      `metadata.json` + `result.md` (raw engine output) + `prompt.md` + `validations/`; (3) the CLI
      block is deliberately machine-parseable `key<TAB>value`, so a human-facing TUI renderer does
      not grow H1's ~10-line `formatTuiErrorLine` duplication; (4) blockers are NOT structured data
      anywhere in the domain — `Verdict` is a three-value union and no findings field exists —
      they appear only as free text following the factory harnesses' `[SEV: blocker|major|minor|nit]`
      prompt convention, which a real engine fixture confirms is honored in practice. Nine open
      questions raised (four B-level: rendering depth, runtime dep, where finding extraction lives,
      CLI scope), none decided.
  sddl-spec:
    status: completed
    started_at: "2026-08-29T15:50:00Z"
    completed_at: "2026-08-29T16:10:00Z"
    notes: >-
      spec.md written by a fresh delegated worker over the four firm decisions (e6f2h2-D1..D4),
      which were encoded and not reopened. 17 acceptance criteria, each naming the mechanism and
      the test that verifies it (the `[E6.F2.H1]` bar). Grounded in direct reads of
      `src/core/run/run-review.ts` (RunReviewResult / RunFailure / RunStage),
      `src/core/history/ports/run-store.ts` (RunRecord carries `engineOutput` and a reduced
      `failure.message`), `src/adapters/driven/storage/run-store-fs.ts` (result.md is written ONLY
      when `record.engineOutput !== undefined`), `src/adapters/driving/tui/{render,tui-flow,tui-deps}.ts`
      and `__test__/{result.test.ts,tui-test-doubles.ts}`,
      `src/adapters/driving/cli/render/format-review.ts`, all three `harnesses/*/output.md`
      (verified identical — one contract for the heuristic to target),
      `fixtures/claude-code/valid-verdict.json`, `.dependency-cruiser.cjs`, `package.json`, and the
      `[E6.F2.H1]` spec's AC-7. Nine A-level questions resolved (e6f2h2-A1..A9): Q5 supersession of
      H1 AC-7 made explicit (AC-15), Q6 answered by keying markdown-dependent output on
      `engineOutput` presence rather than on the terminal state (the parse-fault path carries both
      `engineOutput` and `failure`), Q7 gating the `result.md` pointer on exactly what run-store-fs
      writes, Q8 no pager/no truncation, Q9 duplication revisit performed and kept; plus four new
