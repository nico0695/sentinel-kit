      AMENDMENT 1 (2026-08-30, folded into the sddl-spec amendment pass under e6f2h2-D12).
      design.md gains a §Amendment 1 section (A-1..A-9) and inline supersession markers on the
      three passages the amendment invalidates (the "Full view" paragraph's byte-verbatim
