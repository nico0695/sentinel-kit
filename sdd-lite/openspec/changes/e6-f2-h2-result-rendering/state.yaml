version: "0.1"
change_name: e6-f2-h2-result-rendering
# The orchestrator's handoff objective was `implementer`; `state.schema.yaml` has no such
# enum member, so the schema-valid equivalent for a backlog feature story is recorded here
# (the same mapping `[E6.F2.H1]` used). Intent is unchanged: this change runs through
# execution, it does not stop at plan.
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E6.F2.H2] (issue #39), last required story of E6 and of feature E6.F2 (TUI): render a
    readable review result on completion plus the location of the persisted run. Bounded scope
    span — one driving adapter surface (`src/adapters/driving/tui/render.ts`, its two call sites
    in `tui-flow.ts`, and `__test__/result.test.ts`), which `[E6.F2.H1]` deliberately left minimal
    and documented as this story's to rewrite. Presentation-layer blast radius: proposal-stage
    exploration confirms the review markdown, verdict, failure and run directory already reach the
    TUI in memory, so no core change is required for the recommended shape. Medium ambiguity, all
    of it at the spec/design boundary: how much markdown rendering (digest vs full styled render),
    whether a runtime dep lands (`picocolors` / `marked-terminal`, declared-only in setup §4),
    whether the CLI shares the surface, and — the load-bearing one — where severity/finding
    extraction lives, since blockers are free text following a harness prompt convention rather
    than structured domain data. Risk low-medium.
  confidence: medium
  recorded_at: "2026-08-29T15:20:00Z"
lifecycle_status: planning
current_stage: sddl-spec
stages:
  sddl-deep-explorer:
    status: skipped
    notes: >-
      Not required for routing. The four material unknowns the orchestrator named were resolved by
      bounded targeted reads inside the proposal stage itself (core/run result shape, history
      persist path and on-disk layout, CLI renderers, verdict/finding model plus the factory
      harness `output.md` contract and a real engine fixture). Everything still open is a
      spec/design decision, not a fact to discover.
  sddl-proposal:
    status: completed
    started_at: "2026-08-29T15:20:00Z"
    completed_at: "2026-08-29T15:35:00Z"
    notes: >-
      proposal.md written by a fresh delegated worker, grounded in the backlog E6.F2.H2 entry,
      issue #39, and direct reads of `src/core/run/{index,run-review,verdict,terminal-state}.ts`,
      `src/core/run/ports/review-engine.ts`, `src/core/history/{persist-run,ports/run-store}.ts`,
      `src/adapters/driven/storage/run-store-fs.ts`, `src/adapters/driving/tui/{render,tui-flow}.ts`
      and its `__test__/result.test.ts`, `src/adapters/driving/cli/render/format-review.ts`,
      `harnesses/{pr-review,quick,security}/output.md`, and `fixtures/claude-code/valid-verdict.json`.
      Key findings: (1) the raw review markdown IS in memory at the TUI result step
      (`RunReviewResult.engineOutput`, also on `RunRecord`), so no core change is needed to render
      it; (2) `persistRun` returns the absolute run directory and the on-disk layout is
      `metadata.json` + `result.md` (raw engine output) + `prompt.md` + `validations/`; (3) the CLI
      block is deliberately machine-parseable `key<TAB>value`, so a human-facing TUI renderer does
      not grow H1's ~10-line `formatTuiErrorLine` duplication; (4) blockers are NOT structured data
      anywhere in the domain — `Verdict` is a three-value union and no findings field exists —
      they appear only as free text following the factory harnesses' `[SEV: blocker|major|minor|nit]`
      prompt convention, which a real engine fixture confirms is honored in practice. Nine open
      questions raised (four B-level: rendering depth, runtime dep, where finding extraction lives,
      CLI scope), none decided.
  sddl-spec:
    status: completed
    started_at: "2026-08-29T15:50:00Z"
    completed_at: "2026-08-29T16:10:00Z"
    notes: >-
      spec.md written by a fresh delegated worker over the four firm decisions (e6f2h2-D1..D4),
      which were encoded and not reopened. 17 acceptance criteria, each naming the mechanism and
      the test that verifies it (the `[E6.F2.H1]` bar). Grounded in direct reads of
      `src/core/run/run-review.ts` (RunReviewResult / RunFailure / RunStage),
      `src/core/history/ports/run-store.ts` (RunRecord carries `engineOutput` and a reduced
      `failure.message`), `src/adapters/driven/storage/run-store-fs.ts` (result.md is written ONLY
      when `record.engineOutput !== undefined`), `src/adapters/driving/tui/{render,tui-flow,tui-deps}.ts`
      and `__test__/{result.test.ts,tui-test-doubles.ts}`,
      `src/adapters/driving/cli/render/format-review.ts`, all three `harnesses/*/output.md`
      (verified identical — one contract for the heuristic to target),
      `fixtures/claude-code/valid-verdict.json`, `.dependency-cruiser.cjs`, `package.json`, and the
      `[E6.F2.H1]` spec's AC-7. Nine A-level questions resolved (e6f2h2-A1..A9): Q5 supersession of
      H1 AC-7 made explicit (AC-15), Q6 answered by keying markdown-dependent output on
      `engineOutput` presence rather than on the terminal state (the parse-fault path carries both
      `engineOutput` and `failure`), Q7 gating the `result.md` pointer on exactly what run-store-fs
      writes, Q8 no pager/no truncation, Q9 duplication revisit performed and kept; plus four new
      A-level resolutions (A6 full view offered on the persist-failure branch too, A7 reuse of the
      existing `confirm` seam with no `TuiPrompter` change, A8 severity-marker-only heuristic
      carrying the line remainder verbatim, A9 blank-vs-absent `engineOutput`). No level-C item
      arose: no acceptance criterion requires touching `src/core/**`. No new B-level question
      arose. Two new risks appended (005, 006).
  sddl-design:
    status: pending
  sddl-plan:
    status: pending
  sddl-executor:
    status: pending
  sddl-qa-review:
    status: pending
artifacts:
  state: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/state.yaml
  proposal: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/proposal.md
  spec: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/spec.md
  design: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/design.md
  plan: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/plan.md
  execution_log: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/execution-log.md
  qa_report: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/qa-report.md
  review_ledger: sdd-lite/openspec/changes/e6-f2-h2-result-rendering/review-ledger.md
checkpoints:
  - id: cp-proposal-result-rendering
    type: phase_validation
    stage: sddl-proposal
    summary: >-
      proposal.md is ready for spec. The change stays continue-lite: rewrite the TUI result surface
      `[E6.F2.H1]` deliberately left minimal so a finished review shows its verdict, its blocking
      findings and the persisted run path at a glance. Exploration confirmed every input is already
      in the adapter's hands (raw engine markdown, verdict, failure, run directory), so no core
      change is required for the recommended shape. Four B-level questions gate the spec: (Q1) how
      much markdown is rendered — compact digest vs full styled render; (Q2) whether a runtime dep
      lands (`picocolors` and/or `marked-terminal`, both declared-only recommendations); (Q3) where
      severity/finding extraction lives, given that blockers are free text following a harness
      prompt convention and NOT structured domain data — an adapter-side heuristic keeps the story
      presentational, a core findings parser would be scope expansion (level C); (Q4) whether the
      CLI shares this surface or the story stays TUI-only. Five A-level questions (superseding H1
      AC-7's pinned assertions, non-`ok` and `ambiguous` rendering, run-path shape, long-output
      policy, the `formatTuiErrorLine` duplication revisit) are recorded with recommendations for
      the spec to resolve.
    question: >-
      Approve the proposal and continue to sddl-spec, revise this phase, or stop? Plus the four
      B-level decisions above — Q3 in particular, because answering it "core findings model"
      changes the story's nature rather than its detail.
    free_input_allowed: true
    created_at: "2026-08-29T15:35:00Z"
    response:
      free_text: >-
        Approved, route to sddl-spec. All four B-level questions decided by the user
        (e6f2h2-D1..D4 below); Q1 decided against the orchestrator's recommendation.
      responded_at: "2026-08-29T15:50:00Z"
    resolved_at: "2026-08-29T15:50:00Z"
decisions:
  - id: e6f2h2-D1
    checkpoint_id: cp-proposal-result-rendering
    selected_option_id: digest-plus-full-toggle
    free_text: "Digest + toggle a completo"
    rationale: >-
      Q1 (rendering depth). The result step renders a compact digest — verdict, findings by
      severity, run path — and then offers the user an opt-in way to see the full review without
      leaving the TUI. The user chose this over the orchestrator's digest-only recommendation:
      the digest satisfies "at a glance" while the toggle removes the "open a file to learn why"
      friction that motivated the story. CONSEQUENCE the spec must own: this adds a post-run
      interaction to a flow whose prompts were all pre-run in `[E6.F2.H1]`. Declining the toggle,
      or cancelling at it, must not change the outcome already rendered nor the exit code (H1's
      property "completed + persisted -> 0"), and it lands after persistence, so it can never
      affect whether the run was recorded. Existing scripted-prompter test doubles will need the
      extra scripted answer.
    recorded_at: "2026-08-29T15:50:00Z"
  - id: e6f2h2-D2
    checkpoint_id: cp-proposal-result-rendering
    selected_option_id: picocolors-only
    free_text: "Solo picocolors"
    rationale: >-
      Q2 (runtime dependency). `picocolors` only, ratified and exact-pinned at design per the
      `@clack/prompts` precedent from `[E6.F2.H1]`; `marked-terminal` is rejected for the MVP
      (the backlog itself marks it optional). CONSEQUENCE the spec must state honestly: with no
      markdown renderer, the full view prints the engine's raw markdown text — colorized where
      the severity convention matches — and is NOT a rendered-markdown view. Narrows
      risk-e6f2h2-002 to a single small dependency.
    recorded_at: "2026-08-29T15:50:00Z"
  - id: e6f2h2-D3
    checkpoint_id: cp-proposal-result-rendering
    selected_option_id: extraction-in-tui-adapter
    free_text: "En el adaptador TUI"
    rationale: >-
      Q3 (where severity/finding extraction lives). An adapter-side heuristic over the harness
      `[SEV: level] file:line — summary` convention, inside `src/adapters/driving/tui/`, with
      graceful degradation to plain output when the engine does not comply. Keeps the story
      presentational: zero core changes, blast radius of one renderer plus its call sites. The
      core findings model was explicitly rejected as scope expansion — this CLOSES the level-C
      escalation vector recorded as risk-e6f2h2-004.
    recorded_at: "2026-08-29T15:50:00Z"
  - id: e6f2h2-D4
    checkpoint_id: cp-proposal-result-rendering
    selected_option_id: tui-only
    free_text: "Solo TUI"
    rationale: >-
      Q4 (CLI scope). The rich surface is TUI-only. The CLI's review block is a deliberately
      machine-parseable `key<TAB>value` contract for pipes and scripting (`REVIEW_OUTCOME_FIELDS`
      in `cli/render/format-review.ts`); decorating it would break that contract, and the
      `adapters-isolated` guard forbids sharing code between driving adapters anyway. Confirms
      the proposal's Q9 finding: H1's `formatTuiErrorLine` duplication does not materially grow,
      so the recorded revisit is performed and the duplication stays.
    recorded_at: "2026-08-29T15:50:00Z"
open_risks:
  - id: risk-e6f2h2-001
    summary: >-
      "Blockers visible at a glance" rests on a prompt convention, not a contract. The domain
      carries no findings model: `Verdict` is `approve | request-changes | comment` and blockers
      exist only as free text inside `engineOutput`. The factory harnesses' `output.md` pins
      `[SEV: blocker|major|minor|nit] <file>:<line> — <summary>` and a real engine fixture honors
      it, but user-authored harnesses may declare any output contract and an engine may simply not
      comply (that is what the `ambiguous` state exists for). Any extraction the renderer performs
      must degrade gracefully to plain output instead of showing nothing or lying.
    severity: medium
  - id: risk-e6f2h2-002
    summary: >-
      Possible new runtime dependency: `picocolors` and/or `marked + marked-terminal` are
      declared-only recommendations in docs/setup-tecnico-sentinel.md §4 (marked-terminal is
      flagged optional there and in the backlog), and neither is installed. Adding a runtime dep is
      a B-level decision ratified at design with justification, per the `[E6.F2.H1]` precedent —
      not pre-approved by this proposal. NARROWED by e6f2h2-D2: `picocolors` only (exact-pinned
      at design), `marked-terminal` rejected for the MVP. Residual risk is one small dependency
      and the honesty constraint that the full view is raw markdown, not rendered markdown.
    severity: low
  - id: risk-e6f2h2-003
    summary: >-
      This story must supersede acceptance criteria of a completed story. `[E6.F2.H1]` AC-7 pinned
      the minimal `State:`/`Verdict:`/`Run directory:` block as the literal tail of stdout
      (asserted via `slice(-3)` in `tui/__test__/result.test.ts`) precisely so no H2 surface could
      slip in early. Rewriting those assertions is expected and sanctioned by H1's own doc comment,
      but it must be an explicit, recorded supersession — never a silent test edit.
    severity: low
  - id: risk-e6f2h2-004
    summary: >-
      Scope-creep vector into the core. If the spec decides that finding/severity extraction is
      domain knowledge (a structured findings model beside the verdict parser in `src/core/run/`),
      the blast radius jumps from one presentation adapter to a core hot path and the story stops
      being `[E6.F2.H2]`. Treat that outcome as level C — stop and ask — rather than absorbing it.
      CLOSED by e6f2h2-D3: extraction stays in the TUI adapter; a core findings model is rejected.
      Retained as a standing guard — if execution finds itself editing `src/core/**`, stop.
    severity: low
  - id: risk-e6f2h2-005
    summary: >-
      Digest flood. The spec deliberately lists EVERY `blocker` and `major` finding with no cap
      (minor/nit are counted only), because capping risks hiding a blocker and that would break the
      backlog acceptance "verdict and blockers visible at a glance". A pathological review with
      dozens of blockers therefore produces a long digest. Accepted: the harness `output.md`
      mandates ~120-character one-line summaries, and the opt-in full view is the unbounded surface.
      Revisit if `[E7.F1.H1]` dogfooding shows real floods.
    severity: low
  - id: risk-e6f2h2-006
    summary: >-
      Behavioral change introduced by e6f2h2-D1: the process now waits for input AFTER the run
      instead of exiting, so a user who walked away during a multi-minute review returns to a
      pending prompt. Accepted — the surface is interactive by definition, `[E6.F2.H1]`'s non-TTY
      guard guarantees no script can reach this prompt, and cancel is a value, so Esc/Ctrl+C
      resolves it cleanly without changing the rendered outcome or the exit code (AC-10).
    severity: low
next_action:
  kind: run_stage
  target: sddl-design
  summary: >-
    spec.md is formalized: 17 acceptance criteria over the firm ground of e6f2h2-D1..D4, with the
    scope boundary explicitly excluding any `src/core/**` change and any CLI change. sddl-design
    now ratifies and exact-pins `picocolors` (the `@clack/prompts` precedent), fixes the digest's
    literal labels/ordering, picks the colour-determinism mechanism AC-14 requires (injected seam
    vs ANSI-stripping in assertions), decides the module layout inside
    `src/adapters/driving/tui/` and the confinement point for `picocolors`, and settles the new
    `formatTuiResult`/full-view renderer signatures for the two `tui-flow.ts` call sites (whose
    failure shapes differ: raw `unknown` on the persist-failure path, reduced `message` on the
    persisted path). A phase checkpoint is warranted before design: the spec supersedes a completed
    story's acceptance criterion (`[E6.F2.H1]` AC-7, risk-e6f2h2-003), carries the open medium risk
    risk-e6f2h2-001, and adds two new low risks (005, 006).
