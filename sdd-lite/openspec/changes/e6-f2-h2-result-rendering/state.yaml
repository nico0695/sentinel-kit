open_risks:
  - id: risk-e6f2h2-001
    summary: >-
      "Blockers visible at a glance" rests on a prompt convention, not a contract. The domain
      carries no findings model: `Verdict` is `approve | request-changes | comment` and blockers
      exist only as free text inside `engineOutput`. The factory harnesses' `output.md` pins
      `[SEV: blocker|major|minor|nit] <file>:<line> — <summary>` and a real engine fixture honors
      it, but user-authored harnesses may declare any output contract and an engine may simply not
      comply (that is what the `ambiguous` state exists for). Any extraction the renderer performs
      must degrade gracefully to plain output instead of showing nothing or lying.
    severity: medium
  - id: risk-e6f2h2-002
    summary: >-
      Possible new runtime dependency: `picocolors` and/or `marked + marked-terminal` are
      declared-only recommendations in docs/setup-tecnico-sentinel.md §4 (marked-terminal is
      flagged optional there and in the backlog), and neither is installed. Adding a runtime dep is
      a B-level decision ratified at design with justification, per the `[E6.F2.H1]` precedent —
      not pre-approved by this proposal. NARROWED by e6f2h2-D2: `picocolors` only (exact-pinned
      at design), `marked-terminal` rejected for the MVP. Residual risk is one small dependency
      and the honesty constraint that the full view is raw markdown, not rendered markdown.
    severity: low
  - id: risk-e6f2h2-003
    summary: >-
      This story must supersede acceptance criteria of a completed story. `[E6.F2.H1]` AC-7 pinned
      the minimal `State:`/`Verdict:`/`Run directory:` block as the literal tail of stdout
      (asserted via `slice(-3)` in `tui/__test__/result.test.ts`) precisely so no H2 surface could
      slip in early. Rewriting those assertions is expected and sanctioned by H1's own doc comment,
      but it must be an explicit, recorded supersession — never a silent test edit.
    severity: low
  - id: risk-e6f2h2-004
    summary: >-
      Scope-creep vector into the core. If the spec decides that finding/severity extraction is
      domain knowledge (a structured findings model beside the verdict parser in `src/core/run/`),
      the blast radius jumps from one presentation adapter to a core hot path and the story stops
      being `[E6.F2.H2]`. Treat that outcome as level C — stop and ask — rather than absorbing it.
      CLOSED by e6f2h2-D3: extraction stays in the TUI adapter; a core findings model is rejected.
      Retained as a standing guard — if execution finds itself editing `src/core/**`, stop.
    severity: low
  - id: risk-e6f2h2-005
    summary: >-
      Digest flood. The spec deliberately lists EVERY `blocker` and `major` finding with no cap
      (minor/nit are counted only), because capping risks hiding a blocker and that would break the
      backlog acceptance "verdict and blockers visible at a glance". A pathological review with
      dozens of blockers therefore produces a long digest. Accepted: the harness `output.md`
      mandates ~120-character one-line summaries, and the opt-in full view is the unbounded surface.
      Revisit if `[E7.F1.H1]` dogfooding shows real floods.
    severity: low
  - id: risk-e6f2h2-006
    summary: >-
      Behavioral change introduced by e6f2h2-D1: the process now waits for input AFTER the run
      instead of exiting, so a user who walked away during a multi-minute review returns to a
      pending prompt. Accepted — the surface is interactive by definition, `[E6.F2.H1]`'s non-TTY
      guard guarantees no script can reach this prompt, and cancel is a value, so Esc/Ctrl+C
      resolves it cleanly without changing the rendered outcome or the exit code (AC-10).
    severity: low
  - id: risk-e6f2h2-007
    summary: >-
      Dependency assumption, not yet a fact. The design is written against `picocolors@1.1.1` as
      READ from the hoisted transitive copy in `node_modules` (it is not a declared dependency
      yet): CJS, `main: ./picocolors.js`, `types: ./picocolors.d.ts` with `export = picocolors`,
      no `exports` map, colour functions on the default export. `npm i -E picocolors` may resolve
      a different version, and this repo's tsconfig (`NodeNext` + `verbatimModuleSyntax`, no
      `esModuleInterop`) has not been proven to accept `import pc from "picocolors"`. Note the
      namespace form is runtime-WRONG here: cjs-module-lexer sees `module.exports = createColors()`
      and would expose only `default` + `createColors`, so `pc.red` would be undefined. Mitigation:
      plan stage S1 is an explicit install-and-confirm gate (pin the resolved version, confirm the
      export shape, run the typecheck) BEFORE any rendering code is written — the `[E6.F2.H1]`
      lesson where a guessed clack version stopped the executor mid-stage.
      PARTIALLY RESOLVED 2026-08-29 by an orchestrator probe against the hoisted 1.1.1 (temporary
      file under `src/`, `npx tsc --noEmit`, then removed; working tree left clean): the tsconfig
      DOES accept `import pc from "picocolors"` — probe clean, and `pc.red` is a function at
      runtime — so the design's conditional B-level question about `allowSyntheticDefaultImports`
      does NOT fire and no repo-wide config edit is needed. The namespace form was confirmed
      runtime-wrong exactly as predicted (`Object.keys` = `createColors,default`, `pc.red`
      undefined). Colour determinism confirmed: `FORCE_COLOR=1` emits ANSI, `NO_COLOR=1` does not,
      and a bare `CI=1` forces colour ON — which is why no assertion may rely on ambient detection.
      RESIDUAL: `npm i -E picocolors` may still resolve a version other than 1.1.1, so S1 keeps its
      install-and-confirm gate; only the interop half of this risk is closed.
    severity: low
  - id: risk-e6f2h2-008
    summary: >-
      Transitional export across one stage boundary, introduced by the plan's S4/S5 split.
      `tsc --noEmit` typechecks the test files and `result.test.ts` both imports `formatTuiResult`
      and pins the flow's literal output, so deleting the export, switching the two `tui-flow.ts`
      call sites and rewriting the `[E6.F2.H1]` assertions is otherwise one atomic green unit.
      S4 therefore lands `formatResultDigest`/`formatFullView` ADDITIVELY and keeps
      `formatTuiResult` until S5 deletes it. Consequence: an intermediate state of the branch
      carries a legacy export that nothing in the final design retains, and a change that stopped
      between S4 and S5 would ship it. Mitigation: S5's validation includes
      `grep -rn "formatTuiResult" src/` returning zero, and final QA checks the merged diff.
    severity: low
  - id: risk-e6f2h2-009
    summary: >-
      AC-14 is satisfiable in letter by a palette that never emits ANSI. Every flow assertion
      compares through `stripAnsi` and every pure assertion injects `PLAIN_PALETTE`, so a
      `TUI_PALETTE` whose functions were accidentally identities (a bad import shape, a wrong
      picocolors export, a mistaken `createColors(false)`) would keep both the `NO_COLOR=1` and
      the `FORCE_COLOR=1` runs green while the story's colour requirement silently did nothing.
      Mitigation: plan step M2 at S3 — a throwaway test under `FORCE_COLOR=1` asserting that
      `TUI_PALETTE.bad("x")` actually contains an SGR sequence and that `stripAnsi` reverses it,
      run once and deleted (an unconditional ANSI assertion cannot be permanent: it would be red
      under `NO_COLOR=1`) — plus the permanent env-independent invariants added in
      `full-view.test.ts` at S6.
    severity: low
  - id: risk-e6f2h2-010
    summary: >-
      Multi-line failure message on the persisted path (QA-S4-01, raised by the S4 stage-mode QA
      review; AC-6 "exactly one message line"). `formatResultDigest` (`render.ts:243-249`)
      interpolates `digest.failure.message` with no whitespace reduction. On the persisted path that
      value is `record.failure.message`, copied verbatim by `core/history/persist-run.ts:91-95` from
      `failure.error.message`; `adapters/driven/git/git-cli.ts:354` builds port errors as
      `${message}: ${asError.message}` where `asError` is an execa error, and a bad-ref
      `git worktree add` was measured rejecting with a 3-line message. `run-review.ts:496-517`
      returns such an error as an `engine-error` FAILURE (it does not reject), so the TUI persists and
      renders it: a `Failure:` entry spanning three physical lines with a blank line inside, on an
      ordinary failure path. The CLI collapses the same value deliberately
      (`cli/render/format-review.ts` `field()`: `.replace(/[\t\r\n]+/g, " ")`), so the two surfaces
      also diverge. The guarding test is vacuous — `result.test.ts` "never breaks a line and never
      leaks a stack frame" feeds `message: "spawn failed"`, an input that cannot break a line.
      Mitigation: fold the fix into S5, which switches both `tui-flow.ts` call sites — collapse
      whitespace on the message inside `formatResultDigest` (the CLI's reduction, or
      `formatTuiErrorLine`'s `replace(/\s*\n\s*/g, " ")`) and add one pure case carrying an embedded
      `\n`. Note this contradicts design.md's "the persisted path passes `record.failure` straight
      through untouched", so it is a small design correction to record, not a silent implementation
      fix.
    severity: medium
