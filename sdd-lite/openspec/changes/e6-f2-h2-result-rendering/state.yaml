change_name: e6-f2-h2-result-rendering
# The orchestrator's handoff objective was `implementer`; `state.schema.yaml` has no such
# enum member, so the schema-valid equivalent for a backlog feature story is recorded here
# (the same mapping `[E6.F2.H1]` used). Intent is unchanged: this change runs through
# execution, it does not stop at plan.
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E6.F2.H2] (issue #39), last required story of E6 and of feature E6.F2 (TUI): render a
    readable review result on completion plus the location of the persisted run. Bounded scope
    span — one driving adapter surface (`src/adapters/driving/tui/render.ts`, its two call sites
    in `tui-flow.ts`, and `__test__/result.test.ts`), which `[E6.F2.H1]` deliberately left minimal
    and documented as this story's to rewrite. Presentation-layer blast radius: proposal-stage
    exploration confirms the review markdown, verdict, failure and run directory already reach the
    TUI in memory, so no core change is required for the recommended shape. Medium ambiguity, all
    of it at the spec/design boundary: how much markdown rendering (digest vs full styled render),
    whether a runtime dep lands (`picocolors` / `marked-terminal`, declared-only in setup §4),
    whether the CLI shares the surface, and — the load-bearing one — where severity/finding
    extraction lives, since blockers are free text following a harness prompt convention rather
    than structured domain data. Risk low-medium.
  confidence: medium
  recorded_at: "2026-08-29T15:20:00Z"
