decisions:
  - id: e6f2h2-D1
    checkpoint_id: cp-proposal-result-rendering
    selected_option_id: digest-plus-full-toggle
    free_text: "Digest + toggle a completo"
    rationale: >-
      Q1 (rendering depth). The result step renders a compact digest — verdict, findings by
      severity, run path — and then offers the user an opt-in way to see the full review without
      leaving the TUI. The user chose this over the orchestrator's digest-only recommendation:
      the digest satisfies "at a glance" while the toggle removes the "open a file to learn why"
      friction that motivated the story. CONSEQUENCE the spec must own: this adds a post-run
      interaction to a flow whose prompts were all pre-run in `[E6.F2.H1]`. Declining the toggle,
      or cancelling at it, must not change the outcome already rendered nor the exit code (H1's
      property "completed + persisted -> 0"), and it lands after persistence, so it can never
      affect whether the run was recorded. Existing scripted-prompter test doubles will need the
      extra scripted answer.
    recorded_at: "2026-08-29T15:50:00Z"
  - id: e6f2h2-D2
    checkpoint_id: cp-proposal-result-rendering
    selected_option_id: picocolors-only
    free_text: "Solo picocolors"
    rationale: >-
      Q2 (runtime dependency). `picocolors` only, ratified and exact-pinned at design per the
      `@clack/prompts` precedent from `[E6.F2.H1]`; `marked-terminal` is rejected for the MVP
      (the backlog itself marks it optional). CONSEQUENCE the spec must state honestly: with no
      markdown renderer, the full view prints the engine's raw markdown text — colorized where
      the severity convention matches — and is NOT a rendered-markdown view. Narrows
      risk-e6f2h2-002 to a single small dependency.
    recorded_at: "2026-08-29T15:50:00Z"
  - id: e6f2h2-D3
    checkpoint_id: cp-proposal-result-rendering
    selected_option_id: extraction-in-tui-adapter
    free_text: "En el adaptador TUI"
    rationale: >-
      Q3 (where severity/finding extraction lives). An adapter-side heuristic over the harness
      `[SEV: level] file:line — summary` convention, inside `src/adapters/driving/tui/`, with
      graceful degradation to plain output when the engine does not comply. Keeps the story
      presentational: zero core changes, blast radius of one renderer plus its call sites. The
      core findings model was explicitly rejected as scope expansion — this CLOSES the level-C
      escalation vector recorded as risk-e6f2h2-004.
    recorded_at: "2026-08-29T15:50:00Z"
