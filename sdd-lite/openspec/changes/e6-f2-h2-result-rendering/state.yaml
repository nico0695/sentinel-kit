      QA-S4-01 (risk-e6f2h2-010) is fixed inside S5, which already owns both call sites.
      `formatResultDigest` must apply the same whitespace normalisation `formatTuiErrorLine`
      already applies ten lines above it in the same file (`render.ts:35`,
      `replace(/\s*\n\s*/g, " ").trim()`) — so this is the file's own established behaviour, not
      a new invention, and it brings the TUI in line with the CLI's `field()`, which collapses the
