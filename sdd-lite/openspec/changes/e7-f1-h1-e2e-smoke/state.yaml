    notes: >-
      Returned `success`. 12 acceptance criteria (AC-1..AC-12) and 6 behavior scenarios
      (S1-S6). Both story checkboxes are bound: AC-10 = runs in CI on the existing `test`
      job across Node 22/24 with no workflow change, AC-11 = "fails if any piece breaks",
