    recorded_at: "2026-09-05T16:00:00Z"
open_risks:
  - id: risk-e7h1-001
    summary: >-
      The FakeEngine that story [E7.F1.H1] names as the e2e driver is unreachable through the
      CLI: `EngineNameSchema` admits only `claude-code` and `opencode`, `createEngine` is a
      closed lookup over those two, and the composition root exposes no `ReviewEngine`
      injection seam. Every route to the story's acceptance criteria therefore touches
      production code or trades away coverage of the real built binary. This must be settled
      as an explicit decision at spec/design, not improvised at execution.
    severity: medium
  - id: risk-e7h1-002
    summary: >-
      The e2e test must run in CI (an explicit acceptance criterion) on ubuntu-latest across
      the Node 22/24 matrix, which means it must create a temporary git repository with a
      deterministic identity and no dependency on the developer's global git config
      (`user.name`/`user.email`, `init.defaultBranch`, commit signing, `core.autocrlf`). The
      existing git adapter suites already face this; whether they solved it reusably is
      unverified and is proposal/design evidence, not an assumption to carry forward.
    severity: low
  - id: risk-e7h1-003
    summary: >-
      New, found by the proposal stage: a top-level `e2e/` directory is invisible to all three
      quality-gate tools. `tsconfig.json` sets `"include": ["src"]`, `biome.json#files.includes`
      is an explicit allowlist, and `npm run check` runs `depcruise src`. Only `vitest.config.ts`
      already matches `e2e/**/*.test.ts`. Left unaddressed, the smoke suite would run unlinted
      and untypechecked — the one directory in the repo outside the gate. Raised as Q2.
    severity: medium
