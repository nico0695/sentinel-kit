artifacts:
  state: sdd-lite/openspec/changes/e7-f1-h1-e2e-smoke/state.yaml
  proposal: sdd-lite/openspec/changes/e7-f1-h1-e2e-smoke/proposal.md
  spec: sdd-lite/openspec/changes/e7-f1-h1-e2e-smoke/spec.md
  design: sdd-lite/openspec/changes/e7-f1-h1-e2e-smoke/design.md
  plan: sdd-lite/openspec/changes/e7-f1-h1-e2e-smoke/plan.md
  execution_log: sdd-lite/openspec/changes/e7-f1-h1-e2e-smoke/execution-log.md
  qa_report: sdd-lite/openspec/changes/e7-f1-h1-e2e-smoke/qa-report.md
checkpoints:
  - id: cp-001
    type: phase_validation
    stage: sddl-proposal
    summary: >-
      The proposal returned two B-level questions that shape the spec's acceptance criteria.
      Q1 decides how the smoke run reaches the FakeEngine, and with it how much of the real
      binary the "fails if any piece of the flow breaks" criterion actually covers. Q2 decides
      whether the new top-level `e2e/` directory joins the quality gate, which today is blind
      to it (tsconfig `include` is `["src"]`, biome uses an explicit allowlist, and `check`
      runs `depcruise src`).
    question: >-
      Q1: which route reaches the FakeEngine — (a) an optional ReviewEngine override in
      WiringGraphOptions used only by the e2e harness, (b) a `fake` member in EngineNameSchema
      gated by an env var, or (c) in-process against createCliDeps? Q2: does `e2e/` join
      tsconfig/biome (and does depcruise stay scoped to `src`)?
    free_input_allowed: true
    response:
      free_text: >-
        Q1 = (a) optional ReviewEngine override in WiringGraphOptions, test-only.
        Q2 = add e2e to tsconfig#include and biome.json#files.includes; depcruise stays
        scoped to `src`.
      responded_at: "2026-09-05T16:25:00Z"
    created_at: "2026-09-05T16:18:00Z"
    resolved_at: "2026-09-05T16:25:00Z"
decisions:
  - id: d-001
    checkpoint_id: session-init
    free_text: interactive
    rationale: >-
      Session execution mode, asked once per the orchestrator contract's Session
      Initialization rule and cached for the session. Author: user. The user chose
      `interactive` over `auto` on the recommendation that this change carries a real
      design decision (the engine seam, risk-e7h1-001) worth seeing before it is designed.
    recorded_at: "2026-09-05T16:05:00Z"
  - id: d-002
    checkpoint_id: bootstrap-preflight
    free_text: surgical-refresh
    rationale: >-
      Bootstrap preflight read `stale`: `config.yaml`'s own recorded refresh trigger was
      "E6 closed (E7 entry)", which is exactly this routing point. Refreshed surgically
      by the orchestrator (not a full `sddl-init` run) against verified repo reality at
      `main` @ cbc878b — check/test/build re-run from a clean `npm ci` (1037/49 tests,
      0 guard violations), `picocolors` recorded as ratified, `marked-terminal` dropped
      as a pending recommendation, and the missing `src/adapters/driving/tui/__test__`
      root added to observed paths. Preflight is now `ready`, so code-touching execution
      is not gated on stale bootstrap. Level A (technical, reversible, aligned with the
      setup doc). Author: claude.
    recorded_at: "2026-09-05T16:00:00Z"
  - id: d-003
    checkpoint_id: cp-001
    free_text: "Q1 = route (a)"
    rationale: >-
      The smoke run reaches the FakeEngine through an OPTIONAL `ReviewEngine` override in
      `WiringGraphOptions`, typed as optional and documented as test-only. Chosen over route
      (b) (a `fake` member in `EngineNameSchema`, gated by an env var) and route (c)
      (in-process against `createCliDeps`). Rationale: (b) is the only route that covers
      `dist/cli.js` as a real subprocess, but it puts a test engine into the user-facing
      schema — `sentinel review --engine` validation and help, `config.yaml`'s
      `defaultEngine`, and persisted run metadata all consume `EngineNameSchema`, so an env
      gate narrows the exposure without removing it. Surface purity won. The cost is
      explicit and must be written into the spec, not implied: `src/main/cli.ts` (argv
      dispatch) and the built bundle stay outside the smoke's coverage, partially offset by
      the existing CI `build` job running `node dist/cli.js --version`. Level B. Author:
      user (options and recommendation presented by claude; claude recommended (a)).
    recorded_at: "2026-09-05T16:25:00Z"
  - id: d-004
    checkpoint_id: cp-001
    free_text: "Q2 = tsconfig + biome yes, depcruise scoped to src"
    rationale: >-
      `e2e` joins `tsconfig.json#include` and `biome.json#files.includes` so the smoke suite
      is typechecked and linted like the rest of the repo, closing risk-e7h1-003. `depcruise`
      stays scoped to `src`: the architecture guards are the core-extraction guarantee, and
      `e2e/` is neither shipped (`package.json#files` is dist/harnesses/skills) nor subject
      to the inward-dependency rule — it legitimately reaches into both `src/main` and
      `src/adapters` at once. The exclusion is recorded as a deliberate decision rather than
      left as an accident of scoping. Level B (repo structure + quality gate). Author: user
      (claude recommended this option).
    recorded_at: "2026-09-05T16:25:00Z"
open_risks:
  - id: risk-e7h1-001
    summary: >-
      The FakeEngine that story [E7.F1.H1] names as the e2e driver is unreachable through the
      CLI: `EngineNameSchema` admits only `claude-code` and `opencode`, `createEngine` is a
      closed lookup over those two, and the composition root exposes no `ReviewEngine`
      injection seam. Every route to the story's acceptance criteria therefore touches
      production code or trades away coverage of the real built binary. This must be settled
      as an explicit decision at spec/design, not improvised at execution.
    severity: medium
  - id: risk-e7h1-002
    summary: >-
      The e2e test must run in CI (an explicit acceptance criterion) on ubuntu-latest across
      the Node 22/24 matrix, which means it must create a temporary git repository with a
      deterministic identity and no dependency on the developer's global git config
      (`user.name`/`user.email`, `init.defaultBranch`, commit signing, `core.autocrlf`). The
      existing git adapter suites already face this; whether they solved it reusably is
      unverified and is proposal/design evidence, not an assumption to carry forward.
    severity: low
  - id: risk-e7h1-004
    summary: >-
      Raised by the spec stage (Q8, A-level, design-owned — no user input needed):
      `WiringGraphOptions` alone is insufficient to carry the route-(a) engine override,
      because the smoke calls `createCliDeps`, whose `CliDepsOptions` is a separate
      interface (`src/main/container.ts:78-87`) that forwards into the graph. Design decides
      whether to extend `CliDepsOptions` or restructure the forwarding.
    severity: low
  - id: risk-e7h1-005
    summary: >-
      Accepted consequence of d-003: a test-only seam now exists in production code
      (`src/main/container.ts`). Mitigated by spec AC-7, which requires the
      `EngineNameSchema` diff to be empty and the existing wiring tests to be unmodified,
      so the seam cannot silently widen the user-facing surface.
    severity: low
  - id: risk-e7h1-003
    summary: >-
      New, found by the proposal stage: a top-level `e2e/` directory is invisible to all three
      quality-gate tools. `tsconfig.json` sets `"include": ["src"]`, `biome.json#files.includes`
      is an explicit allowlist, and `npm run check` runs `depcruise src`. Only `vitest.config.ts`
      already matches `e2e/**/*.test.ts`. Left unaddressed, the smoke suite would run unlinted
      and untypechecked — the one directory in the repo outside the gate. Raised as Q2 and
      RESOLVED by decision d-004: `e2e` joins tsconfig#include and biome.json#files.includes;
      depcruise stays scoped to `src` deliberately.
    severity: low
