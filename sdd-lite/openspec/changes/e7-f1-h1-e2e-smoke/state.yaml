  - id: d-003
    checkpoint_id: cp-001
    free_text: "Q1 = route (a)"
    rationale: >-
      The smoke run reaches the FakeEngine through an OPTIONAL `ReviewEngine` override in
      `WiringGraphOptions`, typed as optional and documented as test-only. Chosen over route
      (b) (a `fake` member in `EngineNameSchema`, gated by an env var) and route (c)
      (in-process against `createCliDeps`). Rationale: (b) is the only route that covers
      `dist/cli.js` as a real subprocess, but it puts a test engine into the user-facing
      schema — `sentinel review --engine` validation and help, `config.yaml`'s
      `defaultEngine`, and persisted run metadata all consume `EngineNameSchema`, so an env
      gate narrows the exposure without removing it. Surface purity won. The cost is
      explicit and must be written into the spec, not implied: `src/main/cli.ts` (argv
      dispatch) and the built bundle stay outside the smoke's coverage, partially offset by
      the existing CI `build` job running `node dist/cli.js --version`. Level B. Author:
      user (options and recommendation presented by claude; claude recommended (a)).
