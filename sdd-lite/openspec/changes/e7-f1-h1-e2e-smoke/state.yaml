version: "0.1"
change_name: e7-f1-h1-e2e-smoke
# The orchestrator's handoff objective is `implementer`; `state.schema.yaml` has no such
# enum member, so the schema-valid equivalent for a backlog test-infrastructure story is
# recorded here (the same mapping E6's stories used). Intent is unchanged: this change
# runs through execution, it does not stop at plan.
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E7.F1.H1] (issue #41), first story of E7 (wrap-up) and the required predecessor of
    the release pipeline [E7.F2.H3]: an end-to-end smoke test over the full flow — register a
    repo, review a branch, read the run back out of history — driven against a temporary git
    repository and the existing FakeEngine, asserting the persisted artifacts. Bounded scope
    span: the repo's `e2e` vitest project has existed since E0 (`vitest.config.ts`, include
    `e2e/**/*.test.ts`) but matches no files today, so the story creates the first `e2e/` root
    rather than reshaping an existing suite. Blast radius is normally test-only, with ONE
    material exception that is the load-bearing ambiguity of this change: the FakeEngine the
    story names is not reachable through the CLI today. `EngineNameSchema` is
    `z.enum(["claude-code", "opencode"])` (`src/core/repos/ports/config-schemas.ts:14`),
    `createEngine` is a closed name-to-constructor lookup over those two
    (`src/main/container.ts:118`), and `createWiringGraph` accepts only `env` and `homeDir` —
    there is no seam to inject a `ReviewEngine`. Reaching the FakeEngine therefore requires a
    production-code decision (a test-only injection seam in the composition root, a gated
    `fake` engine name in the schema, or running in-process against `createCliDeps` and giving
    up coverage of the built `dist/cli.js`), each with a different cost to the public surface.
    Isolation itself is already solved and is not a risk: `SENTINEL_HOME` fully redirects
    sentinel state (`src/main/paths.ts:68`). Medium ambiguity concentrated at the spec/design
    boundary, low-medium risk.
  confidence: medium
  recorded_at: "2026-09-05T16:10:00Z"
