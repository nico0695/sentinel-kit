open_risks:
  - id: risk-e7h1-001
    summary: >-
      The FakeEngine that story [E7.F1.H1] names as the e2e driver is unreachable through the
      CLI: `EngineNameSchema` admits only `claude-code` and `opencode`, `createEngine` is a
      closed lookup over those two, and the composition root exposes no `ReviewEngine`
      injection seam. Every route to the story's acceptance criteria therefore touches
      production code or trades away coverage of the real built binary. This must be settled
      as an explicit decision at spec/design, not improvised at execution.
    severity: medium
  - id: risk-e7h1-002
    summary: >-
      The e2e test must run in CI (an explicit acceptance criterion) on ubuntu-latest across
      the Node 22/24 matrix, which means it must create a temporary git repository with a
      deterministic identity and no dependency on the developer's global git config
      (`user.name`/`user.email`, `init.defaultBranch`, commit signing, `core.autocrlf`). The
      existing git adapter suites already face this; whether they solved it reusably is
      unverified and is proposal/design evidence, not an assumption to carry forward.
    severity: low
  - id: risk-e7h1-008
    summary: >-
      RETIRED at ST-2. The isolation experiment ran with no `e2e/` file present and `npm run
      check` came back byte-identical to the baseline: no pre-existing finding, no
      tsup/vitest type-resolution interaction, and `tsc` is silent about an `include` entry
      that matches nothing. Any `check` failure in ST-3/ST-4 is therefore attributable to
      the new test files.
    severity: low
  - id: risk-e7h1-011
    summary: >-
      CLOSED at ST-5b, closure independently re-verified by the orchestrator: with the two
      new assertions in place, M2 turns the suite red (`ENOENT ... scandir
      '<tmp>/worktrees'`). Originally a DEMONSTRATED BLIND SPOT found by ST-5's M2, and the
      single most important finding of this story. Handing `runReview` `worktreesDir: paths.clonesDir` does NOT turn the smoke
      red — 2 of 2 still pass. The mutation is live, not dead code
      (`container.ts:256` -> `run-review.ts:402` -> `create-review-worktree.ts`, which builds
      `<worktreesDir>/<repoBasename>/<label>-<ts>`), so the worktree really is created in the
      wrong tree and the suite notices nothing. It is unobservable because the fixture
      registers with `--local-path`, leaving `clonesDir` otherwise empty, and the suite
      asserts nothing about where the worktree lived or that `clones/` stays untouched.
      This matters in production, not just in the test: `listOrphanWorktrees` scans
      `worktreesDir`, so a worktree created outside it is invisible to orphan cleanup, and
      `<clonesDir>/<repoBasename>/...` shares a tree with managed clones.
      Level B decision owed before ST-6, because ST-6 CLOSES the change and a gap accepted
      silently there ships: (a) accept and document the gap for the MVP, or (b) add two
      assertions to `e2e/review-flow.test.ts` — the worktree root actually used, and
      `clones/` untouched — and re-run M2 to prove it red. Adding them was outside ST-5's
      "no net file change" scope, so it was correctly not done there.
    severity: medium
  - id: risk-e7h1-010
    summary: >-
      Two more artifact-vs-code corrections, found by ST-3 and independently re-verified by
      the orchestrator against the source. Both make the assertions STRONGER and neither
      changes scope: (1) runs do NOT land under `<SENTINEL_HOME>/runs/acme/widget/` as
      design D-7 claims — `persistRun` maps the alias through `toRunStorageKey`
      (`owner/repo` -> `owner__repo`) before handing the record to the store, because
      `RunStore` needs a single path segment and its schemas reject `/`, so the real path is
      `runs/acme__widget/<ts>/`; (2) `metadata.json#repo` therefore persists as
      `acme__widget`, not the alias the plan expected — asserting the alias there would have
      failed. The alias/key split is deliberate and both halves are now covered end to end:
      the `runs list`/`runs show` legs still take the alias on argv and get the alias echoed
      back. Routed to sddl-design as its own Amendment 1; D-7's wrong path must not stay on
      the record to mislead the next reader.
    severity: low
  - id: risk-e7h1-012
    summary: >-
      Documentation-only, non-blocking, self-reported by ST-6: the ST-5b entry in
      `execution-log.md` labels the M2 blind-spot closure `risk-e7h1-008` in three places,
      while `plan.md` Amendment 1 and this file register it as `risk-e7h1-011`
      (`risk-e7h1-008` is the ST-2 gate-interaction risk, retired at ST-2). The evidence and
      the conclusion are correct; only the id is mistyped. Execution-log entries are
      append-only, so ST-6 flagged it in its own entry rather than rewriting history.
      sddl-qa-review should reconcile the ids rather than leave two numbering schemes on the
      record.
    severity: low
  - id: risk-e7h1-009
    summary: >-
      Raised by ST-2: AC-8 is now CONFIGURED but not DEMONSTRATED. The widened gate is inert
      while `e2e/` is empty — nothing yet proves it would reject a bad file there. ST-6's
      spot check (deliberate type error in `e2e/` -> `tsc --noEmit` fails -> revert -> clean)
      is the ONLY evidence for AC-8 and must not be dropped from ST-6 for being fiddly.
    severity: medium
  - id: risk-e7h1-006
    summary: >-
      Three spec assertions were contradicted by code evidence found at design time, all
      A-level and none a scope change: (A-1) `validations/` is written only when
      `validationOutput` is non-empty (`run-store-fs.ts:237-240`) and `repo add` has no
      `--validations` flag, so under the `quick` harness it never exists and the smoke must
      assert it ABSENT; (A-2) `<SENTINEL_HOME>/config.yaml` is never written by any CLI path,
      so only `repos.yaml` may be asserted; (A-3) `serializeRunMetadata` emits no `id` field —
      the run id IS the directory name, so AC-5 is met by matching the directory name against
      what `runs list` prints. Routed back to sddl-spec as Amendment 1 so spec and design do
      not contradict each other on the record.
    severity: low
  - id: risk-e7h1-007
    summary: >-
      Two informational findings from design that the plan and QA must not lose: AC-7's
      "existing wiring tests unmodified" clause is VACUOUS as written, because
      `src/main/__test__/` holds only `paths.test.ts` — there is no container wiring test, so
      the seam has to be verified by reading the diff; and `metadata.json#engine` will read
      `claude-code` while the FakeEngine actually ran (the override interposes after name
      resolution), so the smoke must never assert an engine name. Both folded into
      Amendment 1.
    severity: low
  - id: risk-e7h1-004
    summary: >-
      Raised by the spec stage (Q8, A-level, design-owned — no user input needed):
      `WiringGraphOptions` alone is insufficient to carry the route-(a) engine override,
      because the smoke calls `createCliDeps`, whose `CliDepsOptions` is a separate
      interface (`src/main/container.ts:78-87`) that forwards into the graph. Design decides
      whether to extend `CliDepsOptions` or restructure the forwarding.
    severity: low
  - id: risk-e7h1-005
    summary: >-
      Accepted consequence of d-003: a test-only seam now exists in production code
      (`src/main/container.ts`). Mitigated by spec AC-7, which requires the
      `EngineNameSchema` diff to be empty and the existing wiring tests to be unmodified,
      so the seam cannot silently widen the user-facing surface.
    severity: low
  - id: risk-e7h1-003
    summary: >-
      New, found by the proposal stage: a top-level `e2e/` directory is invisible to all three
      quality-gate tools. `tsconfig.json` sets `"include": ["src"]`, `biome.json#files.includes`
      is an explicit allowlist, and `npm run check` runs `depcruise src`. Only `vitest.config.ts`
      already matches `e2e/**/*.test.ts`. Left unaddressed, the smoke suite would run unlinted
      and untypechecked — the one directory in the repo outside the gate. Raised as Q2 and
      RESOLVED by decision d-004: `e2e` joins tsconfig#include and biome.json#files.includes;
      depcruise stays scoped to `src` deliberately.
    severity: low
