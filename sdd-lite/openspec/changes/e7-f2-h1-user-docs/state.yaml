version: "0.1"
change_name: e7-f2-h1-user-docs
objective: new-feature
mode: lite
complexity_assessment:
  route: continue-lite
  summary: >-
    Story [E7.F2.H1] (issue #43, milestone E7, required): user documentation for people who
    install and use sentinel, not contributors. Docs-only, no production code. The user
    mandated the format (at most 3 flat docs, one per issue criterion, linked from README,
    minimal repeated structure, at most one small Mermaid per doc). Bounded span but four
    B-level decisions: the install path (package unpublished, #45 pending), file names, where
    config.yaml/repos.yaml are documented under the 3-doc cap, and live-engine verification.
    Low blast radius, medium ambiguity concentrated in the install path and verification.
  confidence: medium
  recorded_at: "2026-10-03T13:10:00Z"
