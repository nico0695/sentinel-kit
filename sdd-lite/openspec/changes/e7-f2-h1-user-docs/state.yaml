    recorded_at: "2026-10-03T13:30:00Z"
  - id: d-004
    checkpoint_id: cp-002
    selected_option_id: docs_flat
    rationale: >-
      D2 resolved by the user as recommended: docs/quick-start.md,
      docs/build-your-own-harness.md, docs/privacy.md, flat, linked from README.
      Author: claude->user.
    recorded_at: "2026-10-03T13:30:00Z"
  - id: d-003
    checkpoint_id: cp-001
    selected_option_id: from_source
    rationale: >-
      D1 resolved by the user as recommended: the quick start documents the source install
      (git clone, npm ci, npm run build, npm install -g ., Node 22+) isolated in one step so the
      release (#45) swaps a single step. Author: claude->user.
    recorded_at: "2026-10-03T13:30:00Z"
  - id: d-002
    checkpoint_id: handoff
    free_text: continue-lite
    rationale: >-
      Route confirmed by the proposal stage: docs-only, bounded, no PRD conflict, no new
      architecture. Level A. Author: claude (orchestrator proposed continue-lite, evidence
      agrees).
    recorded_at: "2026-10-03T13:10:00Z"
  - id: d-001
    checkpoint_id: handoff
    free_text: user-mandated documentation format
    rationale: >-
      Binding format from the user's handoff: users not contributors; at most 3 flat docs, one
      per issue criterion, linked from README; fixed minimal structure (title, one-line
      purpose, numbered steps, Next steps); short and scannable; at most one simple Mermaid per
      doc (fewer than 8 nodes, no custom styles); user language; contributor docs untouched;
      every command verified against real code; no production code; license out of scope.
      Author: user.
    recorded_at: "2026-10-03T13:10:00Z"
open_risks:
  - id: risk-e7f2h1-001
    summary: >-
      The source-install step goes stale when the release pipeline (#45) publishes the
      package. Mitigation: isolate install in one step of the quick start.
    severity: medium
  - id: risk-e7f2h1-002
    summary: >-
      Per d-006 (structural_only) no live model call is made: the quick start's review and
      result steps are verified against code and the engine pre-flight only, never against a
      real engine run; opencode is absent from the sandbox. QA must disclose the gap and the PR
      must say so.
    severity: medium
  - id: risk-e7f2h1-003
    summary: >-
      The TUI post-run prompt with stdin at EOF exits 13 (#82). The docs must present the TUI as
      interactive-only and point scripts at sentinel review.
    severity: low
  - id: risk-e7f2h1-004
    summary: >-
      Exit code 2 is not covered end to end (#79). Document the real mapping with a caveat
      only if the spec decides to document exit codes.
    severity: low
  - id: risk-e7f2h1-005
    summary: >-
      Friction found while verifying (TUI empty-state hint says repo add <alias> <url> but real
      usage is repo add <url>; repo add --local-path without an origin remote needs
      --base-branch). To be filed as GitHub issues, not fixed in this PR.
    severity: low
next_action:
  kind: approve_stage
  summary: >-
    D1-D4 resolved (from_source, docs_flat, fold, structural_only). Next: sddl-spec, pending the
    user's go-ahead. Spec must verify in code what a harness without output.md does, which
    config fields are wired end to end, and decide the README "Quick start (development)"
    heading question.
