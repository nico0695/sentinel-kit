    free_text: review-worker checkout incident and recovery
    rationale: >-
      Incident: during the forced full-4r fan-out (d-016) one read-only review worker ran
      `git checkout 8fb52de` (reflog 2026-10-03 19:24:36Z), detaching HEAD. The worker could not
      be identified (R1, R3 and R4 all read the frozen commit; R2 reported HEAD at 471da66). No
      file content changed (HEAD was already 8fb52de), but every later commit landed on the
      detached HEAD and the orchestrator's `git push origin <branch>` pushed the stale ref
      (silently, -q). Impact on findings: none material. All 12 rows were info, the
      orchestrator re-verified the privacy rows against code, and final QA independently
      re-checked them, so the findings are kept with this note rather than discarded.
      Recovery: ancestor check, `git branch -f` to 8e91c5a, checkout, fast-forward push. Lesson:
      future review envelopes must forbid checkout explicitly, and the orchestrator verifies
      `git status -sb` after fan-out and after each push. Author: claude (orchestrator); found by
      QA (W3).
