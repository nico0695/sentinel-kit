  qa_report: sdd-lite/openspec/changes/e7-f2-h1-user-docs/qa-report.md
checkpoints:
  - id: cp-004
    type: missing_context
    stage: sddl-proposal
    summary: >-
      D4 (B): verification of the quick start against a real engine. The sandbox has `claude`
      2.1.288 logged in through the host session's OAuth token and no `opencode`. A real review
      sends the diff to Anthropic and spends that account's quota.
    question: >-
      How is the quick start verified against a real engine?
    options:
      - id: one_real_review
        label: One real review of a tiny throwaway repo
        description: >-
          At the executor stage, with explicit approval, run one claude-code review of a
          disposable repo (a few lines of diff). opencode is documented from code and
          docs/engines and marked unverified live.
        recommended: true
      - id: structural_only
        label: Structural verification only
        description: >-
          Verify install, repo add/list, runs list, error paths and the engine pre-flight
          without invoking a model. The QA report states the gap honestly.
      - id: user_runs_it
        label: The user runs the live step
        description: >-
          Executor stops at the commands that need the engine; the user runs them on their
          own machine and reports the result.
    free_input_allowed: true
    response:
      selected_option_id: structural_only
      responded_at: "2026-10-03T13:30:00Z"
    created_at: "2026-10-03T13:10:00Z"
    resolved_at: "2026-10-03T13:30:00Z"
  - id: cp-003
    type: missing_context
    stage: sddl-proposal
    summary: >-
      D3 (B): where config.yaml and repos.yaml are documented. The backlog lists
      "configuration docs" separately; the user's cap is 3 docs, one per issue criterion.
      There is no config command, so users edit the YAML by hand to change the default engine
      or a repository's default harness.
    question: Fold configuration into the three docs, or add a 4th?
    options:
      - id: fold
        label: Fold into the three docs
        description: >-
          Engine choice (--engine, defaultEngine in config.yaml) in the quick start; repos.yaml
          defaultHarness and extraSkills in the harness guide. Only fields verified end to end
          are documented.
        recommended: true
      - id: fourth_doc
        label: Add docs/configuration.md
        description: >-
          A fourth flat doc as the config reference. Breaks the one-per-criterion cap, so it
          needs the user's explicit approval.
      - id: readme_section
        label: Put a short settings section in README
        description: Keeps three docs but widens the README edit beyond links.
    free_input_allowed: true
    response:
      selected_option_id: fold
      responded_at: "2026-10-03T13:30:00Z"
    created_at: "2026-10-03T13:10:00Z"
    resolved_at: "2026-10-03T13:30:00Z"
  - id: cp-002
    type: missing_context
    stage: sddl-proposal
    summary: >-
      D2 (B): names and location of the three docs. Flat only, since nested folders and index
      files are ruled out. Contributor docs already occupy docs/.
    question: Which file names and location?
    options:
      - id: docs_flat
        label: docs/quick-start.md, docs/build-your-own-harness.md, docs/privacy.md
        description: >-
          Flat, next to the contributor docs; README groups links under "Using sentinel" and
          "Contributing".
        recommended: true
      - id: root_files
        label: Root-level files
        description: QUICKSTART.md and similar next to README; clutters the repository root.
    free_input_allowed: true
    response:
      selected_option_id: docs_flat
      responded_at: "2026-10-03T13:30:00Z"
    created_at: "2026-10-03T13:10:00Z"
    resolved_at: "2026-10-03T13:30:00Z"
  - id: cp-001
    type: missing_context
    stage: sddl-proposal
    summary: >-
      D1 (B): install path for the quick start. The package @nico0695/sentinel@0.0.0 is not
      published (#45). Sandbox trial: npm ci, npm run build, then npm pack plus global install,
      and npm install -g ., each yield working sentinel and snt commands with factory harnesses
      resolved. There is no prepare script and dist/ is gitignored, so installing straight from
      the git URL very likely fails (inferred, untested). Classified B, not C: no PRD text
      requires a published install and the backlog dependency is E6.F1.H1.
    question: What install does the quick start document?
    options:
      - id: from_source
        label: Source install now, isolated in one step
        description: >-
          git clone, npm ci, npm run build, npm install -g . (Node 22+). Reproducible today;
          #45 later swaps this single step for npm i -g.
        recommended: true
      - id: future_command
        label: Document only the future npm i -g command
        description: Not reproducible today and the command does not work yet; rejected.
      - id: wait_for_release
        label: Hold the story until #45 publishes
        description: Reproducible but blocks a required story on an unrelated one.
    free_input_allowed: true
    response:
      selected_option_id: from_source
      responded_at: "2026-10-03T13:30:00Z"
    created_at: "2026-10-03T13:10:00Z"
    resolved_at: "2026-10-03T13:30:00Z"
