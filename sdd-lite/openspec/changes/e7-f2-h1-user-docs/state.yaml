open_risks:
  - id: risk-e7f2h1-006
    summary: >-
      F5: factory output.md asks for the verdict on the first line but the parser reads only the
      tail window, so long factory-harness reviews may end ambiguous. Guide example avoids it
      under D5 last_line; product fix out of scope (candidate for #42).
    severity: medium
  - id: risk-e7f2h1-007
    summary: >-
      F3: sentinel review never fetches and the base resolves to the stale local branch, so later
      reviews of a URL-added repo can show wrong diffs. Docs state it in one sentence (d-012);
      users get no refresh command; F3 filed.
    severity: medium
  - id: risk-e7f2h1-009
    summary: >-
      The interactive harness list (guide check step) cannot be driven without a terminal in the
      sandbox; verified structurally (listHarnessTypes uses the same loader as review, V11).
    severity: low
  - id: risk-e7f2h1-008
    summary: >-
      In the sandbox claude sits in /opt/node22/bin next to node; structural verification needs a
      PATH shim so no model can be invoked (AC-10).
    severity: low
  - id: risk-e7f2h1-001
    summary: >-
      The source-install step goes stale when the release pipeline (#45) publishes the
      package. Mitigation: isolate install in one step of the quick start.
    severity: medium
  - id: risk-e7f2h1-002
    summary: >-
      Per d-006 (structural_only) no live model call is made: the quick start's review and
      result steps are verified against code and the engine pre-flight only, never against a
      real engine run; opencode is absent from the sandbox. QA must disclose the gap and the PR
      must say so.
    severity: medium
  - id: risk-e7f2h1-003
    summary: >-
      The TUI post-run prompt with stdin at EOF exits 13 (#82). The docs must present the TUI as
      interactive-only and point scripts at sentinel review.
    severity: low
  - id: risk-e7f2h1-004
    summary: >-
      Exit code 2 is not covered end to end (#79). Document the real mapping with a caveat
      only if the spec decides to document exit codes.
    severity: low
  - id: risk-e7f2h1-005
    summary: >-
      Friction found while verifying (TUI empty-state hint says repo add <alias> <url> but real
      usage is repo add <url>; repo add --local-path without an origin remote needs
      --base-branch). To be filed as GitHub issues, not fixed in this PR.
    severity: low
