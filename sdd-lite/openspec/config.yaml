# NOTE: E0 through E6.F1.H1 have landed on `main` @ 16e3650 (PR #73 merged). All four
# scripts are runnable and verified exit 0 as of that merge: `npm run check` (biome +
# tsc + depcruise, 0 violations), `npm test` (vitest, 681/681 across 38 files),
# `npm run build` (tsup) and `npm run dev` (now `tsup --silent && node dist/cli.js`).
# `[E6.F1.H1]` added the CLI adapter (`src/adapters/driving/cli/`), the `commander`
# runtime dep, and the `src/main/` composition root (cli.ts, container.ts, paths.ts).
quality_commands:
  install:
    - npm ci
  test:
    - npm test
  build:
    - npm run build
  lint:
    - npm run check
  typecheck:
    - npm run check
  format:
    - npm run check

