# NOTE: E0 through E6.F2.H1 have landed on `main` @ 59b806e (PR #75 merged). All four
# scripts are runnable and verified exit 0 as of that merge: `npm run check` (biome +
# tsc + depcruise, 0 violations — 156 files, 103 modules cruised), `npm test` (vitest,
# 754/754 across 45 files), `npm run build` (tsup) and `npm run dev` (`tsup --silent &&
# node dist/cli.js`). `[E6.F1.H1]` added the CLI adapter (`src/adapters/driving/cli/`),
# the `commander` runtime dep, and the `src/main/` composition root (cli.ts,
# container.ts, paths.ts); `[E6.F2.H1]` filled `src/adapters/driving/tui/` and added
# the `@clack/prompts` runtime dep.
quality_commands:
  install:
    - npm ci
  test:
    - npm test
  build:
    - npm run build
  lint:
    - npm run check
  typecheck:
    - npm run check
  format:
    - npm run check

