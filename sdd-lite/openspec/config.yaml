# NOTE: E0 through E6 have landed on `main` @ cbc878b (PRs #75, #76, #77, #78 merged).
# E6 is fully complete: `[E6.F2.H2]` (result rendering) shipped in PR #76 and its two
# owner-review findings (bidi/RTL control neutralisation, the optional post-run prompt
# flipping the exit code) were fixed in PR #77. `[E6.F2.H3]` (`sentinel open`) stays
# skipped per workflow contract rule 7. All four scripts verified exit 0 at this commit
# on a clean `npm ci`: `npm run check` (biome + tsc + depcruise, 0 violations — 163 files,
# 107 modules / 254 dependencies cruised), `npm test` (vitest, 1037/1037 across 49 files),
# `npm run build` (tsup, 124 KB ESM) and `node dist/cli.js --version`. Remaining MVP work
# is E7 only: E2E smoke (#41), dogfooding (#42), user docs (#43), license (#44), release
# pipeline (#45).

quality_commands:
  install:
    - npm ci
  test:
    - npm test
  build:
    - npm run build
  lint:
    - npm run check
  typecheck:
    - npm run check
  format:
    - npm run check

