version: "0.1"
project:
  name: sentinel
  slug: sentinel
  root: /home/user/sentinel-kit
  package_root: sdd-lite
  runtime_root: ./sdd-lite
  stack:
    languages:
      - typescript
    frameworks: []
    runtime: node
    package_manager: npm

paths:
  runtime_root: ./sdd-lite
  project_context_path: ./sdd-lite/project-context.md
  skill_catalog_path: ./sdd-lite/skill-catalog.md
  artifact_root: ./sdd-lite/openspec
  config_path: ./sdd-lite/openspec/config.yaml
  changes_root: ./sdd-lite/openspec/changes
  reviews_root: ./sdd-lite/openspec/reviews

# NOTE: E0 through E5 have landed on `main` @ 1e7cf01. All four scripts are runnable
# and verified exit 0 on 2026-08-23 against that commit: `npm run check` (full form,
# biome over 118 files + tsc + depcruise over 81 modules, 0 violations), `npm test`
# (vitest, 500/500 across 28 files), `npm run build` (tsup) and `npm run dev`.
quality_commands:
  install:
    - npm ci
  test:
    - npm test
  build:
    - npm run build
  lint:
    - npm run check
  typecheck:
    - npm run check
  format:
    - npm run check

bootstrap:
  status: refreshed
  strategy: shallow-high-signal
  generated_at: "2026-08-01T14:39:32Z"
  generated_by: sddl-init
  last_validated_at: "2026-08-23T21:00:00Z"
  # Surgical refresh 2026-08-23 by the orchestrator (not a full sddl-init run),
  # post-E4/E5 on `main` @ 1e7cf01, at the start of `[E6.F1.H1]`. What changed since
  # the 2026-08-09 entry: E4 (runReview, verdict parser, claude-code + opencode
  # adapters, cascading engine resolution) and E5 (ProcessRunner + exec adapter,
  # declared validations, RunStore + history queries) landed; `npm test` grew from
  # 163 tests / 14 files to 500 / 28; five new test roots appeared (core/run,
  # core/history, adapters/driven/exec, engines/claude-code, engines/opencode).
  # Runtime deps are still execa + yaml + zod: the previous refresh trigger ("the
  # first E6 runtime dependency") is firing now — `[E6.F1.H1]` is expected to add
  # the CLI parser and terminal-style deps, so this file needs a follow-up touch
  # once that change's design ratifies them.
  # Next refresh trigger: E6 runtime deps merged, or E7 (release pipeline).
  refresh_recommended: false
  refresh_reason_codes: []
  observed_files:
    manifests:
      - package.json
    lockfiles:
      - package-lock.json
    docs:
      - CLAUDE.md
      - docs/prd-sentinel.md
      - docs/setup-tecnico-sentinel.md
      - docs/backlog-mvp-sentinel.md
      - docs/architecture.md
      - docs/coding-standards.md
      - docs/testing.md
      - docs/engines/claude-code.md
      - docs/engines/opencode.md
    tool_configs:
      - tsconfig.json
      - biome.json
      - .dependency-cruiser.cjs
      - vitest.config.ts
      - tsup.config.ts
  observed_paths:
    source_roots:
      - src
    test_roots:
      - src/core/history/__test__
      - src/core/repos/__test__
      - src/core/review/__test__
      - src/core/run/__test__
      - src/core/workspace/__test__
      - src/adapters/driven/engines/__test__
      - src/adapters/driven/engines/claude-code/__test__
      - src/adapters/driven/engines/opencode/__test__
      - src/adapters/driven/exec/__test__
      - src/adapters/driven/git/__test__
      - src/adapters/driven/storage/__test__
    fixture_roots:
      - fixtures
    config_roots:
      - .

conventions:
  persisted_language: en
  persisted_artifacts_english_only: true
