      method: copy
      installed_at: "2026-08-01T13:14:29Z"
      skills:
        - sddl-init
        - sddl-proposal
        - sddl-spec
        - sddl-design
        - sddl-plan
        - sddl-executor
        - sddl-code-review
        - sddl-judgment-day
        - sddl-deep-explorer
        - sddl-qa-review
  wrappers_injected:
